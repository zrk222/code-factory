<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Code Factory operational proof loop</title>
  <desc id="description">A plain-language outcome, fuzzy PRD, or risky diff enters local Code Factory tools. The tools scope work, inspect evidence, verify supplied checks and receipts, and show Graph Ops for a human review decision. The loop has no authority to publish, deploy, sign, or approve.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="0.56" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-18%" width="132%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1,1 L12,6.5 L1,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 52px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 24px; fill: #475569; }
      .number { font-size: 18px; font-weight: 800; fill: #1d4ed8; letter-spacing: 1.4px; }
      .card-title { font-size: 27px; font-weight: 800; fill: #10233f; }
      .body { font-size: 19px; fill: #334155; }
      .tag { font-size: 16px; font-weight: 750; fill: #0f4c5c; }
      .caption { font-size: 18px; fill: #475569; }
      .card { fill: #ffffff; stroke: #dbeafe; stroke-width: 2; filter: url(#shadow); }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 5; stroke-linecap: round; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="52" y="44" width="1496" height="812" rx="28" fill="#ffffff" fill-opacity=".74" stroke="#dbeafe" stroke-width="2"/>

  <g class="sans">
    <text class="title" x="104" y="122">How Code Factory keeps “done” honest</text>
    <text class="subtitle" x="104" y="164">Local work stays reviewable: it turns intent into evidence and leaves the release decision with people.</text>

    <g transform="translate(104 252)">
      <rect class="card" width="252" height="286" rx="20"/>
      <rect x="24" y="24" width="81" height="34" rx="17" fill="#dbeafe"/>
      <text class="number" x="43" y="47">01 START</text>
      <text class="card-title" x="24" y="101">Bring the work</text>
      <text class="body" x="24" y="144">Plain-language outcome</text>
      <text class="body" x="24" y="176">Fuzzy PRD</text>
      <text class="body" x="24" y="208">AI-assisted diff</text>
      <rect x="24" y="234" width="204" height="30" rx="15" fill="#eef2ff"/>
      <text class="tag" x="42" y="255">Nothing is assumed complete</text>
    </g>

    <path class="arrow" d="M372 395 H438"/>

    <g transform="translate(454 252)">
      <rect class="card" width="252" height="286" rx="20"/>
      <rect x="24" y="24" width="89" height="34" rx="17" fill="#e0f2fe"/>
      <text class="number" x="43" y="47">02 SHAPE</text>
      <text class="card-title" x="24" y="101">Scope the proof</text>
      <text class="body" x="24" y="144">MVP starter</text>
      <text class="body" x="24" y="176">PRD Grill</text>
      <text class="body" x="24" y="208">Contradiction gate</text>
      <rect x="24" y="234" width="204" height="30" rx="15" fill="#ecfeff"/>
      <text class="tag" x="43" y="255">Questions before code grows</text>
    </g>

    <path class="arrow" d="M722 395 H788"/>

    <g transform="translate(804 252)">
      <rect class="card" width="252" height="286" rx="20"/>
      <rect x="24" y="24" width="98" height="34" rx="17" fill="#ede9fe"/>
      <text class="number" x="43" y="47">03 INSPECT</text>
      <text class="card-title" x="24" y="101">Find proof gaps</text>
      <text class="body" x="24" y="144">Requirement coverage</text>
      <text class="body" x="24" y="176">Change review</text>
      <text class="body" x="24" y="208">Declared checks</text>
      <rect x="24" y="234" width="204" height="30" rx="15" fill="#f5f3ff"/>
      <text class="tag" x="43" y="255">Flag a test that cannot fail</text>
    </g>

    <path class="arrow" d="M1072 395 H1138"/>

    <g transform="translate(1154 252)">
      <rect class="card" width="342" height="286" rx="20"/>
      <rect x="24" y="24" width="91" height="34" rx="17" fill="#dcfce7"/>
      <text class="number" x="43" y="47">04 VERIFY</text>
      <text class="card-title" x="24" y="101">Bind the evidence</text>
      <text class="body" x="24" y="144">Deterministic check results</text>
      <text class="body" x="24" y="176">Hash-bound receipts</text>
      <text class="body" x="24" y="208">Independent verifier evidence</text>
      <rect x="24" y="234" width="294" height="30" rx="15" fill="#ecfdf5"/>
      <text class="tag" x="43" y="255">A worker cannot certify itself</text>
    </g>

    <path class="arrow" d="M1325 555 V617 H812"/>

    <g transform="translate(552 642)">
      <rect width="580" height="132" rx="22" fill="#10233f" filter="url(#shadow)"/>
      <rect x="26" y="25" width="111" height="31" rx="15.5" fill="url(#accent)"/>
      <text x="47" y="47" class="sans" font-size="16" font-weight="800" fill="#ffffff" letter-spacing="1.2">GRAPH OPS</text>
      <text x="26" y="91" class="sans" font-size="28" font-weight="800" fill="#ffffff">One evidence-backed next action</text>
      <text x="26" y="116" class="sans" font-size="17" fill="#bfdbfe">Receipts show what exists, what is blocked, and what a reviewer needs next.</text>
    </g>

    <path d="M104 596 H1496" stroke="#cbd5e1" stroke-width="2"/>
    <text class="caption" x="104" y="640">Code Factory is deliberately local-first. It creates and inspects artifacts; it does not silently call a model, access credentials, publish, deploy, sign, or approve.</text>
    <text class="caption" x="104" y="812">Human review remains the final release boundary.</text>
  </g>
</svg>

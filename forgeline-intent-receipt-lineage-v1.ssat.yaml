feature: forgeline-intent-receipt-lineage-v1
version: "1.0"
intent: "Expose the exact local Forge ship-line source for already hash-bound intent evidence without granting authority."
requirements:
  - id: REQ_INTENT_LINEAGE_SOURCE
    description: "A bound adapter exposes the normalized Forge receipt source and exact 1-based ship-line number used for hashing."
    invariant: "REQ_INTENT_LINEAGE_SOURCE"
    checks:
      - "REQ_INTENT_LINEAGE_SOURCE"
      - "forge_receipt_source"
      - "forge_receipt_line"
      - "GRAPH_OPS_INTENT_ADAPTER_LINEAGE"
  - id: REQ_INTENT_LINEAGE_FAIL_CLOSED
    description: "Missing, malformed, or unbound sources expose no fabricated lineage and remain untraceable."
    invariant: "REQ_INTENT_LINEAGE_FAIL_CLOSED"
    checks:
      - "REQ_INTENT_LINEAGE_FAIL_CLOSED"
      - "provenance_status"
      - "intent_trace_unbound_count"
      - "GRAPH_OPS_INTENT_ADAPTER_UNBOUND"
  - id: REQ_INTENT_LINEAGE_FACTS
    description: "Lineage facts retain both hashes and false authority flags."
    invariant: "REQ_INTENT_LINEAGE_FACTS"
    checks:
      - "REQ_INTENT_LINEAGE_FACTS"
      - "observed_forge_receipt_sha256"
      - "authority"
      - "execution"
  - id: REQ_INTENT_LINEAGE_UI
    description: "The read-only panel shows source and line without execution or repair controls."
    invariant: "REQ_INTENT_LINEAGE_UI"
    checks:
      - "REQ_INTENT_LINEAGE_UI"
      - "Forge source"
      - "Forge line"
      - "GRAPH_OPS_INTENT_LINEAGE_NO_CONTROLS"
gates:
  - type: test
    command: "py -3.11 -m pytest -q tests/test_graph_ops.py -k lineage"
  - type: smoke
    command: "python -c \"from pathlib import Path; source=Path('factoryline/graph_ops.py').read_text(encoding='utf-8'); page=Path('factoryline/graph_ops.html').read_text(encoding='utf-8'); required=['REQ_INTENT_LINEAGE_SOURCE','REQ_INTENT_LINEAGE_FAIL_CLOSED','REQ_INTENT_LINEAGE_FACTS','REQ_INTENT_LINEAGE_UI','forge_receipt_source','forge_receipt_line','GRAPH_OPS_INTENT_ADAPTER_LINEAGE','Forge source','Forge line','GRAPH_OPS_INTENT_LINEAGE_NO_CONTROLS']; assert all(item in source+page for item in required) and 'innerHTML' not in page\""

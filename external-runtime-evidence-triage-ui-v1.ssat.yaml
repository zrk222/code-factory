name: external-runtime-evidence-triage-ui-v1
language: python
modules:
  - name: graph_ops
    path: factoryline/graph_ops.py
    functions:
      - name: graph_ops_html
        args: ["token"]
        returns: str
        doc: "Serve the local Graph Ops page without adding external runtime authority."
dependencies: []
invariants:
  - name: triage_ui_has_no_external_effects
    forbid_pattern: "requests\\.|httpx\\.|urllib\\.|socket\\.|subprocess\\.|\\b(?:publish|deploy|sign|send_message|grant_connector)\\s*\\(|innerHTML"
    scopes:
      - module: graph_ops
        symbol: graph_ops_html
        max_lines: 20

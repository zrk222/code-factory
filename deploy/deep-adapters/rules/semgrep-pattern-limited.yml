  - id: java.parameter-sql-text
    message: A method parameter is concatenated or formatted into SQL text; use a PreparedStatement placeholder or a bound query parameter instead.
    severity: INFO
    languages: [java]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: $RET $M(..., $T $P, ...) { ... }
              - pattern-inside: $M(..., $T $P, ...) { ... }
          # A parameter that carries the statement itself is query text, not a value.
          - metavariable-regex: {metavariable: $P, regex: '^(?!(?i:sql|stmt|statement|clause|where|fragment|expr|expression|condition|hql|jpql)$)\w+$'}
          - focus-metavariable: $P
    pattern-sanitizers:
      - pattern: Integer.parseInt(...)
      - pattern: Long.parseLong(...)
      - pattern: $X.getClass().getName()
      - patterns:
          - pattern-either:
              - pattern: $F(...)
              - pattern: $O.$F(...)
          # Validation, allow-list and quoting helpers return a value the caller has vetted.
          - metavariable-regex: {metavariable: $F, regex: '(?i)^\w*(valid|sanitiz|escape|quote|allow|whitelist)\w*$'}
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '"$SQL" + $X'
              - pattern: '$A + "$SQL" + $X'
          # Literal gate for OpenGrep's prefilter (the taint source has none): without it every
          # Java file is fully parsed. The match spans the literal and its concatenated operand.
          - pattern-regex: '(?i)"[^"\n]*\b(?:select|insert|update|delete|create|merge|where|order|group|having|values|and|or|set|from|into)\b[^"\n]*"\s*\+(?!\s*")[^;]*'
          - metavariable-regex:
              metavariable: $SQL
              regex: '(?is)^\s*(?:select\b.*\bfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b|create\s+(?:temp\w*\s+)?table\b|merge\s+into\b)|.*?\b(?:where|and|or)\s+[\w.]+\s*(?:=|<>|!=|<=|>=|<|>|like|in)\s*\(?\s*''?\s*$|\s*(?:where|order\s+by|group\s+by|having)\b|.*?\b(?:where|and|or|set)\s+[\w.]+\s*(?:=|<>|!=|<=|>=|<|>|like|in)\s*\(?\s*''?%s|.*?\bvalues\s*\([^)]*%s'
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: 'String.format("$SQL", ...)'
              - pattern: '"$SQL".formatted(...)'
          # Gate on the call itself: a bare "format" literal also matches words like "information".
          - pattern-regex: '(?s)(?:\bString\s*\.\s*format|"\s*\.\s*formatted)\s*\([^;]*'
          # Only string placeholders carry text; %d and the like format numbers.
          - metavariable-regex: {metavariable: $SQL, regex: '(?s).*%s'}
          - metavariable-regex:
              metavariable: $SQL
              regex: '(?is)^\s*(?:select\b.*\bfrom\b|insert\s+into\b|update\s+\S+\s+set\b|delete\s+from\b|create\s+(?:temp\w*\s+)?table\b|merge\s+into\b)|.*?\b(?:where|and|or)\s+[\w.]+\s*(?:=|<>|!=|<=|>=|<|>|like|in)\s*\(?\s*''?\s*$|\s*(?:where|order\s+by|group\s+by|having)\b|.*?\b(?:where|and|or|set)\s+[\w.]+\s*(?:=|<>|!=|<=|>=|<|>|like|in)\s*\(?\s*''?%s|.*?\bvalues\s*\([^)]*%s'
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/testdata/**", "**/test_data/**", "**/test-data/**", "**/fixtures/**", "**/src/test/**", "**/*_test.go", "**/test_*.py", "**/*_test.py", "**/*.test.js", "**/*.test.ts", "**/*.spec.js", "**/*.spec.ts", "**/*Test.java", "**/*Tests.java", "**/*Test.cs", "**/*Tests.cs", "**/*_test.rs", "**/*_spec.rb", "**/exploits/**", "**/exploit/**", "**/poc/**", "**/pocs/**", "**/CVE-*/**", "**/cve-*/**", "**/*.generated.*", "**/*_generated.*", "**/generated/**", "**/__generated__/**", "**/*_pb2.py", "**/*.pb.go", "**/Lib/site-packages/**", "**/site-packages/**", "**/*venv*/**", "**/node_modules/**", "**/vendor/**", "**/third_party/**", "**/third-party/**", "**/bower_components/**", "**/.history/**", "**/*.min.js", "**/tests.rs", "**/test_utils.rs", "**/test_util.rs", "**/testutil/**", "**/testutils/**", "**/TestUtils/**", "**/Pods/**", "**/Carthage/**", "**/spec/**", "**/migrations/**", "**/tests.py"]

  - id: python.disabled-tls-verification
    message: TLS certificate validation is disabled; enable verification and configure trusted certificates.
    severity: INFO
    languages: [python]
    patterns:
      # An explicit operator opt-in (if args.insecure / cfg.Insecure) is a deliberate choice.
      - pattern-not-inside:
          patterns:
            - pattern-inside: |
                if $OPTIN:
                  ...
            - metavariable-regex:
                metavariable: $OPTIN
                regex: (?i).*(insecure|skip_?verify|no_?verify|allow_?invalid|self_?signed|dev_?mode|unsafe_?tls).*
      - pattern: requests.$METHOD(..., verify=False, ...)
      # Report only connections that carry credentials or session material;
      # unauthenticated probes of public endpoints are not a credential exposure.
      - pattern-either:
          - pattern: requests.$METHOD(..., auth=$CREDENTIAL, ...)
          - pattern: requests.$METHOD(..., cert=$CREDENTIAL, ...)
          - pattern: requests.$METHOD(..., cookies=$CREDENTIAL, ...)
          - patterns:
              - pattern-inside: |
                  def $FUNCTION(...):
                    $...BODY
              - metavariable-pattern:
                  metavariable: $...BODY
                  language: generic
                  patterns:
                    - pattern-regex: (?i)(authorization|bearer|\w*token\b|\w*secret\b|\bpassword\b|\bpwd\b|api[_-]?key|cookie|credential|\bauth\s*=)
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/testdata/**", "**/test_data/**", "**/test-data/**", "**/fixtures/**", "**/src/test/**", "**/*_test.go", "**/test_*.py", "**/*_test.py", "**/*.test.js", "**/*.test.ts", "**/*.spec.js", "**/*.spec.ts", "**/*Test.java", "**/*Tests.java", "**/*Test.cs", "**/*Tests.cs", "**/*_test.rs", "**/*_spec.rb", "**/exploits/**", "**/exploit/**", "**/poc/**", "**/pocs/**", "**/CVE-*/**", "**/cve-*/**", "**/*Generated*", "**/*generated*", "**/*_pb2.py", "**/*.pb.go", "**/Lib/**", "**/site-packages/**", "**/*venv*/**", "**/node_modules/**", "**/vendor/**", "**/third_party/**", "**/third-party/**", "**/bower_components/**", "**/.history/**", "**/*.min.js", "**/wp-admin/**", "**/wp-includes/**", "**/tests.rs", "**/test_utils.rs", "**/test_util.rs", "**/testutil/**", "**/testutils/**", "**/TestUtils/**"]

        - metavariable-regex:
            metavariable: $ASSIGN
            regex: ^["'], [A-Za-z_]\w*\s*=\s*["']$
        - pattern-regex: (?m)\$[A-Za-z_]\w*\s*\.\s*=\s*[\x22\x27], [A-Za-z_]\w*\s*=\s*[\x22\x27]\s*\.\s*\$this->[A-Za-z_]\w*\s*;

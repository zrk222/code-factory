rules:
  - id: python.subprocess-shell-true
    message: subprocess invocation enables shell parsing
    severity: WARNING
    languages: [python]
    patterns:
      - pattern: subprocess.$FUNC(..., shell=True, ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: ^(run|Popen|call|check_call|check_output)$
    metadata:
      category: security
      confidence: MEDIUM
      technology: [python]
      cwe: ["CWE-78"]
  - id: python.request-command-injection
    message: Request data reaches command execution; use argv without shell parsing and validate allowed operations.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
    pattern-sinks:
      - pattern: os.system($VALUE)
      - pattern: os.popen($VALUE)
      - patterns:
          - pattern: subprocess.$FUNC($VALUE, ..., shell=True, ...)
          - focus-metavariable: $VALUE
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-78"]
  - id: python.request-sql-injection
    message: Request data reaches SQL text; bind values as query parameters instead of formatting SQL.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
    pattern-sinks:
      - patterns:
          - pattern: '$DB.execute($QUERY, ...)'
          - focus-metavariable: $QUERY
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-89"]
  - id: python.unsafe-deserialization
    message: Unsafe deserialization can execute code; use a non-executable format and validate its schema.
    severity: WARNING
    languages: [python]
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: yaml.unsafe_load(...)
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-502"]
  - id: python.disabled-tls-verification
    message: TLS certificate validation is disabled; enable verification and configure trusted certificates.
    severity: WARNING
    languages: [python]
    pattern: requests.$METHOD(..., verify=False, ...)
    metadata:
      category: security
      confidence: HIGH
      cwe: ["CWE-295"]
  - id: javascript.request-command-injection
    message: Request data reaches a shell command; use execFile with validated arguments.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: '$REQ.query'
      - pattern: '$REQ.body'
      - pattern: '$REQ.params'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($COMMAND, ...)
              - pattern: child_process.execSync($COMMAND, ...)
          - focus-metavariable: $COMMAND
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-78"]
  - id: javascript.request-sql-injection
    message: Request data reaches SQL text; bind query parameters instead of concatenating values.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: '$REQ.query'
      - pattern: '$REQ.body'
      - pattern: '$REQ.params'
    pattern-sinks:
      - patterns:
          - pattern: '$DB.query($QUERY, ...)'
          - focus-metavariable: $QUERY
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-89"]
  - id: javascript.request-html-injection
    message: Request data reaches an HTML response; encode output for its context or use an escaping template.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: '$REQ.query'
      - pattern: '$REQ.body'
      - pattern: '$REQ.params'
    pattern-sinks:
      - patterns:
          - pattern: '$RES.send($HTML)'
          - focus-metavariable: $HTML
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-79"]
  - id: python.request-path-traversal
    message: Request data reaches a filesystem path; resolve against an allowed root and enforce containment before access.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
      - pattern: request.GET[...]
      - pattern: request.POST[...]
    pattern-sinks:
      - patterns:
          - pattern: open($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: pathlib.Path($PATH).read_text(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: pathlib.Path($PATH).read_bytes(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: pathlib.Path($PATH).open(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: Path($PATH).read_text(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: Path($PATH).read_bytes(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: Path($PATH).open(...)
          - focus-metavariable: $PATH
    metadata:
      category: security
      confidence: MEDIUM
      scope: Local request args/form/GET/POST to open and pathlib read paths; containment sanitizers require review.
      cwe: ["CWE-22"]
  - id: javascript.request-path-traversal
    message: Request data reaches a filesystem path; resolve against an allowed root and enforce containment before access.
    severity: ERROR
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: '$REQ.query'
      - pattern: '$REQ.body'
      - pattern: '$REQ.params'
    pattern-sinks:
      - patterns:
          - pattern: fs.readFile($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: fs.readFileSync($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: fs.promises.readFile($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: fs.createReadStream($PATH, ...)
          - focus-metavariable: $PATH
    metadata:
      category: security
      confidence: MEDIUM
      scope: Local query/body/params to fs read paths; containment sanitizers require review.
      cwe: ["CWE-22"]
  - id: php.request-command-injection
    message: Request data reaches a shell-command candidate; use a fixed executable and validated argument boundaries.
    severity: WARNING
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: '$_GET[...]'
        exact: true
      - pattern: '$_POST[...]'
        exact: true
      - pattern: '$_REQUEST[...]'
        exact: true
      - pattern: '$_COOKIE[...]'
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: system($VALUE, ...)
              - pattern: \system($VALUE, ...)
              - pattern: exec($VALUE, ...)
              - pattern: \exec($VALUE, ...)
              - pattern: shell_exec($VALUE)
              - pattern: \shell_exec($VALUE)
              - pattern: passthru($VALUE, ...)
              - pattern: \passthru($VALUE, ...)
              - pattern: popen($VALUE, ...)
              - pattern: \popen($VALUE, ...)
              - pattern: 'system(..., command: $VALUE, ...)'
              - pattern: '\system(..., command: $VALUE, ...)'
              - pattern: 'exec(..., command: $VALUE, ...)'
              - pattern: '\exec(..., command: $VALUE, ...)'
              - pattern: 'shell_exec(..., command: $VALUE, ...)'
              - pattern: '\shell_exec(..., command: $VALUE, ...)'
              - pattern: 'passthru(..., command: $VALUE, ...)'
              - pattern: '\passthru(..., command: $VALUE, ...)'
              - pattern: 'popen(..., command: $VALUE, ...)'
              - pattern: '\popen(..., command: $VALUE, ...)'
          - focus-metavariable: $VALUE
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-78"]
      scope: PHP .php local request taint only; callee provider identity unresolved, no framework or interprocedural guarantee.
  - id: php.request-sql-injection
    message: Request data reaches procedural SQL text; bind values to fixed SQL instead of concatenating SQL.
    severity: WARNING
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: '$_GET[...]'
        exact: true
      - pattern: '$_POST[...]'
        exact: true
      - pattern: '$_REQUEST[...]'
        exact: true
      - pattern: '$_COOKIE[...]'
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: mysqli_query($DB, $VALUE, ...)
              - pattern: \mysqli_query($DB, $VALUE, ...)
              - pattern: mysqli_multi_query($DB, $VALUE)
              - pattern: \mysqli_multi_query($DB, $VALUE)
              - pattern: mysqli_prepare($DB, $VALUE)
              - pattern: \mysqli_prepare($DB, $VALUE)
              - pattern: pg_query($VALUE)
              - pattern: \pg_query($VALUE)
              - pattern: pg_query($DB, $VALUE)
              - pattern: \pg_query($DB, $VALUE)
              - pattern: pg_query_params($VALUE, $PARAMS)
              - pattern: \pg_query_params($VALUE, $PARAMS)
              - pattern: pg_query_params($DB, $VALUE, $PARAMS)
              - pattern: \pg_query_params($DB, $VALUE, $PARAMS)
              - pattern: 'mysqli_query(..., query: $VALUE, ...)'
              - pattern: '\mysqli_query(..., query: $VALUE, ...)'
              - pattern: 'mysqli_multi_query(..., query: $VALUE, ...)'
              - pattern: '\mysqli_multi_query(..., query: $VALUE, ...)'
              - pattern: 'mysqli_prepare(..., query: $VALUE, ...)'
              - pattern: '\mysqli_prepare(..., query: $VALUE, ...)'
              - pattern: 'pg_query(..., query: $VALUE, ...)'
              - pattern: '\pg_query(..., query: $VALUE, ...)'
              - pattern: 'pg_query(connection: $VALUE)'
              - pattern: '\pg_query(connection: $VALUE)'
              - pattern: 'pg_query_params(..., query: $VALUE, ..., params: $PARAMS, ...)'
              - pattern: 'pg_query_params($DB, $VALUE, params: $PARAMS)'
              - pattern: 'pg_query_params(connection: $VALUE, query: $PARAMS)'
              - pattern: 'pg_query_params($VALUE, query: $PARAMS)'
              - pattern: '\pg_query_params(..., query: $VALUE, ..., params: $PARAMS, ...)'
              - pattern: '\pg_query_params($DB, $VALUE, params: $PARAMS)'
              - pattern: '\pg_query_params(connection: $VALUE, query: $PARAMS)'
              - pattern: '\pg_query_params($VALUE, query: $PARAMS)'
          - focus-metavariable: $VALUE
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-89"]
      scope: PHP .php local request taint only; callee provider identity unresolved, no framework or interprocedural guarantee.
  - id: php.request-path-traversal
    message: Request data reaches a filesystem operand; normalize and enforce allowed-root containment before access.
    severity: WARNING
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: '$_GET[...]'
        exact: true
      - pattern: '$_POST[...]'
        exact: true
      - pattern: '$_REQUEST[...]'
        exact: true
      - pattern: '$_COOKIE[...]'
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: file_get_contents($VALUE, ...)
              - pattern: \file_get_contents($VALUE, ...)
              - pattern: fopen($VALUE, ...)
              - pattern: \fopen($VALUE, ...)
              - pattern: readfile($VALUE, ...)
              - pattern: \readfile($VALUE, ...)
              - pattern: file_put_contents($VALUE, ...)
              - pattern: \file_put_contents($VALUE, ...)
              - pattern: 'file_get_contents(..., filename: $VALUE, ...)'
              - pattern: '\file_get_contents(..., filename: $VALUE, ...)'
              - pattern: 'fopen(..., filename: $VALUE, ...)'
              - pattern: '\fopen(..., filename: $VALUE, ...)'
              - pattern: 'readfile(..., filename: $VALUE, ...)'
              - pattern: '\readfile(..., filename: $VALUE, ...)'
              - pattern: 'file_put_contents(..., filename: $VALUE, ...)'
              - pattern: '\file_put_contents(..., filename: $VALUE, ...)'
          - focus-metavariable: $VALUE
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-22"]
      scope: PHP .php local request taint only; callee provider identity unresolved, no framework or interprocedural guarantee.
  - id: php.request-file-inclusion
    message: Request data reaches an inclusion operand; use a fixed allowlist of local includes.
    severity: WARNING
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: '$_GET[...]'
        exact: true
      - pattern: '$_POST[...]'
        exact: true
      - pattern: '$_REQUEST[...]'
        exact: true
      - pattern: '$_COOKIE[...]'
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: include $VALUE
              - pattern: include_once $VALUE
              - pattern: require $VALUE
              - pattern: require_once $VALUE
          - focus-metavariable: $VALUE
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-98"]
      scope: PHP .php local request taint only; callee provider identity unresolved, no framework or interprocedural guarantee.
  - id: php.request-unsafe-deserialization
    message: Request data reaches unserialize; use a non-executable format with schema validation.
    severity: WARNING
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: '$_GET[...]'
        exact: true
      - pattern: '$_POST[...]'
        exact: true
      - pattern: '$_REQUEST[...]'
        exact: true
      - pattern: '$_COOKIE[...]'
        exact: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: unserialize($VALUE, ...)
              - pattern: \unserialize($VALUE, ...)
              - pattern: 'unserialize(..., data: $VALUE, ...)'
              - pattern: '\unserialize(..., data: $VALUE, ...)'
          - focus-metavariable: $VALUE
    metadata:
      category: security
      confidence: MEDIUM
      cwe: ["CWE-502"]
      scope: PHP .php local request taint only; callee provider identity unresolved, no framework or interprocedural guarantee.

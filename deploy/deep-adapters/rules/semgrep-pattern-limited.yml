                      self.$PATH = pathlib.Path($P).resolve()
                      self.$SAVED = self.$PATH
                      return
                  - metavariable-regex:
                      metavariable: $PATH
                      regex: ^(?i)\w*(path|filename)\w*$
                - patterns:
                  - pattern-inside: "def $F(...):\n  ...\n"
                  - pattern-either:
                    - pattern-inside: return $BASE / $RHS
                    - pattern-inside: return os.path.join($BASE, ...)
                    - pattern-inside: return Path($BASE, ...)
                  - metavariable-regex:
                      metavariable: $F
                      regex: ^(?i)_*\w*(path|file)\w*$
                  - metavariable-regex:
                      metavariable: $BASE
                      regex: ^(?:(?:self|cls)\.\w+(?:\.\w+)*|[A-Z][A-Z0-9_]*)$
              - pattern-not-inside:
                  patterns:
                  - pattern-either:
                    - patterns:
                      - pattern-inside: "$V = $E\nif $COND:\n  $...BEFORE\n  $EXIT\n"
                      - metavariable-regex:
                          metavariable: $EXIT
                          regex: ^(raise|return|continue)\b
                      - metavariable-pattern:
                          metavariable: $E
                          patterns:
                          - pattern-either:
                            - pattern: os.path.join($B, ..., $Q, ...)

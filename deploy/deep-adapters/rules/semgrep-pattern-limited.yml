          - metavariable-regex: {metavariable: $P, regex: '^(?!(?i:req|request|r|ctx|c|context|w|writer|response|res|resp|sql|query|stmt|statement|clause|where|fragment|expr|condition|q|raw|db|conn|client|knex|app|application|server|router|plugin|logger)$)\w+$'}
    pattern-sanitizers:
      - pattern: parseInt(...)
      - pattern: Number(...)
      - pattern: $DB.escape(...)
      - pattern: $DB.escapeId(...)
      - pattern: mysql.escape(...)
      - pattern: format(...)
      # Identifier quoting and escaping helpers (escapeIdentifier, quoteIdent, format.ident).
      - patterns:
          - pattern-either:
              - pattern: $QF(...)
              - pattern: $QO.$QF(...)
          - metavariable-regex: {metavariable: $QF, regex: '(?i)^(?:\w*(?:escape|quote)\w*|ident)$'}

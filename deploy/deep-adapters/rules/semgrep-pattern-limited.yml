          - pattern-either:
            - pattern: $A . $B
            - pattern: sprintf(...)
            - pattern: '"..."'
            - pattern-regex: ^\$\w+$
      - focus-metavariable: $Q
    - requires: PARAM
      patterns:
      - pattern: $LIT . $X
      - metavariable-regex:
          metavariable: $LIT
          regex: (?s)\A(?=(?:"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')\z)(?:(?is)\A.*?\b(select\s[\s\S]*\sfrom|insert\s+into|update\s+\S+\s+set|delete\s+from|(where|and|or)\s+[\w.`]+\s*(=|<>|!=|<|>|like|in)|[\w.`]+\s+like\s+\\?['\"%]).*?(=\s*|like\s*|in\s*\(\s*|\\'%?|"%?|'%?)['"]\z)

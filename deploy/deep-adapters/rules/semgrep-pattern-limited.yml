  - id: python.unsafe-deserialization
    message: Unsafe deserialization can execute code; use a non-executable format and validate its schema.
    severity: WARNING
    languages: [python]
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.$ATTR
              - pattern: request.$ATTR(...)
          - metavariable-regex:
              metavariable: $ATTR
              regex: ^(data|body|form|args|values|files|json|stream|get_data|get_json|POST|GET|FILES|read)$
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$SERVER.on(...)
                  def $HANDLER(..., $PAYLOAD, ...): ...
              - pattern-inside: |
                  @$SERVER.on(...)
                  async def $HANDLER(..., $PAYLOAD, ...): ...
              - pattern-inside: |
                  @$SERVER.event
                  def $HANDLER(..., $PAYLOAD, ...): ...
          - pattern: $PAYLOAD
    pattern-sinks:
      - pattern-either:
          - pattern: pickle.loads(...)
          - pattern: pickle.load(...)
          - pattern: yaml.unsafe_load(...)
    paths:

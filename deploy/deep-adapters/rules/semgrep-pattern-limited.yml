            \t]*;\s*\$[A-Za-z_]\w*\s*\.\s*=\s*[\x22\x27], [A-Za-z_]\w*\s*=\s*[\x22\x27]\s*\.\s*\$this->\k<CAST_FIELD>\s*;
        - pattern-regex: (?ms)^[ \t]*public[ \t]+\$(?<UNTYPED_FIELD>[A-Za-z_]\w*)[ \t]*;(?:(?!^[ \t]*(?:class|trait|interface)\s).)*?\$this->\k<UNTYPED_FIELD>\s*=\s*\$this->\k<UNTYPED_FIELD>\s*\?\s*\$this->\k<UNTYPED_FIELD>\s*:\s*0\s*;(?:(?!^[
            \t]*(?:class|trait|interface)\s).)*?\$[A-Za-z_]\w*\s*\.\s*=\s*[\x22\x27], [A-Za-z_]\w*\s*=\s*[\x22\x27]\s*\.\s*\$this->\k<UNTYPED_FIELD>\s*;
        - focus-metavariable: $VALUE
      - label: PARAM
        patterns:

  - id: javascript.request-html-injection
    message: Request data reaches an HTML response; encode output for its context or use an escaping template.
    severity: INFO
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: '$REQ.query'
      - pattern: '$REQ.body'
      - pattern: '$REQ.params'
    options:
      symbolic_propagation: true
    pattern-sanitizers:
      # if (!isValidIp(ip)) return; allowed.has(id); url.includes(name)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $CHECK($X)
              - pattern: $OBJ.$CHECK($X)
          - metavariable-regex:
              metavariable: $CHECK
              regex: ^(is_?[Vv]alid|[Vv]alidate|has|includes)[A-Za-z0-9_]*$
          - focus-metavariable: $X
    pattern-sinks:
      # Only string-building or direct request values can become HTML markup.
      # Objects (JSON), buffers and helper results need review in other lanes.
      - patterns:
          - pattern-either:
              - pattern: '$RES.send(`...`)'
              - pattern: '$RES.send("..." + $X)'
              - pattern: '$RES.send($X + "...")'
              - pattern: '$RES.send($REQ.$SOURCE.$FIELD)'
              - pattern: '$RES.send($REQ.$SOURCE[$FIELD])'
          - pattern: '$RES.send($HTML)'
          - focus-metavariable: $HTML

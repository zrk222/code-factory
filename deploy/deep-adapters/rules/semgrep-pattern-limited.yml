      # const q = (name) => qi.quoteIdentifier(name)), called in the same function.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  $QA = $QO.$QF.bind(...);
                  ...
              - pattern-inside: |
                  $QA = $QO.$QF;
                  ...
              - pattern-inside: |
                  $QA = ($QN) => $QO.$QF($QN);
                  ...
          - pattern: $QA(...)
          - metavariable-regex: {metavariable: $QA, regex: '^[A-Za-z_$][\w$]*$'}
          - metavariable-regex: {metavariable: $QF, regex: '(?i)^(?:\w*(?:escape|quote)\w*|ident)$'}

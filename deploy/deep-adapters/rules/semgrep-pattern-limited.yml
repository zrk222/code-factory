            function $F(...) {
              ...
              $this->$PROPERTY = $this->$PROPERTY ? $this->$PROPERTY : 0;
              ...
              $SQL = $START . $PREFIX . $TABLE;
              ...
              $SQL .= $ASSIGN . $this->$PROPERTY;
              ...
              $RESULT = $this->$DRIVER->query($SQL);

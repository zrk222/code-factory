  - id: javascript.request-html-injection
    message: Request data reaches an HTML response; encode output for its context or use an escaping template.
    severity: INFO
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: '$REQ.query'
      - pattern: '$REQ.body'
      - pattern: '$REQ.params'
    options:
      symbolic_propagation: true
    pattern-sanitizers:
      # if (!isValidIp(ip)) return; allowed.has(id); url.includes(name)
      - by-side-effect: true
        patterns:
          - pattern-either:

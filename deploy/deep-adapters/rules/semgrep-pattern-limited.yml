      - pattern: '$REQ.body'
      - pattern: '$REQ.params'
    pattern-sanitizers:
      # if (!isValidIp(ip)) return; allowed.has(id); url.includes(name)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $CHECK($X)
              - pattern: $OBJ.$CHECK($X)
          - metavariable-regex:
              metavariable: $CHECK
              regex: ^(is_?[Vv]alid|[Vv]alidate|has|includes)[A-Za-z0-9_]*$
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern: '$DB.query($QUERY, ...)'
          - pattern-not: '$DB.query({...}, ...)'
          - focus-metavariable: $QUERY
    paths:

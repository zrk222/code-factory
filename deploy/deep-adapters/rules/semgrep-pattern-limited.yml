  - id: python.parameter-path-join-without-containment
    message: A function parameter or collection item forms a filesystem path without a bound containment check.
    severity: INFO
    languages: [python]
    patterns:
      - pattern-either:
          - patterns:
              # Every positive match is inside a function. Skip function-free modules before matching.
              - pattern-regex: '(?s)\A(?=.*\bdef\b).*'
              - pattern-either:
                - pattern-inside: "def $F(..., $P, ...):\n  ...\n"
                - pattern-inside: "def $F(..., $D, ...):\n  ...\n  for $P, $VAL in $D.items():\n    ...\n"
                - pattern-inside: "def $F(..., $D, ...):\n  ...\n  for $P, $VAL in ($D or {}).items():\n    ...\n"
                - pattern-inside: "def $F(self, ...):\n  ...\n  for $P, $VAL in self.$A.items():\n    ...\n"
              - pattern-either:
                - pattern: os.path.join($BASE, ..., $P, ...)
                - pattern: os.path.join($BASE, ..., f"...{$P}...", ...)
                - pattern: os.path.join($BASE, ..., $P.strip(...), ...)
                - pattern: os.path.join($BASE, ..., $P.lstrip(...), ...)
                - pattern: os.path.join($BASE, ..., $P.rstrip(...), ...)
                - pattern: $BASE / $P.strip(...)
                - patterns:
                  - pattern: $BASE / $P.lstrip(...)
                  - pattern-not: Path($ROOT) / $P.lstrip(...)
                - patterns:
                  - pattern: $BASE / $P.lstrip(...)
                  - pattern: Path($ROOT) / $P.lstrip(...)
                  - pattern-either:
                    - patterns:
                      - pattern-inside: $SINK(..., Path($ROOT) / $P.lstrip(...), ...)
                      - metavariable-regex:
                          metavariable: $SINK
                          regex: ^(open|io\.open|os\.remove|os\.unlink|os\.makedirs|os\.rename|os\.replace|shutil\.\w+|send_file|send_from_directory|FileResponse|os\.listdir|os\.scandir)$
                    - patterns:
                      - pattern-inside: '$OUT = Path($ROOT) / $P.lstrip(...)

                          ...

                          $SINK(..., $OUT, ...)

                          '
                      - metavariable-regex:
                          metavariable: $SINK
                          regex: ^(open|io\.open|os\.remove|os\.unlink|os\.makedirs|os\.rename|os\.replace|shutil\.\w+|send_file|send_from_directory|FileResponse|os\.listdir|os\.scandir)$
                    - patterns:
                      - pattern-inside: "$OUT = Path($ROOT) / $P.lstrip(...)\n...\nwith $SINK(..., $OUT, ...) as $FH:\n  ...\n"
                      - metavariable-regex:
                          metavariable: $SINK
                          regex: ^(open|io\.open|os\.remove|os\.unlink|os\.makedirs|os\.rename|os\.replace|shutil\.\w+|send_file|send_from_directory|FileResponse|os\.listdir|os\.scandir)$
                    - patterns:
                      - pattern-inside: '$OUT = Path($ROOT) / $P.lstrip(...)

                          ...

                          $OUT.$METHOD(...)

                          '
                      - metavariable-regex:
                          metavariable: $METHOD
                          regex: ^(read_text|read_bytes|write_text|write_bytes|open|unlink|mkdir|rmdir|rename|iterdir)$
                  - pattern-not-inside: '$OUT = Path($ROOT) / $P.lstrip(...)

                      ...

                      $OUT.resolve().relative_to(Path($ROOT).resolve())

                      ...

                      '
                - pattern: $BASE / $P.rstrip(...)
                - pattern-either:
                  - patterns:
                    - pattern: $BASE / $P
                    - pattern-not-inside:
                        patterns:
                        - pattern-inside: "import pytest\n...\n@pytest.mark.parametrize($PARAM, $VALUES)\ndef $F(..., $P, ...):\n    ..."
                        - metavariable-comparison:
                            comparison: str($PARAM) == str($P)
                        - metavariable-regex:
                            metavariable: $VALUES
                            regex: (?s)\A\[\s*(?:["']\.?[A-Za-z0-9_-][A-Za-z0-9_.-]*(?:/\.?[A-Za-z0-9_-][A-Za-z0-9_.-]*)*["']\s*(?:,\s*|(?=\])))*\]\z
                  - patterns:
                    - pattern: $BASE / $P
                    - pattern-inside: "pytest = $SHADOW\n...\n@pytest.mark.parametrize($PARAM, $VALUES)\ndef $F(...):\n    ..."
                - pattern: $BASE / f"...{$P}..."
                - pattern: $BASE / ($A + $P)
                - pattern: $BASE / ($P + $A)
                - pattern: $BASE / $P[$I]
                - pattern: $BASE / $P[$S:]
                - pattern: $BASE / $P[:$E]
                - pattern: $BASE / $P[$S:$E]
                - pattern: os.path.join($BASE, ..., $A + $P, ...)
                - pattern: os.path.join($BASE, ..., $P + $A, ...)
                - pattern: os.path.join($BASE, ..., $P[$I], ...)
                - pattern: os.path.join($BASE, ..., $P[$S:], ...)
                - pattern: os.path.join($BASE, ..., $P[:$E], ...)
                - pattern: os.path.join($BASE, ..., $P[$S:$E], ...)
                - pattern: Path($BASE, ..., $P, ...)
              - metavariable-regex:
                  metavariable: $P

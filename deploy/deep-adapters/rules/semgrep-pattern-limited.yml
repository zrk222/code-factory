  - id: python.unsafe-deserialization-unscoped
    message: Serialized data reaches a loader or selects an external file during restoration. Verify the source and keep assets inside the archive.
    severity: INFO
    languages: [python]
    pattern-either:
      - patterns:
          - pattern-inside: |
              from keras.src.layers.layer import Layer
              ...
          - pattern-inside: |
              from keras.src.utils.module_utils import tensorflow as $TF
              ...
          - pattern-inside: |
              class $CLASS(Layer):
                ...
                def __init__(self, ..., $CTOR=..., ...):
                  ...
                  if $CTOR is not None:
                    ...
                    self.$INIT($CTOR, ...)
                    ...
                  ...
                ...
                def get_config(self):
                  ...
                  $CFG = {..., $KEY: $ENCODE(self.$STORED), ...}
                  ...
                  return ...
                ...
                def $INIT(self, $P, ...):
                  ...
                  if isinstance($P, str):
                    ...
                    self.$TABLE = self.$READER($P, ...)
                    ...
                  ...
                ...
                def $READER(self, $FILE, ...):
                  ...
                  with $TF.init_scope():
                    ...
                    $INIT_TABLE = $TF.lookup.TextFileInitializer(..., filename=$FILE, ...)
                    ...
                  ...
                ...
          - metavariable-comparison:
              metavariable: $KEY
              comparison: $KEY == str($CTOR)
          - pattern: isinstance($P, str)
          - pattern-not-inside: |
              if isinstance($P, str):
                if keras.src.saving.serialization_lib.in_safe_mode():
                  raise ...
                ...
                self.$TABLE = self.$READER($P, ...)
                ...
      - patterns:
          - pattern-either:
              - pattern: pickle.loads(...)
              - pattern: pickle.load(...)
              - pattern: yaml.unsafe_load(...)
          # Files the program opens itself (caches, parser tables) are not attacker input.
          - pattern-not: pickle.load(open(...))
          - pattern-not-inside: |
              with open(...) as $FILE:
                ...
          - pattern-not-inside: |
              $FILE = open(...)
              ...
      # Model and array loaders that unpickle whatever file they are given; the
      # file is the usual attack vector (shared models, uploaded artifacts).
      - patterns:
          - pattern-either:
              - pattern: joblib.load(...)
              - pattern: dill.load(...)
              - pattern: dill.loads(...)
              - pattern: cloudpickle.load(...)
              - pattern: cloudpickle.loads(...)
              - pattern: pandas.read_pickle(...)
              - pattern: numpy.load(..., allow_pickle=True, ...)
              - pattern: torch.load(...)
              # pyzmq's recv_pyobj unpickles whatever the peer sent.
              - pattern: $SOCK.recv_pyobj(...)
              - pattern: pickle.Unpickler(...).load()
              - patterns:
                  - pattern-either:
                      - pattern: $LOAD(...)
                      - pattern: $MOD.$LOAD(...)
                  - metavariable-regex: {metavariable: $LOAD, regex: '^(pickle_load|pickle_loads|load_pickle|loads_pickle|unpickle|unpickle_\w+)$'}
          - pattern-not: torch.load(..., weights_only=True, ...)
          # Reached only when an opt-in environment setting that is off by default is
          # enabled (FLAG = os.environ.get("X", "0") == "1" ... if FLAG: loads(...)).
          - pattern-not-inside:
              patterns:
                - pattern-inside: |
                    if $FLAG:
                      ...
                - pattern-either:
                    # With a default that is off ("0", "", "false", None).
                    - patterns:
                        - pattern-either:
                            - pattern-inside: |
                                $FLAG = $ENV.get($KEY, $OFF) == $ON
                                ...
                            - pattern-inside: |
                                $FLAG = $ENV.getenv($KEY, $OFF) == $ON
                                ...
                        - metavariable-regex: {metavariable: $OFF, regex: '^(?:[''"](?i:0|false|no|off)?[''"]|None)$'}
                    # Without a default: an unset variable is None.
                    - pattern-inside: |
                        $FLAG = $ENV.get($KEY) == $ON
                        ...
                    - pattern-inside: |
                        $FLAG = $ENV.getenv($KEY) == $ON
                        ...
                - metavariable-regex: {metavariable: $FLAG, regex: '^[A-Za-z_]\w*$'}
                - metavariable-regex: {metavariable: $ENV, regex: '^(?:os|os\.environ)$'}
                - metavariable-regex: {metavariable: $KEY, regex: '^[''"][A-Z][A-Z0-9_]*[''"]$'}
                - metavariable-regex: {metavariable: $ON, regex: '^[''"](?i:1|true|yes|on)[''"]$'}
    paths:
      exclude: ["**/test/**", "**/__tests__/**", "**/testdata/**", "**/test_data/**", "**/test-data/**", "**/fixtures/**", "**/src/test/**", "**/*_test.go", "**/*_test.py", "**/*.test.js", "**/*.test.ts", "**/*.spec.js", "**/*.spec.ts", "**/*Test.java", "**/*Tests.java", "**/*Test.cs", "**/*Tests.cs", "**/*_test.rs", "**/*_spec.rb", "**/exploits/**", "**/exploit/**", "**/poc/**", "**/pocs/**", "**/CVE-*/**", "**/cve-*/**", "**/*.generated.*", "**/*_generated.*", "**/generated/**", "**/__generated__/**", "**/*_pb2.py", "**/*.pb.go", "**/Lib/site-packages/**", "**/site-packages/**", "**/*venv*/**", "**/node_modules/**", "**/vendor/**", "**/third_party/**", "**/third-party/**", "**/bower_components/**", "**/.history/**", "**/*.min.js", "**/tests.rs", "**/test_utils.rs", "**/test_util.rs", "**/testutil/**", "**/testutils/**", "**/TestUtils/**", "**/Pods/**", "**/Carthage/**"]
    metadata:
      tier: review
      category: security
      confidence: MEDIUM
      cwe: ["CWE-502"]
  - id: python.disabled-tls-verification
    message: TLS certificate or hostname verification is disabled; enable verification and configure trusted certificates.
    severity: INFO
    languages: [python]
    pattern-either:
      # requests calls that carry credentials with verify=False.
      - patterns:
          # An explicit operator opt-in (if args.insecure / cfg.Insecure) is a deliberate choice.
          - pattern-not-inside:
              patterns:
                - pattern-inside: |
                    if $OPTIN:
                      ...
                - metavariable-regex:
                    metavariable: $OPTIN
                    regex: (?i).*(insecure|skip_?verify|no_?verify|allow_?invalid|self_?signed|dev_?mode|unsafe_?tls).*
          - pattern: requests.$METHOD(..., verify=False, ...)
          # Report only connections that carry credentials or session material;
          # unauthenticated probes of public endpoints are not a credential exposure.
          - pattern-either:
              - pattern: requests.$METHOD(..., auth=$CREDENTIAL, ...)
              - pattern: requests.$METHOD(..., cert=$CREDENTIAL, ...)
              - pattern: requests.$METHOD(..., cookies=$CREDENTIAL, ...)
              - patterns:
                  - pattern-inside: |
                      def $FUNCTION(...):
                        $...BODY
                  - metavariable-pattern:
                      metavariable: $...BODY
                      language: generic
                      patterns:
                        - pattern-regex: (?i)(authorization|bearer|\w*token\b|\w*secret\b|\bpassword\b|\bpwd\b|api[_-]?key|cookie|credential|\bauth\s*=)
      # SSL contexts created without certificate or hostname checks.
      - patterns:
          - pattern-either:
              - pattern: ssl._create_unverified_context(...)
              - patterns:
                  - pattern: $CTX.check_hostname = False
                  # Reported once per context, at verify_mode, when both checks are disabled.
                  - pattern-not-inside: |
                      $CTX.check_hostname = False
                      ...
                      $CTX.verify_mode = ssl.CERT_NONE
              - pattern: $CTX.verify_mode = ssl.CERT_NONE
              - pattern: 'ssl.wrap_socket(..., cert_reqs=ssl.CERT_NONE, ...)'
              - pattern: urllib3.disable_warnings(...)
          - pattern-not-inside: |
              if $OPTIN:
                ...
          # An explicit verification setting chooses the verified branch.
          - pattern-not-inside:
              patterns:
                - pattern-inside: $SAFE if $VERIFY else $DISABLED
                - metavariable-pattern:
                    metavariable: $SAFE
                    pattern: ssl.create_default_context(...)
                - metavariable-regex:
                    metavariable: $VERIFY
                    regex: '(?i)^(?:[A-Za-z_]\w*\.)*verify_(?:ssl|tls)(?:_cert(?:ificate)?)?$'
    paths:
      exclude: ["**/test/**", "**/__tests__/**", "**/testdata/**", "**/test_data/**", "**/test-data/**", "**/fixtures/**", "**/src/test/**", "**/*_test.go", "**/*_test.py", "**/*.test.js", "**/*.test.ts", "**/*.spec.js", "**/*.spec.ts", "**/*Test.java", "**/*Tests.java", "**/*Test.cs", "**/*Tests.cs", "**/*_test.rs", "**/*_spec.rb", "**/exploits/**", "**/exploit/**", "**/poc/**", "**/pocs/**", "**/CVE-*/**", "**/cve-*/**", "**/*.generated.*", "**/*_generated.*", "**/generated/**", "**/__generated__/**", "**/*_pb2.py", "**/*.pb.go", "**/Lib/site-packages/**", "**/site-packages/**", "**/*venv*/**", "**/node_modules/**", "**/vendor/**", "**/third_party/**", "**/third-party/**", "**/bower_components/**", "**/.history/**", "**/*.min.js", "**/tests.rs", "**/test_utils.rs", "**/test_util.rs", "**/testutil/**", "**/testutils/**", "**/TestUtils/**", "**/Pods/**", "**/Carthage/**"]
    metadata:
      tier: review
      category: security
      confidence: MEDIUM
      cwe: ["CWE-295"]
      scope: Credential-carrying requests calls with verify=False outside an operator opt-in, and unconditional SSL contexts without certificate or hostname checks.
  - id: javascript.request-command-injection
    message: Request data reaches a shell command; use execFile with validated arguments.
    severity: INFO
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      - pattern: '$REQ.query'
        label: REQUEST_INPUT
      - pattern: '$REQ.body'
        label: REQUEST_INPUT
      - pattern: '$REQ.params'
        label: REQUEST_INPUT
      - pattern: process.argv[...]
        label: CLI_INPUT
        exact: true
    pattern-sanitizers:
      # if (!isValidIp(ip)) return; allowed.has(id); url.includes(name)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $CHECK($X)
              - pattern: $OBJ.$CHECK($X)
          - metavariable-regex:
              metavariable: $CHECK
              regex: ^(is_?[Vv]alid|[Vv]alidate|has|includes)[A-Za-z0-9_]*$
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($COMMAND, ...)
              - pattern: child_process.execSync($COMMAND, ...)
          - focus-metavariable: $COMMAND
        requires: REQUEST_INPUT
      - patterns:
          - pattern: $EXEC($COMMAND, ...)
          - pattern-either:
              - pattern-inside: |
                  var $EXEC = require("child_process").exec;
                  ...
              - pattern-inside: |
                  const $EXEC = require("child_process").exec;
                  ...
              - pattern-inside: |
                  import {exec as $EXEC} from "child_process";
                  ...
          - metavariable-pattern:
              metavariable: $COMMAND
              pattern: $L + $R
          - focus-metavariable: $COMMAND
        requires: CLI_INPUT
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/testdata/**", "**/test_data/**", "**/test-data/**", "**/fixtures/**", "**/src/test/**", "**/*_test.go", "**/test_*.py", "**/*_test.py", "**/*.test.js", "**/*.test.ts", "**/*.spec.js", "**/*.spec.ts", "**/*Test.java", "**/*Tests.java", "**/*Test.cs", "**/*Tests.cs", "**/*_test.rs", "**/*_spec.rb", "**/exploits/**", "**/exploit/**", "**/poc/**", "**/pocs/**", "**/CVE-*/**", "**/cve-*/**", "**/*.generated.*", "**/*_generated.*", "**/generated/**", "**/__generated__/**", "**/*_pb2.py", "**/*.pb.go", "**/Lib/site-packages/**", "**/site-packages/**", "**/*venv*/**", "**/node_modules/**", "**/vendor/**", "**/third_party/**", "**/third-party/**", "**/bower_components/**", "**/.history/**", "**/*.min.js", "**/tests.rs", "**/test_utils.rs", "**/test_util.rs", "**/testutil/**", "**/testutils/**", "**/TestUtils/**", "**/Pods/**", "**/Carthage/**"]
    metadata:

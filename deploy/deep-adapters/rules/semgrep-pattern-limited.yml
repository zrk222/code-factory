  - id: python.request-path-traversal
    message: Request data reaches a filesystem path; resolve against an allowed root and enforce containment before access.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.GET.get(...)
      - pattern: request.POST.get(...)
      - pattern: request.GET[...]
      - pattern: request.POST[...]
      # http.server handlers: the raw request target in do_GET/do_POST/...
      - patterns:
          - pattern: self.path
          - pattern-inside: |
              def $DO(self, ...):
                ...
          - metavariable-regex:
              metavariable: $DO
              regex: ^do_[A-Z]+$
      # Tool, MCP and job handler arguments: params["input_path"], args.get("file")...
      - patterns:
          - pattern-either:
              - pattern: $ARGS[$KEY]
              - pattern: $ARGS.get($KEY, ...)
          - metavariable-regex:
              metavariable: $ARGS
              regex: ^(params|arguments|inputs|input_data|tool_input|tool_args|tool_params|payload)$
          - metavariable-regex:
              metavariable: $KEY
              regex: ^["'](?i)\w*(path|file|filename|dir|directory|folder|dest|destination|target|output|input|location)\w*["']$
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: werkzeug.utils.secure_filename(...)
    pattern-sinks:
      - patterns:
          - pattern: open($PATH, ...)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $ROOT = pathlib.Path(...).resolve()
                        $PATH = ($ROOT / $NAME).resolve()
                        if not $PATH.is_relative_to($ROOT):
                          raise ...
                        open($PATH, ...)
                    - pattern-inside: |
                        $ROOT = pathlib.Path(...).resolve()
                        $PATH = ($ROOT / $NAME).resolve()
                        $PATH.relative_to($ROOT)
                        open($PATH, ...)
                - pattern: open($PATH, ...)
          - focus-metavariable: $PATH
      # Opening, copying, moving or deleting through a library call.
      - patterns:
          - pattern: $MOD.open($PATH, ...)
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(Image|PIL\.Image|io|codecs|gzip|bz2|lzma|aiofiles)$
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern: shutil.$OP($PATH, ...)
              - pattern: shutil.$OP($SRC, $PATH, ...)
              - pattern: os.$OP($PATH, ...)
          - metavariable-regex:
              metavariable: $OP
              regex: ^(copy|copy2|copyfile|copytree|move|rmtree|remove|unlink|rename|replace|makedirs|mkdir|rmdir|listdir|scandir|chmod)$
          - focus-metavariable: $PATH
      - patterns:
          - pattern-either:
              - pattern: send_file($PATH, ...)
              - pattern: FileResponse($PATH, ...)
          - focus-metavariable: $PATH
      # Joining request text under a base directory is the traversal itself,
      # unless the joined value is then put through a containment guard.
      - patterns:
          - pattern-either:
              - pattern: os.path.join($BASE, ..., $PATH, ...)
              - patterns:
                  - pattern: $BASE / $PATH
                  # A path operand, not arithmetic.
                  - metavariable-regex:
                      metavariable: $BASE
                      regex: ^.*(?i:path|dir|root|base|folder|home|cwd|tmp|temp|storage|upload|static|media).*$
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $ROOT = pathlib.Path(...).resolve()
                        $TARGET = ($ROOT / $PATH).resolve()
                        if not $TARGET.is_relative_to($ROOT):
                          raise ...
                    - pattern-inside: |
                        $ROOT = pathlib.Path(...).resolve()
                        $TARGET = ($ROOT / $PATH).resolve()
                        $TARGET.relative_to($ROOT)
                - pattern: $ROOT / $PATH
          - focus-metavariable: $PATH
      - patterns:
          - pattern: pathlib.Path($PATH).read_text(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: pathlib.Path($PATH).read_bytes(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: pathlib.Path($PATH).open(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: Path($PATH).read_text(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: Path($PATH).read_bytes(...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: Path($PATH).open(...)
          - focus-metavariable: $PATH
    paths:
      exclude: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/testdata/**", "**/test_data/**", "**/test-data/**", "**/fixtures/**", "**/src/test/**", "**/*_test.go", "**/test_*.py", "**/*_test.py", "**/*.test.js", "**/*.test.ts", "**/*.spec.js", "**/*.spec.ts", "**/*Test.java", "**/*Tests.java", "**/*Test.cs", "**/*Tests.cs", "**/*_test.rs", "**/*_spec.rb", "**/exploits/**", "**/exploit/**", "**/poc/**", "**/pocs/**", "**/CVE-*/**", "**/cve-*/**", "**/*Generated*", "**/*generated*", "**/*_pb2.py", "**/*.pb.go", "**/Lib/**", "**/site-packages/**", "**/*venv*/**", "**/node_modules/**", "**/vendor/**", "**/third_party/**", "**/third-party/**", "**/bower_components/**", "**/.history/**", "**/*.min.js", "**/wp-admin/**", "**/wp-includes/**", "**/tests.rs", "**/test_utils.rs", "**/test_util.rs", "**/testutil/**", "**/testutils/**", "**/TestUtils/**", "**/Pods/**", "**/Carthage/**"]
    metadata:
      category: security
      confidence: MEDIUM
      scope: Local request args/form/GET/POST to open and pathlib read paths; containment sanitizers require review.
      cwe: ["CWE-22"]
  - id: javascript.request-path-traversal
    message: Request data reaches a filesystem path; resolve against an allowed root and enforce containment before access.
    severity: INFO
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      # Request objects only (req, request, ctx.request, incomingReq...), not
      # any object with a params/body field such as route.params.
      - patterns:
          - pattern-either:
              - pattern: '$REQ.query'
              - pattern: '$REQ.body'
              - pattern: '$REQ.params'
              - pattern: '$REQ.url'
              - pattern: '$REQ.path'
              - pattern: '$REQ.originalUrl'
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|\w*Req|\w*Request|ctx|ctx\.request|context\.request|event\.request)$
      # Tool, MCP and API handler arguments: args.path, params.filePath...
      - patterns:
          - pattern-either:
              - pattern: '$ARGS.$KEY'
              - pattern: '($ARGS || {}).$KEY'
              - pattern: '$ARGS?.$KEY'
          - metavariable-regex:
              metavariable: $ARGS
              regex: ^(args|params|input|inputs|arguments|toolInput|toolArgs|payload)$

          - pattern-not: sqlbuilder.Escape(...)
          - pattern-not: sqlbuilder.EscapeAll(...)
    pattern-sinks:
    - requires: SQL_TEMPLATE
      pattern: $LIB.SQLTemplateFuncs(&$MAP)
    - requires: PARAM
      patterns:
      - pattern-either:
        - pattern: $DB.Query($Q, ...)
        - pattern: $DB.QueryContext($C, $Q, ...)
        - pattern: $DB.QueryRow($Q, ...)
        - pattern: $DB.QueryRowContext($C, $Q, ...)
        - pattern: $DB.Exec($Q, ...)
        - pattern: $DB.ExecContext($C, $Q, ...)
        - pattern: $DB.Raw($Q, ...)
        - pattern: $DB.Select($DST, $Q, ...)
        - pattern: $DB.Get($DST, $Q, ...)

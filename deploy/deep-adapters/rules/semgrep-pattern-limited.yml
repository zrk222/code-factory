              regex: ^(is_?[Vv]alid|[Vv]alidate|has|includes)[A-Za-z0-9_]*$
          - focus-metavariable: $X
    pattern-sinks:
      # Only string-building or direct request values can become HTML markup.
      # Objects (JSON), buffers and helper results need review in other lanes.
      - patterns:
          - pattern-either:
              - pattern: '$RES.send(`...`)'
              - pattern: '$RES.send("..." + $X)'
              - pattern: '$RES.send($X + "...")'
              - pattern: '$RES.send($REQ.$SOURCE.$FIELD)'
              - pattern: '$RES.send($REQ.$SOURCE[$FIELD])'

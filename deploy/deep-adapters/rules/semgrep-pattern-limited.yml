  - id: javascript.request-path-traversal
    message: Request data reaches a filesystem path; resolve against an allowed root and enforce containment before access.
    severity: INFO
    languages: [javascript, typescript]
    mode: taint
    pattern-sources:
      # Request objects only (req, request, ctx.request, incomingReq...), not
      # any object with a params/body field such as route.params.
      - patterns:
          - pattern-either:
              - pattern: '$REQ.query'
              - pattern: '$REQ.body'
              - pattern: '$REQ.params'
              - pattern: '$REQ.url'
              - pattern: '$REQ.path'
              - pattern: '$REQ.originalUrl'
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|\w*Req|\w*Request|ctx|ctx\.request|context\.request|event\.request)$
      # Tool, MCP and API handler arguments: args.path, params.filePath...
      - patterns:
          - pattern-either:
              - pattern: '$ARGS.$KEY'
              - pattern: '($ARGS || {}).$KEY'
              - pattern: '$ARGS?.$KEY'
          - metavariable-regex:
              metavariable: $ARGS
              regex: ^(args|params|input|inputs|arguments|toolInput|toolArgs|payload)$
          - metavariable-regex:
              metavariable: $KEY
              regex: ^(?i)\w*(path|file|filename|dir|directory|folder|dest|destination|target|output|location)\w*$
      - patterns:
          - pattern-either:
              - pattern: 'const {..., $KEY, ...} = $ARGS'
              - pattern: 'let {..., $KEY, ...} = $ARGS'
          - metavariable-regex: {metavariable: $ARGS, regex: '^(params|args|input|payload|options)$'}
          - metavariable-regex: {metavariable: $KEY, regex: '^(?i)(file|image|media|attachment|resource|document|asset)(key|name|path)$'}
          - focus-metavariable: $KEY
    pattern-sanitizers:
      # Named containment/sanitizing helpers (safeRel, sanitizePath, resolveWithin...).
      - patterns:
          - pattern: $HELPER(...)
          - metavariable-regex:
              metavariable: $HELPER
              regex: (?i).*(safe|saniti[sz]e|contain|within|inside|secure).*
      # Records looked up by a request key (findById(id), findProject(id),
      # resolveSection(project, id)) carry server-side paths, not request text.
      - patterns:
          - pattern-either:
              - pattern: $LOOKUP(...)
              - pattern: $MODEL.$LOOKUP(...)
          - metavariable-regex:
              metavariable: $LOOKUP
              regex: ^(find|lookup|resolve)(By|One|First|Unique|[A-Z_])[A-Za-z0-9_]*$
      # if (!isValidIp(ip)) return; allowed.has(id); url.includes(name)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $CHECK($X)
              - pattern: $OBJ.$CHECK($X)
          - metavariable-regex:
              metavariable: $CHECK
              regex: ^(is_?[Vv]alid|[Vv]alidate|has|includes)[A-Za-z0-9_]*$
          - focus-metavariable: $X
      - pattern: path.basename(...)
      # A prefix guard only contains the same immutable, normalized path.
      # Raw string construction can still contain unresolved directory segments.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern-inside: if ($C) { ... return; }
              - pattern-inside: if ($C) { ... return $RV; }
              - pattern-inside: if ($C) { ... throw $EXC; }
              - pattern-inside: if ($C) return;
              - pattern-inside: if ($C) return $RV;
              - pattern-inside: if ($C) throw $EXC;
          - metavariable-pattern:
              metavariable: $C
              patterns:
                - pattern-either:
                    - patterns:
                        - pattern-either:
                            - pattern: '!$F.startsWith($NB)'
                            - pattern: $F.indexOf($NB) !== 0
                            - pattern: $F.indexOf($NB) != 0
                            - pattern: $F !== $B && !$F.startsWith($NB)
                            - pattern: $F !== $B && $F.indexOf($NB) !== 0
                            - pattern: $F !== $B && $F.indexOf($NB) != 0
                        - metavariable-pattern:
                            metavariable: $NB
                            pattern-either:
                              - pattern: $NBB + path.sep
                              - pattern: $NBB + "/"
                              - pattern: '$NBB.endsWith(path.sep) ? $NBB : $NBB + path.sep'
                              - pattern: '`${$NBB}/`'
          - pattern-either:
              - pattern: '!$F.startsWith($NB)'
              - pattern: $F.indexOf($NB) !== 0
              - pattern: $F.indexOf($NB) != 0
              - pattern: $F !== $B && !$F.startsWith($NB)
              - pattern: $F !== $B && $F.indexOf($NB) !== 0
              - pattern: $F !== $B && $F.indexOf($NB) != 0
          - pattern-inside: |
              const $F = path.$NORMALIZER(...);
              ...
          - metavariable-regex: {metavariable: $NORMALIZER, regex: '^(?:join|resolve|normalize)$'}
          - focus-metavariable: $F
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern-inside: |
                  $NB = $NBE;
                  if ($C) { ... return; }
              - pattern-inside: |
                  $NB = $NBE;
                  if ($C) { ... return $RV; }
              - pattern-inside: |
                  $NB = $NBE;
                  if ($C) { ... throw $EXC; }
              - pattern-inside: |
                  $NB = $NBE;
                  if ($C) return;
              - pattern-inside: |
                  $NB = $NBE;
                  if ($C) return $RV;
              - pattern-inside: |
                  $NB = $NBE;
                  if ($C) throw $EXC;
          - metavariable-pattern:
              metavariable: $NBE
              pattern-either:
                - pattern: $NBB + path.sep
                - pattern: $NBB + "/"
                - pattern: '$NBB.endsWith(path.sep) ? $NBB : $NBB + path.sep'
                - pattern: '`${$NBB}/`'
          - metavariable-pattern:
              metavariable: $C
              patterns:
                - pattern-either:
                    - pattern: '!$F.startsWith($NB)'
                    - pattern: $F.indexOf($NB) !== 0
                    - pattern: $F.indexOf($NB) != 0
                    - pattern: $F !== $B && !$F.startsWith($NB)
                    - pattern: $F !== $B && $F.indexOf($NB) !== 0
                    - pattern: $F !== $B && $F.indexOf($NB) != 0
          - pattern-either:
              - pattern: '!$F.startsWith($NB)'
              - pattern: $F.indexOf($NB) !== 0
              - pattern: $F.indexOf($NB) != 0
              - pattern: $F !== $B && !$F.startsWith($NB)
              - pattern: $F !== $B && $F.indexOf($NB) !== 0
              - pattern: $F !== $B && $F.indexOf($NB) != 0
          - pattern-inside: |
              const $F = path.$NORMALIZER(...);
              ...
          - metavariable-regex: {metavariable: $NORMALIZER, regex: '^(?:join|resolve|normalize)$'}
          - focus-metavariable: $F
    # Existence and metadata probes (exists, stat, access) neither read nor change file
    # content; each vulnerable read or write the probe guards is reported on its own.
    pattern-sinks:
      - patterns:
          - pattern: path.join(os.tmpdir(), $PART)
          - pattern-either:
              - pattern-inside: |
                  const $TEMP = path.join(os.tmpdir(), $PART);
                  ...
                  const $DATA = await $IO({..., $TEMP, ...});
                  ...
              - pattern-inside: |
                  const $TEMP = path.join(os.tmpdir(), $PART);
                  ...
                  await $IO({..., $TEMP, ...});
                  ...
          - focus-metavariable: $PART
      - patterns:
          - pattern: fs.readFile($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: fs.readFileSync($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: fs.promises.readFile($PATH, ...)
          - focus-metavariable: $PATH
      - patterns:
          - pattern: fs.createReadStream($PATH, ...)
          - focus-metavariable: $PATH
      # Other fs calls on the path, through any fs-like module alias.
      - patterns:
          - pattern: $FS.$CALL($PATH, ...)
          - metavariable-regex:
              metavariable: $FS
              regex: ^(fs\w*|\w*Fs|fse|fsp|fsPromises|promises|fs\.promises)$
          - metavariable-regex:
              metavariable: $CALL
              regex: ^(writeFile|writeFileSync|createWriteStream|appendFile|appendFileSync|open|openSync|readdir|readdirSync|unlink|unlinkSync|rm|rmSync|rename|renameSync|copyFile|copyFileSync|copy|move|outputFile|remove|mkdir|mkdirSync)$
          - focus-metavariable: $PATH
      # The same calls through a receiver bound to an fs module, under any name.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $FS from "$MOD"
                  ...
              - pattern-inside: |
                  import * as $FS from "$MOD"
                  ...
              - pattern-inside: |
                  $FS = require("$MOD")
                  ...
          - metavariable-regex:
              metavariable: $MOD
              regex: ^(?:node:)?fs(?:/promises)?$|^(?:fs-extra|graceful-fs)$
          - pattern: $FS.$CALL($PATH, ...)
          - metavariable-regex:
              metavariable: $CALL
              regex: ^(readFile|readFileSync|createReadStream|writeFile|writeFileSync|createWriteStream|appendFile|appendFileSync|open|openSync|readdir|readdirSync|unlink|unlinkSync|rm|rmSync|rename|renameSync|copyFile|copyFileSync|copy|move|outputFile|remove|mkdir|mkdirSync)$
          - focus-metavariable: $PATH
      # Joining request text under a base directory is the traversal itself, unless the
      # joined path is assigned and then rejected by a fail-closed containment check
      # (if (...) return/throw); any read before that check is still a sink above.
      # The assignment is matched by its path.join/resolve call, not as any statement:
      # a generic first statement made these sequences time out on large bundles.
      - patterns:
          - pattern-either:
              - pattern: path.join($BASE, ..., $PATH, ...)
              - pattern: path.resolve($BASE, ..., $PATH, ...)
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        if ($C) { ... return; }
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        if ($C) { ... return $RV; }
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        if ($C) { ... throw $EXC; }
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        if ($C) return;
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        if ($C) return $RV;
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        if ($C) throw $EXC;
                - metavariable-pattern:
                    metavariable: $C
                    patterns:
                      - pattern-either:
                          # A separator-aware prefix check (startsWith(root + path.sep)).
                          - patterns:
                              - pattern-either:
                                  - pattern: '!$F.startsWith($NB)'
                                  - pattern: $F.indexOf($NB) !== 0
                                  - pattern: $F.indexOf($NB) != 0
                                  - pattern: $F !== $B && !$F.startsWith($NB)
                                  - pattern: $F !== $B && $F.indexOf($NB) !== 0
                                  - pattern: $F !== $B && $F.indexOf($NB) != 0
                              - metavariable-pattern:
                                  metavariable: $NB
                                  pattern-either:
                                    - pattern: $NBB + path.sep
                                    - pattern: $NBB + "/"
                                    - pattern: '$NBB.endsWith(path.sep) ? $NBB : $NBB + path.sep'
                                    - pattern: '`${$NBB}/`'
                - metavariable-regex: {metavariable: $JF, regex: '^(?:join|resolve)$'}
          # The same check against a separator-terminated root kept in a variable.
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        $NB = $NBE;
                        if ($C) { ... return; }
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        $NB = $NBE;
                        if ($C) { ... return $RV; }
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        $NB = $NBE;
                        if ($C) { ... throw $EXC; }
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        $NB = $NBE;
                        if ($C) return;
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        $NB = $NBE;
                        if ($C) return $RV;
                    - pattern-inside: |
                        $F = <... path.$JF(...) ...>;
                        ...
                        $NB = $NBE;
                        if ($C) throw $EXC;
                - metavariable-pattern:
                    metavariable: $NBE
                    pattern-either:
                      - pattern: $NBB + path.sep
                      - pattern: $NBB + "/"
                      - pattern: '$NBB.endsWith(path.sep) ? $NBB : $NBB + path.sep'
                      - pattern: '`${$NBB}/`'
                - metavariable-pattern:
                    metavariable: $C
                    patterns:
                      - pattern-either:
                          - pattern: '!$F.startsWith($NB)'
                          - pattern: $F.indexOf($NB) !== 0
                          - pattern: $F.indexOf($NB) != 0
                          - pattern: $F !== $B && !$F.startsWith($NB)
                          - pattern: $F !== $B && $F.indexOf($NB) !== 0
                          - pattern: $F !== $B && $F.indexOf($NB) != 0
                - metavariable-regex: {metavariable: $JF, regex: '^(?:join|resolve)$'}
          - focus-metavariable: $PATH

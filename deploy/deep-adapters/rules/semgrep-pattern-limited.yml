      # (`SELECT ... WHERE id = ${userId}`), each reported where it sits. \G chains
      # matches within one template; code-generation templates do not start with SQL.
      # A tagged template (sql`...`, prisma.$queryRaw`...`) binds its values as parameters.
      # Each interpolation in an untagged template literal whose text is a SQL statement

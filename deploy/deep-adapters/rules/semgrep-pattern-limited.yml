  - id: go.parameter-sql-text
    message: A caller-provided value reaches SQL text or a template with SQL helpers. Use bound SQL parameters and restrict template helpers.
    severity: INFO
    languages: [go]
    mode: taint
    pattern-sources:
    # Bind the registered SQL helpers, caller text and executed template to the same renderer.
    - label: SQL_TEMPLATE
      exact: true
      patterns:
      - pattern-inside: |
          func $F(..., $CONTENT string, ...) $RET {
            ...
            $TEMPLATE := $BUILD
            $MAP := $INITIAL(...)
            $LIB.SQLTemplateFuncs(&$MAP)
            $TEMPLATE = $TEMPLATE.Funcs($MAP)
            $RENDERER, $ERR := $TEMPLATE.Funcs($MAP).Parse($CONTENT)
            ...
            if $ERR = $RENDERER.Execute(...); $ERR != nil { ... }
            ...
          }
      - metavariable-pattern:
          metavariable: $BUILD
          pattern-either:
          - pattern: template.New(...)
          - pattern: template.New(...).Delims(...)
      - pattern: $LIB.SQLTemplateFuncs(&$MAP)
    - label: PARAM
      patterns:
      - pattern-either:
        - pattern-inside: func $F(..., $P $T, ...) { ... }
        - pattern-inside: func $F(..., $P $T, ...) $R { ... }
        - pattern-inside: func ($RV $RT) $F(..., $P $T, ...) { ... }
        - pattern-inside: func ($RV $RT) $F(..., $P $T, ...) $R { ... }
      - metavariable-regex:
          metavariable: $P
          regex: ^(?!(?i:req|request|r|ctx|c|context|w|writer|response|res|resp|sql|query|stmt|statement|clause|where|fragment|expr|condition|q|raw|ctx|tx|db)$)\w+$
      - focus-metavariable: $P
    - label: QUOTED
      patterns:
      - pattern: fmt.Sprintf($FMT, ..., $X, ...)
      - pattern-not: fmt.Sprintf($FMT, sqlbuilder.Escape("..."))
      - metavariable-regex:
          metavariable: $FMT
          regex: (?s)\A["`].*'%s'.*["`]\z
      - metavariable-pattern:
          metavariable: $X
          patterns:
          - pattern: $V
          - pattern-not: '"..."'
      - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: strconv.Itoa(...)
      - pattern: strconv.FormatInt(...)
      - pattern: pq.QuoteIdentifier(...)
      - pattern: pq.QuoteLiteral(...)
      # sqlx.In over a constant statement only expands IN (?) and binds the arguments.
      - pattern: sqlx.In("...", ...)
      - patterns:
          - pattern-either:
              - pattern: $F(...)
              - pattern: $O.$F(...)
          # Validation, allow-list and quoting helpers return a value the caller has vetted.
          - metavariable-regex: {metavariable: $F, regex: '(?i)^\w*(valid|sanitiz|escape|quote|allow|whitelist)\w*$'}

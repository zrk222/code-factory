      - pattern-regex: '[$@]\$\{[^{}`\n]*\}'
      - patterns:
          - pattern: $QP.join(...)
          - metavariable-regex: {metavariable: $QP, regex: '(?i)^\w*placeholders?$'}
      - patterns:
          - pattern: $QA.map((...) => $QT)
          - metavariable-regex: {metavariable: $QT, regex: '\A(?:([''"`])[(), ]*\?[?(), ]*\1|`[$@]\$\{[^`]*\}`|[''"][$@][''"]\s*\+[^,]*)\z'}

              - metavariable-pattern:
                  metavariable: $BASE
                  patterns:
                  - pattern-not: $P
                  - pattern-not: '"..."'
              - pattern-either:
                - patterns:
                  - pattern-either:
                    - pattern-inside: "def $F(...):\n  ...\n  $SINK(...)\n  ...\n"
                    - pattern-inside: "def $F(...):\n  ...\n  with $SINK(...) as $FH:\n    ...\n  ...\n"
                  - metavariable-regex:
                      metavariable: $SINK
                      regex: ^(open|io\.open|os\.remove|os\.unlink|os\.makedirs|os\.rename|os\.replace|shutil\.\w+|send_file|send_from_directory|FileResponse|os\.listdir|os\.scandir|\w+\.(read_text|read_bytes|write_text|write_bytes|open|unlink|mkdir|rmdir|rename|iterdir))$
                # An initializer can publish a derived path for a later reader.
                - patterns:
                  - pattern-inside: |

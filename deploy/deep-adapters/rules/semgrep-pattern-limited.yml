          - pattern: $QL + $QX + $QR
          - metavariable-regex: {metavariable: $QL, regex: '(?is)\A[''"].*(?:\b(?!i?like\b)[a-z_]\w*|[.,(])\s*"[''"]\z'}
          - metavariable-regex: {metavariable: $QR, regex: '\A[''"]"'}
          - focus-metavariable: $QX

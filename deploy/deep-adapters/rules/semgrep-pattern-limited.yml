              patterns:
                - pattern-either:
                    - pattern: '`...`'
                    - pattern: $A + $B
          - metavariable-pattern:
              metavariable: $Q
              pattern-regex: (?i)\b(select\s[\s\S]+\sfrom|insert\s+into|update\s+\S+\s+set|delete\s+from|where\s|order\s+by)\b
          - metavariable-regex: {metavariable: $DB, regex: '(?i)(^|\.)(db|database|conn|connection|client|pool|knex|sequelize|prisma|tx|trx|sql|pg|mysql|sqlite|\w*(db|conn|pool|client))$'}
          - focus-metavariable: $Q
      # SQL text assembled from a parameter, wherever it is executed later.
      - patterns:
          - pattern: $LIT + $X
          - metavariable-pattern:
              metavariable: $LIT
              patterns:
                - pattern: '"..."'
                - pattern-regex: '(?i)\b(select\s[\s\S]*?\sfrom|insert\s+into|update\s+\S+\s+set|delete\s+from|where\s|order\s+by\s|values\s*\()'

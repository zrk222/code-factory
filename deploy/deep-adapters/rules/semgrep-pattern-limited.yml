  - id: php.request-command-injection
    message: Request data reaches a shell-command candidate; use a fixed executable and validated argument boundaries.
    severity: WARNING
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern: '$_GET[...]'
        exact: true
      - pattern: '$_POST[...]'
        exact: true
      - pattern: '$_REQUEST[...]'
        exact: true
      - pattern: '$_COOKIE[...]'
        exact: true
    pattern-sanitizers:
      - pattern: (int) $VALUE
      - pattern: (integer) $VALUE
      - pattern: intval(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: system($VALUE, ...)
              - pattern: \system($VALUE, ...)
              - pattern: exec($VALUE, ...)
              - pattern: \exec($VALUE, ...)
              - pattern: shell_exec($VALUE)
              - pattern: \shell_exec($VALUE)
              - pattern: passthru($VALUE, ...)
              - pattern: \passthru($VALUE, ...)
              - pattern: popen($VALUE, ...)
              - pattern: \popen($VALUE, ...)
              - pattern: 'system(..., command: $VALUE, ...)'

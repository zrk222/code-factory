name: Publish Open VSX extension

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Immutable VS Code adapter tag to package (for example vscode-v1.0.2)"
        required: true
        type: string
      publish:
        description: "Publish the verified VSIX to Open VSX after the protected-environment review"
        required: true
        default: false
        type: boolean
      release_contract:
        description: "Workspace-contained, source-bound release contract (for example release-contracts/openvsx.json)"
        required: true
        type: string
      cadence_exception_reason:
        description: "One-time cadence exception reason; only the explicitly approved vscode-v1.1.3+build.1 release may use this"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: openvsx-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  attested-source:
    name: resolve protected source and verify CI evidence
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted tools to the workflow commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git checkout --detach "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Require a reviewed immutable tag on protected main
        id: source
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_REF" =~ ^vscode-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          candidate=$(git rev-parse --verify "${RELEASE_REF}^{commit}")
          git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"
          python -m factoryline.signed_receipts fetch-ci "$candidate" "$RUNNER_TEMP/ci-release-evidence"
          echo "commit=$candidate" >> "$GITHUB_OUTPUT"

  authorize:
    name: authorize protected Open VSX publication
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: openvsx
    steps:
      - name: Require the scoped Open VSX publisher token before candidate work
        shell: bash
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPENVSX_TOKEN" || {
            echo "OPENVSX_TOKEN is required in the openvsx environment." >&2
            exit 1
          }

  validate:
    permissions:
      contents: read
    name: validate immutable Open VSX candidate
    needs: [authorize, attested-source]
    if: ${{ always() && needs.attested-source.result == 'success' && (inputs.publish == false || needs.authorize.result == 'success') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind protected-main checkout to approved candidate
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$APPROVED_COMMIT" "$GITHUB_SHA"
          git checkout --detach "$APPROVED_COMMIT"
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
      - name: Require an immutable release tag
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^vscode-v[0-9]+\.[0-9]+\.[0-9]+(\+build\.[1-9][0-9]*)?$ ]] || {
            echo "release_ref must be a dedicated tag such as vscode-v1.0.2." >&2
            exit 1
          }
          test "$(git rev-list -n 1 "$RELEASE_REF")" = "$(git rev-parse HEAD)" || {
            echo "Checked-out commit does not match $RELEASE_REF." >&2
            exit 1
          }
          git tag --points-at HEAD --format='%(refname:short)' | grep -Fx "$RELEASE_REF" >/dev/null || {
            echo "$RELEASE_REF is not an immutable tag pointing at HEAD." >&2
            exit 1
          }
      - name: Validate one-time cadence exception request
        env:
          PUBLISH: ${{ inputs.publish }}
          RELEASE_REF: ${{ inputs.release_ref }}
          EXCEPTION_REASON: ${{ inputs.cadence_exception_reason }}
        run: |
          set -euo pipefail
          if [[ -n "$EXCEPTION_REASON" ]]; then
            test "$PUBLISH" = true || { echo "A cadence exception is valid only for an explicitly publishing run." >&2; exit 1; }
            test "$RELEASE_REF" = vscode-v1.1.3+build.1 || { echo "The one-time exception is restricted to vscode-v1.1.3+build.1." >&2; exit 1; }
            test "$(node -p "require('./package.json').version")" = 1.1.3 || { echo "The packaged VS Code version must be 1.1.3." >&2; exit 1; }
            test "${#EXCEPTION_REASON}" -ge 12 && test "${#EXCEPTION_REASON}" -le 500 || { echo "The exception reason must contain 12 to 500 characters." >&2; exit 1; }
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Pin the audited npm client
        run: npm install --global npm@10.9.4
      - name: Install, audit, test, and package
        run: |
          set -euo pipefail
          npm ci --no-audit
          npm run audit
          npm test
          version="$(node -p "require('./package.json').version")"
          npx vsce package --no-dependencies --out "factoryline-vscode-${version}.vsix"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Code Factory preflight runtime
        working-directory: ${{ github.workspace }}
        run: python -m pip install .

      - name: Prepare source-bound release contract
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_CONTRACT_PATH: ${{ inputs.release_contract }}
          APPROVED_BY: ${{ github.actor }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          raw = os.environ["RELEASE_CONTRACT_PATH"]
          if Path(raw).is_absolute() or raw.startswith(("/", "\\")):
              raise SystemExit("release_contract must be workspace-relative")
          candidate = (root / raw).resolve()
          try:
              candidate.relative_to(root)
          except ValueError as exc:
              raise SystemExit("release_contract escapes the workspace") from exc
          PY
          python scripts/prepare_release_contract.py \
            --root . \
            --feature "openvsx-${RELEASE_REF//+/-}" \
            --out "$RELEASE_CONTRACT_PATH" \
            --approved-by "$APPROVED_BY"

      - name: Require the sealed candidate preflight
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_CONTRACT_PATH: ${{ inputs.release_contract }}
          RELEASE_REF: ${{ inputs.release_ref }}
          PUBLISH: ${{ inputs.publish }}
          EXCEPTION_REASON: ${{ inputs.cadence_exception_reason }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CONTRACT_PATH" != /* && "$RELEASE_CONTRACT_PATH" != *..* ]] || { echo "release_contract must be a workspace-relative path" >&2; exit 1; }
          test -f "$RELEASE_CONTRACT_PATH" || { echo "release contract is not present in the immutable checkout" >&2; exit 1; }
          exception_args=()
          if [[ -n "$EXCEPTION_REASON" ]]; then
            test "$PUBLISH" = true
            mkdir -p .factory
            python - <<'PY'
          import json
          import os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          now = datetime.now(timezone.utc)
          payload = {
              "schema": "factory.release-cadence-exception.v1",
              "channel": "vscode",
              "version": "1.1.3",
              "candidate_tag": os.environ["RELEASE_REF"],
              "source_commit": os.popen("git rev-parse HEAD").read().strip(),
              "requesting_actor": os.environ["GITHUB_ACTOR"],
              "reason": os.environ["EXCEPTION_REASON"],
              "issued_at": now.isoformat().replace("+00:00", "Z"),
              "expires_at": (now + timedelta(minutes=30)).isoformat().replace("+00:00", "Z"),
              "workflow_run_id": os.environ["GITHUB_RUN_ID"],
              "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "environment": "openvsx",
              "environment_authorized": True,
              "publish_enabled": True,
          }
          Path(".factory/release-cadence-exception.json").write_text(
              json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
            exception_args=(--cadence-exception .factory/release-cadence-exception.json)
          fi
          python -m factoryline.cli release preflight \
            --root . \
            --channel vscode \
            --candidate-tag "$RELEASE_REF" \
            --contract "$RELEASE_CONTRACT_PATH" \
            --artifact-dir editors/vscode \
            --metadata-path context/PROGRESS.md \
            --out editors/vscode/openvsx-preflight.json \
            "${exception_args[@]}" \
            --json
      - name: Seal the verified Open VSX candidate
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . -maxdepth 1 -type f -name 'factoryline-vscode-*.vsix' -print)
          test "${#packages[@]}" -eq 1
          mkdir -p "$GITHUB_WORKSPACE/openvsx-candidate"
          cp "${packages[0]}" "$GITHUB_WORKSPACE/openvsx-candidate/"
          sha256sum "${packages[0]}" > "$GITHUB_WORKSPACE/openvsx-candidate/SHA256SUMS.txt"
          cp openvsx-preflight.json "$GITHUB_WORKSPACE/openvsx-candidate/"
          python "$GITHUB_WORKSPACE/scripts/verify_release_preflight.py" openvsx-preflight.json
          printf 'release_ref=%s\ncommit=%s\npublisher=zrk222\n' \
            "$RELEASE_REF" "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/openvsx-candidate/manifest.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openvsx-candidate-${{ inputs.release_ref }}
          path: openvsx-candidate/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish verified Open VSX candidate
    if: ${{ always() && inputs.publish == true && needs.authorize.result == 'success' && needs.validate.result == 'success' }}
    needs: [authorize, validate, attested-source]
    runs-on: ubuntu-latest
    environment: openvsx
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted publisher and recheck immutable candidate tag
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$APPROVED_COMMIT" "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "refs/tags/$RELEASE_REF"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$APPROVED_COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: openvsx-candidate-${{ inputs.release_ref }}
          path: openvsx-candidate
      - name: Require the scoped Open VSX publisher token
        shell: bash
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPENVSX_TOKEN" || {
            echo "OPENVSX_TOKEN is required in the openvsx environment." >&2
            exit 1
          }
      - name: Verify sealed candidate
        shell: bash
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          cd openvsx-candidate
          sha256sum --check SHA256SUMS.txt
          test -f manifest.txt
          grep -Fx "commit=$APPROVED_COMMIT" manifest.txt >/dev/null
          grep -Fx "release_ref=$RELEASE_REF" manifest.txt >/dev/null
          find . -maxdepth 1 -type f -name 'factoryline-vscode-*.vsix' -print -quit | grep -q .
          test -f openvsx-preflight.json
          python "$GITHUB_WORKSPACE/scripts/verify_release_preflight.py" openvsx-preflight.json
      - name: Publish verified VSIX to Open VSX
        shell: bash
        env:
          OPENVSX_TOKEN: ${{ secrets.OPENVSX_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes ovsx@1.1.0 publish "$(find openvsx-candidate -maxdepth 1 -type f -name 'factoryline-vscode-*.vsix' -print -quit)" -p "$OPENVSX_TOKEN"

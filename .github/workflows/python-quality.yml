name: Python quality

on:
  pull_request:
    paths:
      - "factoryline/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"
  push:
    branches: [main]
    paths:
      - "factoryline/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff==0.14.10
      - name: Ruff lint
        run: python -m ruff check factoryline tests
      - name: Ruff format
        run: python -m ruff format --check factoryline tests
      - name: Ruff complexity across public and private Python functions
        run: python -m ruff check --select C901 factoryline tests

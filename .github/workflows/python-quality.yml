name: Python quality

on:
  pull_request:
    paths:
      - "factoryline/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"
  push:
    branches: [main]
    paths:
      - "factoryline/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff==0.14.10
      - name: Ruff lint
        run: python -m ruff check factoryline tests
      - name: Ruff format
        run: python -m ruff format --check factoryline tests
      - name: Ruff complexity across public and private Python functions
        run: python -m ruff check --select C901 factoryline tests

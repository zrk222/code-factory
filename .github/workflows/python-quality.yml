name: Python quality

on:
  pull_request:
    paths:
      - "factoryline/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"
  push:
    branches: [main]
    paths:
      - "factoryline/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/python-quality.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install --upgrade pip ruff==0.14.10
      - name: Ruff lint
        run: python -m ruff check factoryline tests
      - name: Ruff format
        run: python -m ruff format --check factoryline tests

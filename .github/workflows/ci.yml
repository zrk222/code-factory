name: focused snapshot integrity verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repaired-snapshot-tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 146c529cb04707af6b9c4513c8dc21eb5f62730b
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the exact repaired source
        run: python -m pip install -e . pytest
      - name: Verify source revision
        run: python -c "import subprocess; assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='146c529cb04707af6b9c4513c8dc21eb5f62730b'"
      - name: Run only repaired source integrity and parser controls
        run: python -m pytest tests/test_review_integrity.py::test_unretained_snapshot_rejects_transient_changed_and_restored_bytes tests/test_review_audits.py::test_bound_snapshots_parses_only_hash_matching_source_bytes tests/test_runtime_audit_integrity.py -k "source_diagnostic318 or transient_changed_and_restored_bytes or bound_snapshots_parses_only_hash_matching_source_bytes" -q --junitxml=snapshot-integrity.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: snapshot-integrity-${{ matrix.os }}-${{ matrix.python-version }}
          path: snapshot-integrity.xml
          if-no-files-found: error

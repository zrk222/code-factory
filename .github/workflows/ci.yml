name: ci
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-behavior-native:
    name: native optical and Prestige evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zrk222/code-factory-4-design
          ref: 4d48b698e78a4a1a45b2c7b6c7c6c9af6e3c0d32
          path: .integration/prestige
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install optional native acceptance tools
        run: python -m pip install -e ".[dev]" ./.integration/prestige pytest playwright==1.57.0
      - name: Install the pinned Playwright browser
        run: python -m playwright install --with-deps chromium
      - name: Require actual browser and Prestige execution
        env:
          FACTORY_REQUIRE_NATIVE_VISUAL: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -o addopts=
          tests/test_full_stack_ux_harness.py::test_visual_real_browser_pixels_semantics_runtime_and_prestige
          --junitxml=native-visual-behavior.xml
      - name: Reject skipped or incomplete native acceptance
        if: always()
        run: >-
          python -c "import xml.etree.ElementTree as E; s=list(E.parse('native-visual-behavior.xml').iter('testsuite'));
          assert sum(int(x.get('tests','0')) for x in s)==1;
          assert not any(int(x.get(k,'0')) for x in s for k in ('skipped','failures','errors'));
          print('Actual fixture browser/Prestige case executed; not device certification or release approval')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-visual-behavior-${{ matrix.os }}
          path: native-visual-behavior.xml
          if-no-files-found: error

  python313-type-transfer:
    name: Python 3.13 type-transfer regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
          cache: pip
      - name: Install isolated regression dependencies
        run: python -m pip install -e . pytest mypy==2.1.0
      - name: Exercise the five reported type-transfer probes
        env:
          PYTHONNOUSERSITE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest tests/test_pytest_readiness.py -q
          -k "typecheck_probe_observes or typecheck_probe_widens or typecheck_resolves_explicit_top_level or typecheck_probe_fails_closed_when_any_sink"
          --junitxml=pytest-python313-type-transfer.xml
  coordinated-acceptance:
    name: coordinated acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zrk222/code-factory-1-spec
          ref: c00fef6f490ea7dff72ea3d9d699315a28c80d9e
          path: .integration/spec
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zrk222/code-factory-2-forge
          ref: 7830ef1465a80cabfaafad69a0fbd7c1077d8226
          path: .integration/forge
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install exact checked-out tool sources
        run: python -m pip install -e . -e .integration/spec -e .integration/forge pytest
      - name: Verify native handoff and stale-evidence controls
        env:
          FACTORY_COORDINATED_SPEC_FIXTURES: .integration/spec/tests/conftest.py
        run: python -m pytest -q -o addopts= -o junit_family=xunit2 --junitxml=coordinated-acceptance.xml .integration/spec/tests/test_acceptance_evidence.py .integration/spec/tests/test_acceptance_mutations.py tests/test_specforge_promotion.py
      - name: Reject skipped or incomplete coordinated evidence
        run: |
          python -c "import xml.etree.ElementTree as E; r=E.parse('coordinated-acceptance.xml'); s=list(r.iter('testsuite')); assert sum(int(x.get('tests','0')) for x in s)==35; assert not any(int(x.get(k,'0')) for x in s for k in ('skipped','failures','errors')); print('35 coordinated cases executed without skips')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coordinated-acceptance-${{ matrix.os }}
          path: coordinated-acceptance.xml
          if-no-files-found: error

  coordinator-signed-child-lifecycle:
    name: coordinator signed-child lifecycle only (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]" pytest
      - name: Exercise actual signed worker handshake, stop, and cleanup
        env:
          FACTORY_REQUIRE_NATIVE_SIGNED_LIFECYCLE: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -q -o addopts=
          tests/test_deep_audit_contract.py::test_coordinator_native_signed_child_handshake_and_cleanup
          --junitxml=native-signed-child-lifecycle.xml
      - name: Require both lifecycle cases and reject skips
        if: always()
        env:
          NATIVE_LIFECYCLE_OS: ${{ matrix.os }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          xml_path = Path("native-signed-child-lifecycle.xml")
          suites = list(ET.parse(xml_path).iter("testsuite")) if xml_path.exists() else []
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          state = "PASS" if totals == {"tests": 2, "failures": 0, "errors": 0, "skipped": 0} else "FAIL"
          receipt = {
              "schema": "factory.coordinator-signed-child-lifecycle-ci.v1",
              "state": state,
              "platform": os.environ["NATIVE_LIFECYCLE_OS"],
              "junit": str(xml_path) if xml_path.exists() else None,
              **totals,
              "scope": "actual signed child handshake/stop/cleanup only; no analyzer-family success claim",
          }
          Path("native-signed-child-lifecycle-summary.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"Coordinator signed-child lifecycle: {state} ({totals['tests']} cases, {totals['skipped']} skips).\n\n")
              summary.write("Scope is actual worker handshake/stop/cleanup only; this is not six-family analyzer qualification.\n")
          assert state == "PASS", receipt
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: coordinator-signed-child-lifecycle-${{ matrix.os }}
          path: |
            native-signed-child-lifecycle.xml
            native-signed-child-lifecycle-summary.json
          if-no-files-found: error

  candidate-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install fixed audit and TypeScript parser versions
        run: |
          python -m pip install "code-factory-2-forge @ git+https://github.com/zrk222/code-factory-2-forge.git@36304efbfececed506a30403fe1b4655f60a18cf"
          npm install --no-save --no-package-lock typescript@5.9.3
      - name: Require A grade at 97.9, 99.85% attribution and the strict 464 Python file ceiling
        run: |
          forge qa --repo-wide --root . --strict > candidate-quality.json
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          report = json.loads(Path('candidate-quality.json').read_text())
          assert report['grade'] == 'A' and report['passed'] is True
          assert report['metrics']['composite'] >= 97.9
          assert report['attribution']['rate'] >= 0.9985, 'static test-intent attribution fell below 99.85%'
          assert report['metrics']['max_complexity'] <= 10
          assert not report.get('findings'), 'quality findings remain'
          assert not report['metrics'].get('skipped_paths'), 'source was unreadable'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          assert sum(path.endswith('.py') for path in paths if path) <= 464
          policy = json.loads(Path('architecture-policy.json').read_text())
          assert policy['budgets']['max_python_files'] == 464
          assert policy['budgets']['max_core_modules'] == 133
          print('CANDIDATE_QUALITY_A_97_9_AND_464_CEILING_OK')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: candidate-quality
          path: candidate-quality.json
          if-no-files-found: error

  editor-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --no-audit
      - name: Audit production and build dependencies without ignore rules
        run: npm run audit
      - run: npm test
      - name: Exercise Muse receipt integrity and hook event handling
        working-directory: .
        run: node --test plugins/muse-code-factory-audit/tests/mcp-server.test.mjs
      - name: Exercise offline Jev evaluation and failure controls
        working-directory: .
        run: node --test scripts/evaluate_jev.test.mjs

  video-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: videos/code-factory-proof-of-survival/remotion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: videos/code-factory-proof-of-survival/remotion/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: >-
      ${{ matrix.os == 'ubuntu-latest' && matrix.python == '3.11' && 40
      || matrix.os == 'macos-latest' && matrix.python == '3.10' && 35
      || matrix.os == 'windows-latest' && matrix.python == '3.10' && 25
      || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,enterprise]"
      - name: Preflight symlinked Python 3.10 runtime
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.10'
        timeout-minutes: 3
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cf-runtime-venv"
          "$RUNNER_TEMP/cf-runtime-venv/bin/python" -m pip install -e . pytest
          "$RUNNER_TEMP/cf-runtime-venv/bin/python" -m pytest tests/test_runtime_attestation.py -q
      - name: Preflight scanner source contracts
        run: >-
          python -m pytest -q
          tests/test_review_audits.py::test_security_scan_orchestration_stays_within_complexity_budget
          tests/test_context_efficiency.py::test_security_scan_reparses_a_tree_changed_by_an_intermediate_consumer
      - name: Preflight public Node intake
        if: matrix.os == 'windows-latest' && matrix.python == '3.10'
        timeout-minutes: 2
        run: >-
          python -m pytest -q --junitxml=pytest-intake-preflight.xml --durations=3
          tests/test_audit_rule_search.py::test_declaration_neighborhood_empty_package_passes_public_js_intake
          tests/test_audit_rule_search.py::test_security_producer_nested_call_spans_reach_context_and_public_intake
          tests/test_audit_rule_search.py::test_contextual_evidence_public_source_intake_to_pending_review
      - name: Require immutable action and reusable workflow refs
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: |
          python -c "import json; from pathlib import Path; from factoryline.workflow_audit import audit_action_pins; r=audit_action_pins(Path('.')); print(json.dumps(r,indent=2)); raise SystemExit(0 if r['state']=='PASS' else 1)"
      - name: Enforce architecture and per-file growth budgets
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m factoryline.cli architecture health --strict --json
      - name: Test without runtime coverage
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.11'
        env:
          PYTEST_ADDOPTS: >-
            ${{ matrix.os == 'windows-latest' && matrix.python == '3.10' &&
            '--deselect=tests/test_audit_rule_search.py::test_declaration_neighborhood_empty_package_passes_public_js_intake
            --deselect=tests/test_audit_rule_search.py::test_security_producer_nested_call_spans_reach_context_and_public_intake
            --deselect=tests/test_audit_rule_search.py::test_contextual_evidence_public_source_intake_to_pending_review' || '' }}
        run: python -m pytest -n ${{ matrix.os == 'windows-latest' && 3 || 2 }} -q --junitxml=pytest-results.xml --durations=20
      - name: Start runtime coverage receipt
        id: runtime-coverage-start
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python scripts/write_ci_runtime_coverage.py start
      - name: Test with runtime statement and branch coverage
        id: runtime-tests
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        env:
          COVERAGE_FILE: .factory/test-reports/.coverage
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -p xdist.plugin -q -n 3 -p pytest_cov.plugin
          --junitxml=.factory/test-reports/pytest.xml --durations=20
          --cov=factoryline --cov-branch
          --cov-report=json:.factory/test-reports/coverage.json
          --cov-report=xml:.factory/test-reports/coverage.xml
      - name: Finish runtime coverage receipt
        if: always() && steps.runtime-coverage-start.outcome == 'success'
        env:
          TEST_OUTCOME: ${{ steps.runtime-tests.outcome }}
        run: python scripts/write_ci_runtime_coverage.py finish
      - name: Upload test results and timing evidence
        if: always() && (matrix.os != 'ubuntu-latest' || matrix.python != '3.11')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: |
            pytest-results.xml
            pytest-intake-preflight.xml
          if-no-files-found: error
      - name: Upload runtime coverage reports
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .factory/test-reports/pytest.xml
            .factory/test-reports/coverage.json
            .factory/test-reports/coverage.xml
            .factory/test-reports/coverage.run.json
          include-hidden-files: true
          if-no-files-found: error

  windows-shards:
    name: Windows Python ${{ matrix.python }} shard ${{ matrix.shard }}/4
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,enterprise]"
      - name: Preflight scanner source contracts
        if: matrix.shard == 1
        run: >-
          python -m pytest -q
          tests/test_review_audits.py::test_security_scan_orchestration_stays_within_complexity_budget
          tests/test_context_efficiency.py::test_security_scan_reparses_a_tree_changed_by_an_intermediate_consumer
      - name: Test shard
        run: >-
          python -m pytest -n 3 -q --factory-ci-shard=${{ matrix.shard }}/4
          --junitxml=pytest-results.xml --durations=20
      - name: Upload test results and timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pytest-windows-latest-${{ matrix.python }}-shard-${{ matrix.shard }}
          path: pytest-results.xml
          if-no-files-found: error

  windows-test:
    name: test (windows-latest, ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: windows-shards
    if: ${{ always() }}
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Require every Windows test shard to pass
        env:
          SHARD_RESULT: ${{ needs.windows-shards.result }}
        run: test "$SHARD_RESULT" = success

  native-process-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'macos-latest' && 'macos-15-intel' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install native parity test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify native process parity
        run: >-
          python -m pytest -q -rA
          tests/test_assembly_process.py::test_ci_runs_native_python_matrix_on_all_supported_host_families
          tests/test_assembly_process.py::test_candidate_quality_gate_keeps_attribution_floor_and_python_cap
          tests/test_assembly_process.py::test_native_timeout_returns_closed_receipt
          tests/test_assembly_process.py::test_native_output_limit_returns_closed_receipt
          tests/test_assembly_process.py::test_native_cancellation_returns_closed_receipt
          tests/test_assembly_process.py::test_native_surviving_child_is_unconfirmed
          --junitxml=native-process-parity.junit.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-process-parity-${{ matrix.os }}
          path: native-process-parity.junit.xml
          if-no-files-found: error

  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          # Check only publishable archives; ignored scratch directories in
          # dist/ must never be interpreted as distributions.
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Prove the wheel installs without the source tree
        run: |
          python -m venv /tmp/factory-wheel
          /tmp/factory-wheel/bin/python -m pip install dist/*.whl
          cp scripts/release_train_e2e.py /tmp/release_train_e2e.py
          cd /tmp
          /tmp/factory-wheel/bin/factory --help
          /tmp/factory-wheel/bin/factory-recall-evidence review --help
          ! /tmp/factory-wheel/bin/factory verify missing-feature --root /tmp --strict-release --json
          /tmp/factory-wheel/bin/python -c "import factoryline; print(factoryline.__version__)"
          /tmp/factory-wheel/bin/python /tmp/release_train_e2e.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  five-brick-prooflab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Install pinned TypeScript parser for the ForgeLine TSX doctor canary
        run: npm install --no-save --no-package-lock typescript@5.9.3
      - name: Install candidate wheel with public companion wheels
        run: >-
          python -m pip install --only-binary=:all: ".[dev,factory]"
      - name: Run HSF admission extraction-failure integration test
        run: >-
          python -m pytest -q
          tests/test_loop_passport.py::test_hsf_admission_advice_routes_extraction_failure_to_human_review
      - run: factory doctor --strict
      - name: Build and verify five-brick Factory Passport
        run: python -I scripts/prooflab_e2e.py
      - name: Prove complete release decisions and reject incomplete ones
        run: python scripts/release_train_e2e.py

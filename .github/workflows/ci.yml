name: ci
on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --no-audit
      - name: Audit production and build dependencies without ignore rules
        run: npm run audit
      - run: npm test

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,enterprise]"
      - name: Enforce architecture and per-file growth budgets
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m factoryline.cli architecture health --strict --json
      - name: Test without runtime coverage
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.11'
        run: python -m pytest -n 2 -q --junitxml=pytest-results.xml --durations=20
      - name: Start runtime coverage receipt
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python tools/workflow-audit/write-ci-runtime-coverage.py start
      - name: Test with runtime statement and branch coverage
        id: runtime-tests
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: >-
          python -m pytest -p pytest_asyncio.plugin -p xdist.plugin -q -n 2 -p pytest_cov.plugin
          --junitxml=.factory/test-reports/pytest.xml --durations=20
          --cov=factoryline --cov-branch
          --cov-report=json:.factory/test-reports/coverage.json
          --cov-report=xml:.factory/test-reports/coverage.xml
      - name: Finish runtime coverage receipt
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        env:
          TEST_OUTCOME: ${{ steps.runtime-tests.outcome }}
        run: python tools/workflow-audit/write-ci-runtime-coverage.py finish
      - name: Upload test results and timing evidence
        if: always() && (matrix.os != 'ubuntu-latest' || matrix.python != '3.11')
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-results.xml
          if-no-files-found: error
      - name: Upload runtime coverage reports
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytest-${{ matrix.os }}-${{ matrix.python }}
          path: |
            .factory/test-reports/pytest.xml
            .factory/test-reports/coverage.json
            .factory/test-reports/coverage.xml
            .factory/test-reports/coverage.run.json
          include-hidden-files: true
          if-no-files-found: error

  native-process-parity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install native parity test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify native process parity
        run: >-
          python -m pytest -q -rA tests/test_ci_platform_parity.py
          --junitxml=native-process-parity.junit.xml
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: native-process-parity-${{ matrix.os }}
          path: native-process-parity.junit.xml
          if-no-files-found: error

  package-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and inspect distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          # Check only publishable archives; ignored scratch directories in
          # dist/ must never be interpreted as distributions.
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Prove the wheel installs without the source tree
        run: |
          python -m venv /tmp/factory-wheel
          /tmp/factory-wheel/bin/python -m pip install dist/*.whl
          cp scripts/release_train_e2e.py /tmp/release_train_e2e.py
          cd /tmp
          /tmp/factory-wheel/bin/factory --help
          ! /tmp/factory-wheel/bin/factory verify missing-feature --root /tmp --strict-release --json
          /tmp/factory-wheel/bin/python -c "import factoryline; print(factoryline.__version__)"
          /tmp/factory-wheel/bin/python /tmp/release_train_e2e.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  five-brick-prooflab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
      - name: Install pinned TypeScript parser for the ForgeLine TSX doctor canary
        run: npm install --no-save --no-package-lock typescript@5.9.3
      - name: Check out reviewed immutable companion revisions
        run: |
          git init ../code-factory-1-spec && git -C ../code-factory-1-spec fetch --depth 1 https://github.com/zrk222/code-factory-1-spec.git 6da88be2e99bd8082e950673ee5151db84c43f2d && git -C ../code-factory-1-spec checkout --detach FETCH_HEAD
          git init ../code-factory-2-forge && git -C ../code-factory-2-forge fetch --depth 1 https://github.com/zrk222/code-factory-2-forge.git 77eea36a7b7762b834997e0fa1be9132070af928 && git -C ../code-factory-2-forge checkout --detach FETCH_HEAD
          git init ../code-factory-3-compile && git -C ../code-factory-3-compile fetch --depth 1 https://github.com/zrk222/code-factory-3-compile.git 2f09e463f6f4bb896691a39807a664878f9e62f4 && git -C ../code-factory-3-compile checkout --detach FETCH_HEAD
          git init ../code-factory-4-design && git -C ../code-factory-4-design fetch --depth 1 https://github.com/zrk222/code-factory-4-design.git 3190b17d4c242fd18c13306309d33ccb2b24ba04 && git -C ../code-factory-4-design checkout --detach FETCH_HEAD
      - name: Install source train
        run: >-
          python -m pip install -e .
          -e ../code-factory-1-spec
          -e ../code-factory-2-forge
          -e ../code-factory-3-compile
          -e ../code-factory-4-design
      - run: factory doctor --strict
      - name: Build and verify five-brick Factory Passport
        run: python scripts/prooflab_e2e.py
      - name: Prove complete release decisions and reject incomplete ones
        run: python scripts/release_train_e2e.py

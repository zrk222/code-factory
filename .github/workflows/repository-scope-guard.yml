name: Repository product scope

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: repository-scope-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repository-scope-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Install trusted base revision
        run: python -m pip install .
      - name: Fetch candidate Git objects without checking out candidate files
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          policy_path='.factory/repository-scope.json'
          if ! git cat-file -e "${PR_BASE_SHA}:${policy_path}" 2>/dev/null; then
            echo "trusted base revision has no repository scope policy" >&2
            exit 1
          fi
          git fetch --no-tags origin \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr/${PR_NUMBER}"
          fetched_head="$(git rev-parse "refs/remotes/origin/pr/${PR_NUMBER}^{commit}")"
          if [[ "$fetched_head" != "$PR_HEAD_SHA" ]]; then
            echo "fetched pull request head does not match the event SHA" >&2
            exit 1
          fi
      - name: Enforce trusted repository product boundaries
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if python -m factoryline.cli change scope-check \
            --root . \
            --base "$PR_BASE_SHA" \
            --head "$PR_HEAD_SHA" \
            --policy-ref "$PR_BASE_SHA" \
            --json > repository-scope-review.json; then
            cat repository-scope-review.json >> "$GITHUB_STEP_SUMMARY"
          else
            cat repository-scope-review.json
            exit 1
          fi

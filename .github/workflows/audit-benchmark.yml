name: Public seeded audit benchmark
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_benchmark_lab.py
      - run: python -m factoryline.benchmark_lab > public-benchmark-receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-seeded-benchmark-receipt
          path: public-benchmark-receipt.json

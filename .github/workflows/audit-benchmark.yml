name: Public seeded audit benchmark
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest tests/test_benchmark_lab.py
      - run: python -m factoryline.benchmark_lab > public-benchmark-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: public-seeded-benchmark-receipt
          path: public-benchmark-receipt.json

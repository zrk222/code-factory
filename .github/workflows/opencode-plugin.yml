name: OpenCode native plugin

on:
  push:
    paths:
      - "plugins/code-factory-opencode/**"
      - "editors/proof-client/**"
      - ".github/workflows/opencode-plugin.yml"
  pull_request:
    paths:
      - "plugins/code-factory-opencode/**"
      - "editors/proof-client/**"
      - ".github/workflows/opencode-plugin.yml"
  workflow_dispatch:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/code-factory-opencode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/code-factory-opencode/package-lock.json
      - run: npm ci --no-audit
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: code-factory-opencode-0.1.0
          path: plugins/code-factory-opencode/code-factory-opencode-0.1.0.tgz
          if-no-files-found: error

name: IntelliJ plugin

on:
  push:
    branches: [main]
    paths:
      - "editors/intellij/**"
      - ".github/workflows/intellij-plugin.yml"
  pull_request:
    paths:
      - "editors/intellij/**"
      - ".github/workflows/intellij-plugin.yml"
  workflow_dispatch:

concurrency:
  group: intellij-plugin-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  test-package-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@v5
      - name: Free runner disk for IDE verification
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force
          df -h
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.2.0
      - run: chmod +x gradlew
      - name: Build, verify, and preflight plugin package
        shell: bash
        run: |
          # JetBrains-hosted dependency metadata can return transient 5xx
          # responses. Retry only at the CI boundary; a persistent build,
          # package, verifier, or preflight defect still fails the job.
          for attempt in 1 2 3; do
            if ./gradlew check buildPlugin verifyPlugin marketplacePreflight; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Package verification attempt $attempt failed; retrying once the upstream repository recovers."
              sleep 20
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: factoryline-intellij-plugin
          path: editors/intellij/build/distributions/*.zip

  compatibility:
    needs: test-package-verify
    strategy:
      fail-fast: false
      matrix:
        product:
          - IntellijIdea
          - PyCharm
          - WebStorm
          - Rider
          - CLion
          - GoLand
          - RustRover
          - DataGrip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8.0.1
        with:
          name: factoryline-intellij-plugin
          path: ${{ runner.temp }}/factoryline-intellij-plugin
      - name: Free runner disk for IDE verification
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force
          df -h
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6.2.0
      - run: chmod +x gradlew
      - name: Resolve verified plugin archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t archives < <(find "$RUNNER_TEMP/factoryline-intellij-plugin" -type f -name "*.zip" -print)
          test "${#archives[@]}" -eq 1
          printf '%s\n' "${archives[0]}" > "$RUNNER_TEMP/factoryline-plugin-archive.txt"
      - name: Resolve current DataGrip archive
        if: matrix.product == 'DataGrip'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/datagrip-url.txt"
          import json
          from urllib.request import urlopen

          with urlopen("https://data.services.jetbrains.com/products/releases?code=DG&latest=true&type=release") as response:
              release = json.load(response)["DG"][0]
          print(release["downloads"]["linux"]["link"])
          PY
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/datagrip.tar.gz" "$(cat "$RUNNER_TEMP/datagrip-url.txt")"
          mkdir -p "$RUNNER_TEMP/datagrip"
          tar -xzf "$RUNNER_TEMP/datagrip.tar.gz" -C "$RUNNER_TEMP/datagrip" --strip-components=1
          test -f "$RUNNER_TEMP/datagrip/product-info.json"
      - name: Verify plugin against selected IDE
        shell: bash
        run: |
          archive="$(cat "$RUNNER_TEMP/factoryline-plugin-archive.txt")"
          # The verifier and IDE artifacts are resolved from JetBrains-hosted
          # repositories. Retry only at the CI boundary for transient 5xx
          # responses; a persistent compatibility defect still fails the job.
          for attempt in 1 2 3; do
            if [ "${{ matrix.product }}" = "DataGrip" ]; then
              if ./gradlew verifyPlugin -PfactorylineVerificationArchive="$archive" -PfactorylineVerificationProduct=DataGrip -PfactorylineLocalVerificationIde="$RUNNER_TEMP/datagrip"; then
                exit 0
              fi
            elif ./gradlew verifyPlugin -PfactorylineVerificationArchive="$archive" -PfactorylineVerificationProduct=${{ matrix.product }}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Verifier attempt $attempt failed; retrying once the upstream repository recovers."
              sleep 20
            fi
          done
          exit 1

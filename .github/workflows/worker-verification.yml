name: SDK worker CVE regression
on:
  pull_request:
    paths:
      - deploy/deep-adapters/**
      - .dockerignore
      - factoryline/__init__.py
      - factoryline/assembly_process.py
      - factoryline/audit_action_refs.py
      - factoryline/audit_taxonomy.py
      - factoryline/data/junie_pack.json
      - factoryline/deep_audit.py
      - factoryline/deep_audit_attestation.py
      - factoryline/deep_audit_io.py
      - factoryline/deep_audit_contract.py
      - factoryline/deep_audit_loop.py
      - factoryline/deep_audit_sarif.py
      - factoryline/enterprise_receipts.py
      - factoryline/repository_checkpoint_audit.py
      - factoryline/runtime_audit_common.py
      - factoryline/runtime_audit_process.py
      - scripts/verify_worker_cves*.mjs
      - scripts/verify_semgrep_surface.mjs
      - scripts/semgrep_mutation_controls*.mjs
      - scripts/verify_codeql_cross_file.mjs
      - scripts/select_worker_targets*.mjs
      - .github/workflows/worker-verification.yml
  push:
    branches: [main]
    paths:
      - deploy/deep-adapters/**
      - .dockerignore
      - factoryline/__init__.py
      - factoryline/assembly_process.py
      - factoryline/audit_action_refs.py
      - factoryline/audit_taxonomy.py
      - factoryline/data/junie_pack.json
      - factoryline/deep_audit.py
      - factoryline/deep_audit_attestation.py
      - factoryline/deep_audit_io.py
      - factoryline/deep_audit_contract.py
      - factoryline/deep_audit_loop.py
      - factoryline/deep_audit_sarif.py
      - factoryline/enterprise_receipts.py
      - factoryline/repository_checkpoint_audit.py
      - factoryline/runtime_audit_common.py
      - factoryline/runtime_audit_process.py
      - scripts/verify_worker_cves*.mjs
      - scripts/verify_semgrep_surface.mjs
      - scripts/semgrep_mutation_controls*.mjs
      - scripts/verify_codeql_cross_file.mjs
      - scripts/select_worker_targets*.mjs
      - .github/workflows/worker-verification.yml
  workflow_dispatch:
    inputs:
      target:
        description: Manual worker selection; automatic PR/push checks are unchanged
        type: choice
        options: [all, osv-worker]
        default: all

permissions:
  contents: read

concurrency:
  group: worker-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan-worker-targets:
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.targets.outputs.sdk }}
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Select SDK validation targets
        id: targets
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_JSON: ${{ toJSON(github.event) }}
        # Only baseline code may decide to skip SDK checks. Candidate controls run
        # in a separate job and cannot alter this selection environment.
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, mkdtempSync, writeFileSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          const targets = ['codeql-python-worker', 'codeql-javascript-worker', 'codeql-actions-worker', 'osv-worker', 'syft-worker', 'gitleaks-worker', 'trivy-worker', 'runtime-worker', 'fuzz-worker'];
          let result = { sdk: 'true', matrix: JSON.stringify(targets), reason: 'trusted-baseline-unavailable' };
          let temporary;
          try {
            const event = JSON.parse(process.env.GITHUB_EVENT_JSON);
            if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch' && event.inputs?.target === 'osv-worker') {
              appendFileSync(process.env.GITHUB_OUTPUT, `sdk=true\nmatrix=${JSON.stringify(['osv-worker'])}\nreason=manual-osv-only\n`);
              process.exit(0);
            }
            const base = process.env.GITHUB_EVENT_NAME === 'pull_request' ? event.pull_request?.base?.sha : process.env.GITHUB_EVENT_NAME === 'push' ? event.before : null;
            if (!/^[a-f0-9]{40}$/.test(base ?? '') || /^0{40}$/.test(base)) throw new Error('no baseline');
            const source = execFileSync('git', ['show', `${base}:scripts/select_worker_targets.mjs`], { encoding: 'utf8', timeout: 10000 });
            temporary = mkdtempSync(join(process.env.RUNNER_TEMP, 'trusted-worker-selector-'));
            const path = join(temporary, 'selector.mjs');
            writeFileSync(path, source);
            const selected = JSON.parse(execFileSync(process.execPath, [path], { encoding: 'utf8', timeout: 30000, env: { ...process.env, GITHUB_OUTPUT: '' } }));
            if (!['true', 'false'].includes(selected.sdk) || selected.matrix !== JSON.stringify(targets) || !/^[a-z-]+$/.test(selected.reason ?? '')) throw new Error('invalid selector output');
            result = selected;
          } catch {
            // Missing or failing baseline is conservative: build every SDK worker.
          } finally {
            if (temporary) rmSync(temporary, { recursive: true, force: true });
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `sdk=${result.sdk}\nmatrix=${result.matrix}\nreason=${result.reason}\n`);
          NODE
  selector-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Check candidate worker regression and target selector controls
        run: node --test scripts/select_worker_targets.test.mjs scripts/verify_worker_cves.test.mjs scripts/verify_osv_worker.test.mjs scripts/semgrep_mutation_controls.test.mjs
  semgrep-surface:
    if: github.event_name != 'workflow_dispatch' || inputs.target != 'osv-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Build hash-bound multi-language rule worker
        run: docker build --platform linux/amd64 --target semgrep-worker -f deploy/deep-adapters/Dockerfile -t factory-semgrep:candidate .
      - name: Verify vulnerable and safe native controls in isolation
        run: node scripts/verify_semgrep_surface.mjs factory-semgrep:candidate semgrep-surface-verification.json
      - name: Preserve image and source-bound control evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: semgrep-surface-verification
          path: |
            semgrep-surface-verification.json
            semgrep-surface-verification.json.sarif
            semgrep-surface-verification.json.suppression-enabled.sarif
          if-no-files-found: error
  sdk-workers:
    needs: plan-worker-targets
    if: needs.plan-worker-targets.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan-worker-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Check regression verifier positive and fail-closed controls
        run: node --test scripts/verify_worker_cves.test.mjs
      - name: Build SDK worker from reviewed recipe
        run: docker build --platform linux/amd64 --target "${{ matrix.target }}" -f deploy/deep-adapters/Dockerfile -t factory-worker:candidate .
      - name: Verify original fifteen CVEs and package imports using immutable image ID
        run: node scripts/verify_worker_cves.mjs factory-worker:candidate worker-verification.json "${{ matrix.target }}"
      - name: Require actual OSV native lookup and suppression controls
        if: matrix.target == 'osv-worker'
        run: node scripts/verify_osv_worker.mjs factory-worker:candidate osv-native-verification.json
      - name: Preserve native OSV results including failures
        if: always() && matrix.target == 'osv-worker'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: osv-native-verification
          path: |
            osv-native-verification.json
            osv-native-verification.json.*.bundle.json
          if-no-files-found: error
      - name: Export verified manual OSV image for local recovery
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'osv-worker' && matrix.target == 'osv-worker'
        shell: bash
        run: |
          set -euo pipefail
          mkdir worker-export
          image_id="$(docker image inspect factory-worker:candidate --format '{{.Id}}')"
          printf '%s\n' "$image_id" > worker-export/image-id.txt
          git rev-parse HEAD > worker-export/source-commit.txt
          docker save "$image_id" | gzip -1 > worker-export/osv-worker.tar.gz
          cd worker-export
          sha256sum osv-worker.tar.gz > archive-sha256.txt
      - name: Retain verified manual OSV image briefly
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'osv-worker' && matrix.target == 'osv-worker'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: osv-worker-image-${{ github.sha }}
          path: worker-export/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Verify JavaScript cross-file source-to-sink controls
        if: matrix.target == 'codeql-javascript-worker'
        run: node scripts/verify_codeql_cross_file.mjs factory-worker:candidate codeql-cross-file-verification.json
      - name: Preserve cross-file findings and flow evidence
        if: always() && matrix.target == 'codeql-javascript-worker'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-cross-file-verification
          path: |
            codeql-cross-file-verification.json
            codeql-cross-file-verification.json.*.bundle.json
          if-no-files-found: error
      - name: Verify GitHub Actions injection and safe environment controls
        if: matrix.target == 'codeql-actions-worker'
        run: node scripts/verify_codeql_cross_file.mjs factory-worker:candidate codeql-actions-verification.json actions
      - name: Preserve workflow injection findings and flow evidence
        if: always() && matrix.target == 'codeql-actions-worker'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-actions-verification
          path: |
            codeql-actions-verification.json
            codeql-actions-verification.json.*.bundle.json
          if-no-files-found: error
      - name: Preserve hash-bound tracker and installed source-version evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: worker-verification-${{ matrix.target }}
          path: worker-verification.json
          if-no-files-found: error

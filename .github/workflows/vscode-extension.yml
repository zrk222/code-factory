name: VS Code extension

on:
  push:
    paths:
      - "editors/vscode/**"
      - "editors/proof-client/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "editors/vscode/**"
      - "editors/proof-client/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:

jobs:
  test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Pin the audited npm client
        run: npm install --global npm@10.9.4
      # Audit is a separate mandatory full-lockfile OSV step below.
      - run: npm ci --no-audit
      - run: npm run audit
      - run: npm test
      - run: npx vsce package --no-dependencies --out factoryline-vscode.vsix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: factoryline-vscode-vsix
          path: editors/vscode/factoryline-vscode.vsix

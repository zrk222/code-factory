name: Publish VS Code Marketplace extension

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Immutable repository tag to package (for example v0.44.0)"
        required: true
        type: string
      publish:
        description: "Publish the verified VSIX after protected-environment review"
        required: true
        default: false
        type: boolean
      release_contract:
        description: "Workspace-contained, source-bound release contract (for example release-contracts/vscode.json)"
        required: true
        type: string

      cadence_exception_reason:
        description: "Owner-approved one-time 1.1.4 cadence exception reason"
        required: false
        default: ""
        type: string
      web_upload:
        description: "Prepare the protected candidate for manual website upload; skip CLI publication"
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: vscode-marketplace-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  attested-source:
    name: resolve protected source and verify CI evidence
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted tools to the workflow commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git checkout --detach "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Require a reviewed immutable tag on protected main
        id: source
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_REF" =~ ^vscode-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          candidate=$(git rev-parse --verify "${RELEASE_REF}^{commit}")
          git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"
          python -m factoryline.signed_receipts fetch-ci "$candidate" "$RUNNER_TEMP/ci-release-evidence"
          echo "commit=$candidate" >> "$GITHUB_OUTPUT"

  authorize:
    name: authorize protected Marketplace publication
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - name: Record the protected release authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.VSCE_PAT }}" || {
            echo "VSCE_PAT is required in the vscode-marketplace environment." >&2
            exit 1
          }
          echo "A scoped Visual Studio Marketplace publisher credential is available."

  validate:
    permissions:
      contents: read
    name: validate immutable Marketplace candidate
    needs: [authorize, attested-source]
    if: ${{ always() && needs.attested-source.result == 'success' && (inputs.publish == false || needs.authorize.result == 'success') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind protected-main checkout to approved candidate
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$APPROVED_COMMIT" "$GITHUB_SHA"
          git checkout --detach "$APPROVED_COMMIT"
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"

      - name: Require an immutable release tag
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^vscode-v[0-9]+\.[0-9]+\.[0-9]+(\+build\.[1-9][0-9]*)?$ ]] || {
            echo "release_ref must be a dedicated tag such as vscode-v1.0.2." >&2
            exit 1
          }
          test "$(git rev-list -n 1 "$RELEASE_REF")" = "$(git rev-parse HEAD)" || {
            echo "Checked-out commit does not match $RELEASE_REF." >&2
            exit 1
          }
          git tag --points-at HEAD --format='%(refname:short)' | grep -Fx "$RELEASE_REF" >/dev/null || {
            echo "$RELEASE_REF is not an immutable tag pointing at HEAD." >&2
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Pin the audited npm client
        run: npm install --global npm@10.9.4

      - name: Install, audit, test, and package
        run: |
          set -euo pipefail
          npm ci --no-audit
          npm run audit
          npm test
          version="$(node -p "require('./package.json').version")"
          npx vsce package --no-dependencies --out "factoryline-vscode-${version}.vsix"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Code Factory preflight runtime
        working-directory: ${{ github.workspace }}
        run: python -m pip install .

      - name: Prepare source-bound release contract
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_CONTRACT_PATH: ${{ inputs.release_contract }}
          APPROVED_BY: ${{ github.actor }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          raw = os.environ["RELEASE_CONTRACT_PATH"]
          if Path(raw).is_absolute() or raw.startswith(("/", "\\")):
              raise SystemExit("release_contract must be workspace-relative")
          candidate = (root / raw).resolve()
          try:
              candidate.relative_to(root)
          except ValueError as exc:
              raise SystemExit("release_contract escapes the workspace") from exc
          PY
          python scripts/prepare_release_contract.py \
            --root . \
            --feature "vscode-${RELEASE_REF}" \
            --out "$RELEASE_CONTRACT_PATH" \
            --approved-by "$APPROVED_BY"

      - name: Require the sealed candidate preflight
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_CONTRACT_PATH: ${{ inputs.release_contract }}
          RELEASE_REF: ${{ inputs.release_ref }}
          PUBLISH: ${{ inputs.publish }}
          EXCEPTION_REASON: ${{ inputs.cadence_exception_reason }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CONTRACT_PATH" != /* && "$RELEASE_CONTRACT_PATH" != *..* ]] || { echo "release_contract must be a workspace-relative path" >&2; exit 1; }
          test -f "$RELEASE_CONTRACT_PATH" || { echo "release contract is not present in the immutable checkout" >&2; exit 1; }
          exception_args=()
          if [[ -n "$EXCEPTION_REASON" ]]; then
            test "$PUBLISH" = true
            test "$RELEASE_REF" = vscode-v1.1.4
            test "$GITHUB_ACTOR" = zrk222
            python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          reason = os.environ["EXCEPTION_REASON"].strip()
          assert 12 <= len(reason) <= 500
          contract = json.loads(Path(os.environ["RELEASE_CONTRACT_PATH"]).read_text())
          assert contract["approved_by"] == os.environ["GITHUB_ACTOR"]
          now = datetime.now(timezone.utc)
          value = {
              "schema": "factory.release-cadence-exception.v1", "channel": "vscode", "version": "1.1.4",
              "candidate_tag": "vscode-v1.1.4", "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "requesting_actor": os.environ["GITHUB_ACTOR"], "environment": "vscode-marketplace", "environment_authorized": True,
              "publish_enabled": True, "workflow_run_id": os.environ["GITHUB_RUN_ID"], "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "issued_at": now.isoformat(), "expires_at": (now + timedelta(minutes=30)).isoformat(), "reason": reason
          }
          Path(".factory/release-cadence-exception.json").write_text(json.dumps(value))
          PY
            exception_args=(--cadence-exception .factory/release-cadence-exception.json)
          fi
          python -m factoryline.cli release preflight \
            --root . \
            --channel vscode \
            --candidate-tag "$RELEASE_REF" \
            --contract "$RELEASE_CONTRACT_PATH" \
            --artifact-dir editors/vscode \
            --metadata-path context/PROGRESS.md \
            --out editors/vscode/release-preflight.json \
            "${exception_args[@]}" \
            --json

      - name: Seal the verified Marketplace candidate
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . -maxdepth 1 -type f -name 'factoryline-vscode-*.vsix' -print)
          test "${#packages[@]}" -eq 1
          mkdir -p "$GITHUB_WORKSPACE/vscode-marketplace-candidate"
          cp "${packages[0]}" "$GITHUB_WORKSPACE/vscode-marketplace-candidate/"
          sha256sum "${packages[0]}" > "$GITHUB_WORKSPACE/vscode-marketplace-candidate/SHA256SUMS.txt"
          cp release-preflight.json "$GITHUB_WORKSPACE/vscode-marketplace-candidate/"
          python "$GITHUB_WORKSPACE/scripts/verify_release_preflight.py" release-preflight.json
          version="$(node -p "require('./package.json').version")"
          printf 'release_ref=%s\ncommit=%s\npublisher=zrk222\nextension=factoryline-vscode\nversion=%s\n' \
            "$RELEASE_REF" "$(git rev-parse HEAD)" "$version" > "$GITHUB_WORKSPACE/vscode-marketplace-candidate/manifest.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vscode-marketplace-candidate-${{ inputs.release_ref }}
          path: vscode-marketplace-candidate/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish verified Marketplace candidate
    if: ${{ always() && inputs.publish == true && inputs.web_upload != true && needs.authorize.result == 'success' && needs.validate.result == 'success' }}
    needs: [authorize, validate, attested-source]
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted publisher and recheck immutable candidate tag
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$APPROVED_COMMIT" "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "refs/tags/$RELEASE_REF"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$APPROVED_COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vscode-marketplace-candidate-${{ inputs.release_ref }}
          path: vscode-marketplace-candidate

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Verify sealed candidate
        shell: bash
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          cd vscode-marketplace-candidate
          sha256sum --check SHA256SUMS.txt
          test -f manifest.txt
          grep -Fx "commit=$APPROVED_COMMIT" manifest.txt >/dev/null
          grep -Fx "release_ref=$RELEASE_REF" manifest.txt >/dev/null
          mapfile -t packages < <(find . -maxdepth 1 -type f -name 'factoryline-vscode-*.vsix' -print)
          test "${#packages[@]}" -eq 1
          vsix="${packages[0]}"
          test -f release-preflight.json
          python "$GITHUB_WORKSPACE/scripts/verify_release_preflight.py" release-preflight.json
          grep -Fx 'publisher=zrk222' manifest.txt >/dev/null
          grep -Fx 'extension=factoryline-vscode' manifest.txt >/dev/null
          python - "$vsix" "$(cut -d= -f2- < <(grep -m1 '^version=' manifest.txt))" <<'PY'
          import json
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as archive:
              package = json.loads(archive.read("extension/package.json"))
          if (package.get("publisher"), package.get("name"), package.get("version")) != (
              "zrk222", "factoryline-vscode", sys.argv[2]
          ):
              raise SystemExit("sealed VSIX identity does not match its manifest")
          PY
          echo "VSCODE_VSIX_PATH=vscode-marketplace-candidate/${vsix#./}" >> "$GITHUB_ENV"

      - name: Publish verified VSIX to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VSCODE_VSIX_PATH"
          test -f "$VSCODE_VSIX_PATH"
          (cd vscode-marketplace-candidate && sha256sum --check SHA256SUMS.txt)
          npx --yes @vscode/vsce@4.0.0 publish \
            --packagePath "$VSCODE_VSIX_PATH" \
            --skip-duplicate

name: Publish VS Code Marketplace extension

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Immutable repository tag to package (for example v0.44.0)"
        required: true
        type: string
      publish:
        description: "Publish the verified VSIX after protected-environment review"
        required: true
        default: false
        type: boolean
      release_contract:
        description: "Workspace-contained, source-bound release contract (for example release-contracts/vscode.json)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vscode-marketplace-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize protected Marketplace publication
    if: inputs.publish == true
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    steps:
      - name: Record the protected release authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.VSCE_PAT }}" || {
            echo "VSCE_PAT is required in the vscode-marketplace environment." >&2
            exit 1
          }
          echo "A scoped Visual Studio Marketplace publisher credential is available."

  validate:
    name: validate immutable Marketplace candidate
    needs: authorize
    if: ${{ always() && (inputs.publish == false || needs.authorize.result == 'success') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Require an immutable release tag
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
            echo "release_ref must be an immutable tag such as v0.44.0." >&2
            exit 1
          }
          test "$(git rev-list -n 1 "$RELEASE_REF")" = "$(git rev-parse HEAD)" || {
            echo "Checked-out commit does not match $RELEASE_REF." >&2
            exit 1
          }
          git tag --points-at HEAD --format='%(refname:short)' | grep -Fx "$RELEASE_REF" >/dev/null || {
            echo "$RELEASE_REF is not an immutable tag pointing at HEAD." >&2
            exit 1
          }

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Pin the audited npm client
        run: npm install --global npm@10.9.4

      - name: Install, audit, test, and package
        run: |
          set -euo pipefail
          npm ci --no-audit
          npm run audit
          npm test
          version="$(node -p "require('./package.json').version")"
          npx vsce package --no-dependencies --out "factoryline-vscode-${version}.vsix"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Code Factory preflight runtime
        working-directory: ${{ github.workspace }}
        run: python -m pip install .

      - name: Prepare source-bound release contract
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RELEASE_CONTRACT_PATH: ${{ inputs.release_contract }}
          APPROVED_BY: ${{ github.actor }} (protected vscode deployment approval)
        run: |
          set -euo pipefail
          python scripts/prepare_release_contract.py \
            --root . \
            --feature "vscode-${RELEASE_REF}" \
            --out "$RELEASE_CONTRACT_PATH" \
            --approved-by "$APPROVED_BY"

      - name: Require the sealed candidate preflight
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_CONTRACT_PATH: ${{ inputs.release_contract }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CONTRACT_PATH" != /* && "$RELEASE_CONTRACT_PATH" != *..* ]] || { echo "release_contract must be a workspace-relative path" >&2; exit 1; }
          test -f "$RELEASE_CONTRACT_PATH" || { echo "release contract is not present in the immutable checkout" >&2; exit 1; }
          python -m factoryline.cli release preflight \
            --root . \
            --contract "$RELEASE_CONTRACT_PATH" \
            --artifact-dir editors/vscode \
            --metadata-path context/PROGRESS.md \
            --out editors/vscode/release-preflight.json \
            --json

      - name: Seal the verified Marketplace candidate
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find . -maxdepth 1 -type f -name 'factoryline-vscode-*.vsix' -print)
          test "${#packages[@]}" -eq 1
          mkdir -p "$GITHUB_WORKSPACE/vscode-marketplace-candidate"
          cp "${packages[0]}" "$GITHUB_WORKSPACE/vscode-marketplace-candidate/"
          sha256sum "${packages[0]}" > "$GITHUB_WORKSPACE/vscode-marketplace-candidate/SHA256SUMS.txt"
          cp release-preflight.json "$GITHUB_WORKSPACE/vscode-marketplace-candidate/"
          python "$GITHUB_WORKSPACE/scripts/verify_release_preflight.py" release-preflight.json
          printf 'release_ref=%s\ncommit=%s\npublisher=zrk222\nextension=factoryline-vscode\n' \
            "$RELEASE_REF" "$(git rev-parse HEAD)" > "$GITHUB_WORKSPACE/vscode-marketplace-candidate/manifest.txt"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: vscode-marketplace-candidate-${{ inputs.release_ref }}
          path: vscode-marketplace-candidate/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish verified Marketplace candidate
    if: ${{ always() && inputs.publish == true && needs.authorize.result == 'success' && needs.validate.result == 'success' }}
    needs: [authorize, validate]
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: vscode-marketplace-candidate-${{ inputs.release_ref }}
          path: vscode-marketplace-candidate

      - name: Verify sealed candidate
        shell: bash
        run: |
          set -euo pipefail
          cd vscode-marketplace-candidate
          sha256sum --check SHA256SUMS.txt
          test -f manifest.txt
          find . -maxdepth 1 -type f -name 'factoryline-vscode-*.vsix' -print -quit | grep -q .
          test -f release-preflight.json
          python "$GITHUB_WORKSPACE/scripts/verify_release_preflight.py" release-preflight.json
          grep -Fx 'publisher=zrk222' manifest.txt >/dev/null
          grep -Fx 'extension=factoryline-vscode' manifest.txt >/dev/null

      - name: Publish verified VSIX to Visual Studio Marketplace
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @vscode/vsce@3.9.1 publish \
            --packagePath "$(find vscode-marketplace-candidate -maxdepth 1 -type f -name 'factoryline-vscode-*.vsix' -print -quit)" \
            --skip-duplicate

name: Deep code analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build: none
          - language: javascript-typescript
            build: none
          - language: actions
            build: none
          - language: java-kotlin
            build: manual
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        if: matrix.language == 'java-kotlin'
      - name: Initialize pinned semantic analyzer
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          queries: security-extended
      - name: Compile IntelliJ production sources for Kotlin extraction
        if: matrix.language == 'java-kotlin'
        working-directory: editors/intellij
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx4g'
        run: bash gradlew --no-daemon --no-configuration-cache --no-build-cache --rerun-tasks --max-workers=2 -Pkotlin.incremental=false -Pkotlin.compiler.execution.strategy=in-process assemble
      - name: Analyze source and upload native SARIF
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: '/language:${{ matrix.language }}'
          output: '${{ runner.temp }}/codeql-results'
      - name: Preserve native findings even when upload fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: '${{ runner.temp }}/codeql-results/*.sarif'
          if-no-files-found: warn
      - name: Report evidence boundary
        run: |
          echo '### CodeQL evidence' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full source extraction and security-extended queries; review findings in Security / Code scanning and the native SARIF artifact. Scan completion is not vulnerability clearance or release approval.' >> "$GITHUB_STEP_SUMMARY"

name: Publish JetBrains Marketplace plugin

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Immutable JetBrains release tag to publish (for example jetbrains-v0.7.2)"
        required: true
      channel:
        description: "JetBrains Marketplace release channel"
        required: true
        default: "default"
      release_contract:
        description: "Workspace-contained, source-bound release contract (for example release-contracts/jetbrains.json)"
        required: true
        type: string

      cadence_exception_reason:
        description: "Owner-approved one-time 1.1.4 cadence exception reason"
        required: false
        default: ""
        type: string

permissions:
  actions: read
  attestations: read
  contents: read

concurrency:
  group: jetbrains-marketplace
  cancel-in-progress: false

jobs:
  attested-source:
    name: resolve protected source and verify CI evidence
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted tools to the workflow commit
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          git checkout --detach "$GITHUB_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Require a reviewed immutable tag on protected main
        id: source
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_REF" =~ ^jetbrains-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          candidate=$(git rev-parse --verify "${RELEASE_REF}^{commit}")
          git merge-base --is-ancestor "$candidate" "$GITHUB_SHA"
          python -m factoryline.signed_receipts fetch-ci "$candidate" "$RUNNER_TEMP/ci-release-evidence"
          echo "commit=$candidate" >> "$GITHUB_OUTPUT"

  authorize:
    name: authorize protected Marketplace publication
    runs-on: ubuntu-latest
    environment: jetbrains-marketplace
    steps:
      - name: Validate Marketplace channel
        shell: bash
        env:
          MARKETPLACE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$MARKETPLACE_CHANNEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,49}$ ]] || {
            echo "channel must be a 1-50 character Marketplace identifier." >&2
            exit 1
          }
      - name: Require the scoped Marketplace publisher token before candidate work
        shell: bash
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PUBLISH_TOKEN" || {
            echo "JETBRAINS_MARKETPLACE_TOKEN is required in the jetbrains-marketplace environment." >&2
            exit 1
          }

  validate:
    permissions:
      contents: read
    name: validate Marketplace candidate
    needs: [authorize, attested-source]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind protected-main checkout to approved candidate
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$APPROVED_COMMIT" "$GITHUB_SHA"
          git checkout --detach "$APPROVED_COMMIT"
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
      - name: Require an immutable release tag
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^jetbrains-v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] || {
            echo "release_ref must be a dedicated tag such as jetbrains-v0.7.2." >&2
            exit 1
          }
          test "$(git rev-list -n 1 "$RELEASE_REF")" = "$(git rev-parse HEAD)" || {
            echo "Checked-out commit does not match $RELEASE_REF." >&2
            exit 1
          }
          git tag --points-at HEAD --format='%(refname:short)' | grep -Fx "$RELEASE_REF" >/dev/null || {
            echo "$RELEASE_REF is not an immutable tag pointing at HEAD." >&2
            exit 1
          }
      - name: Require an open Marketplace binary-update slot
        run: python3 "$GITHUB_WORKSPACE/scripts/jetbrains_marketplace_status.py" --plugin-id 33009 --require-upload-slot --json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Test, verify, and check Marketplace package metadata
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew check guardianReleaseGate
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Code Factory preflight runtime
        working-directory: ${{ github.workspace }}
        run: python -m pip install .

      - name: Prepare source-bound release contract
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          APPROVED_BY: ${{ github.actor }} (protected jetbrains deployment approval)
        run: |
          set -euo pipefail
          python scripts/prepare_release_contract.py \
            --root . \
            --feature "jetbrains-${RELEASE_REF}" \
            --out .factory/release-contracts/jetbrains.json \
            --approved-by "$APPROVED_BY"

      - name: Require the sealed candidate preflight
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_CONTRACT_PATH: .factory/release-contracts/jetbrains.json
          RELEASE_REF: ${{ inputs.release_ref }}
          EXCEPTION_REASON: ${{ inputs.cadence_exception_reason }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -f "$RELEASE_CONTRACT_PATH" || { echo "release contract is not present in the immutable checkout" >&2; exit 1; }
          exception_args=()
          if [[ -n "$EXCEPTION_REASON" ]]; then
            test "$RELEASE_REF" = jetbrains-v1.1.4
            test "$GITHUB_ACTOR" = zrk222
            python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          reason = os.environ["EXCEPTION_REASON"].strip()
          assert 12 <= len(reason) <= 500
          contract = json.loads(Path(os.environ["RELEASE_CONTRACT_PATH"]).read_text())
          assert contract["approved_by"] == os.environ["GITHUB_ACTOR"]
          now = datetime.now(timezone.utc)
          value = {
              "schema": "factory.release-cadence-exception.v1", "channel": "jetbrains", "version": "1.1.4",
              "candidate_tag": "jetbrains-v1.1.4", "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "requesting_actor": os.environ["GITHUB_ACTOR"], "environment": "jetbrains-marketplace", "environment_authorized": True,
              "publish_enabled": True, "workflow_run_id": os.environ["GITHUB_RUN_ID"], "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "issued_at": now.isoformat(), "expires_at": (now + timedelta(minutes=30)).isoformat(), "reason": reason
          }
          Path(".factory/release-cadence-exception.json").write_text(json.dumps(value))
          PY
            exception_args=(--cadence-exception .factory/release-cadence-exception.json)
          fi
          python -m factoryline.cli release preflight \
            --root . \
            --channel jetbrains \
            --candidate-tag "$RELEASE_REF" \
            --contract "$RELEASE_CONTRACT_PATH" \
            --artifact-dir editors/intellij/build/distributions \
            --metadata-path context/PROGRESS.md \
            --out editors/intellij/build/distributions/release-preflight.json \
            "${exception_args[@]}" \
            --json
      - name: Seal the verified Marketplace candidate
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          MARKETPLACE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print)
          test "${#archives[@]}" -eq 1 || {
            echo "Expected exactly one plugin ZIP, found ${#archives[@]}." >&2
            exit 1
          }
          test -f build/distributions/release-preflight.json
          python "$GITHUB_WORKSPACE/scripts/verify_release_preflight.py" build/distributions/release-preflight.json
          candidate="$GITHUB_WORKSPACE/marketplace-candidate"
          mkdir -p "$candidate"
          cp "${archives[0]}" "$candidate/factoryline-intellij.zip"
          cp build/distributions/release-preflight.json "$candidate/"
          python "$GITHUB_WORKSPACE/scripts/jetbrains_release_artifact.py" create \
            --archive "$candidate/factoryline-intellij.zip" \
            --manifest "$candidate/manifest.json" \
            --release-ref "$RELEASE_REF" \
            --commit "$(git rev-parse HEAD)" \
            --channel "$MARKETPLACE_CHANNEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jetbrains-marketplace-${{ inputs.release_ref }}
          path: marketplace-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verifier and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jetbrains-validation-reports-${{ inputs.release_ref }}
          path: editors/intellij/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  compatibility:
    permissions:
      contents: read
    name: verify sealed candidate (${{ matrix.product }})
    needs: [validate, attested-source]
    strategy:
      fail-fast: false
      matrix:
        product:
          - IntellijIdea
          - PyCharm
          - WebStorm
          - Rider
          - CLion
          - GoLand
          - RustRover
          - DataGrip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind compatibility source to approved candidate
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$APPROVED_COMMIT" "$GITHUB_SHA"
          git checkout --detach "$APPROVED_COMMIT"
          test "$(git rev-parse HEAD)" = "$APPROVED_COMMIT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Restore Gradle wrapper execute permission
        shell: bash
        run: chmod +x gradlew
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: jetbrains-marketplace-${{ inputs.release_ref }}
          path: marketplace-candidate
      - name: Resolve sealed plugin archive
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/marketplace-candidate/factoryline-intellij.zip"
          test -f "$GITHUB_WORKSPACE/marketplace-candidate/release-preflight.json"
          python "$GITHUB_WORKSPACE/scripts/verify_release_preflight.py" "$GITHUB_WORKSPACE/marketplace-candidate/release-preflight.json"
      - name: Resolve current DataGrip archive
        if: matrix.product == 'DataGrip'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/datagrip-url.txt"
          import json
          from urllib.request import urlopen

          with urlopen("https://data.services.jetbrains.com/products/releases?code=DG&latest=true&type=release") as response:
              release = json.load(response)["DG"][0]
          print(release["downloads"]["linux"]["link"])
          PY
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/datagrip.tar.gz" "$(cat "$RUNNER_TEMP/datagrip-url.txt")"
          mkdir -p "$RUNNER_TEMP/datagrip"
          tar -xzf "$RUNNER_TEMP/datagrip.tar.gz" -C "$RUNNER_TEMP/datagrip" --strip-components=1
          test -f "$RUNNER_TEMP/datagrip/product-info.json"
      - name: Verify sealed plugin against selected IDE
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/marketplace-candidate/factoryline-intellij.zip"
          for attempt in 1 2 3; do
            if [ "${{ matrix.product }}" = "DataGrip" ]; then
              if ./gradlew verifyPlugin \
                -PfactorylineVerificationArchive="$archive" \
                -PfactorylineVerificationProduct=DataGrip \
                -PfactorylineLocalVerificationIde="$RUNNER_TEMP/datagrip"; then
                exit 0
              fi
            elif ./gradlew verifyPlugin \
              -PfactorylineVerificationArchive="$archive" \
              -PfactorylineVerificationProduct=${{ matrix.product }}; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Verifier attempt $attempt failed; retrying only for a transient JetBrains artifact failure."
              sleep 20
            fi
          done
          exit 1
      - name: Preserve compatibility report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jetbrains-compatibility-${{ inputs.release_ref }}-${{ matrix.product }}
          path: editors/intellij/build/reports/pluginVerifier/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: publish verified Marketplace candidate
    needs: [authorize, validate, compatibility, attested-source]
    runs-on: ubuntu-latest
    environment: jetbrains-marketplace
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind trusted publisher and recheck immutable candidate tag
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$APPROVED_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$APPROVED_COMMIT" "$GITHUB_SHA"
          git checkout --detach "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch --no-tags origin "refs/tags/$RELEASE_REF"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$APPROVED_COMMIT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: jetbrains-marketplace-${{ inputs.release_ref }}
          path: marketplace-candidate
      - name: Require the sealed preflight receipt
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/marketplace-candidate/release-preflight.json"
          python "$GITHUB_WORKSPACE/scripts/verify_release_preflight.py" "$GITHUB_WORKSPACE/marketplace-candidate/release-preflight.json"
      - name: Require the scoped Marketplace publisher token
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          test -n "$PUBLISH_TOKEN" || {
            echo "JETBRAINS_MARKETPLACE_TOKEN is required in the jetbrains-marketplace environment." >&2
            exit 1
          }
      - name: Verify the promoted candidate
        shell: bash
        env:
          APPROVED_COMMIT: ${{ needs.attested-source.outputs.commit }}
          RELEASE_REF: ${{ inputs.release_ref }}
          MARKETPLACE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/scripts/jetbrains_release_artifact.py" verify \
            --archive "$GITHUB_WORKSPACE/marketplace-candidate/factoryline-intellij.zip" \
            --manifest "$GITHUB_WORKSPACE/marketplace-candidate/manifest.json" \
            --release-ref "$RELEASE_REF" \
            --commit "$APPROVED_COMMIT" \
            --channel "$MARKETPLACE_CHANNEL"
      - name: Publish verified plugin update
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          MARKETPLACE_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          [[ "$MARKETPLACE_CHANNEL" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,49}$ ]]
          chmod +x gradlew
          ./gradlew publishPlugin --stacktrace \
            -PfactorylineMarketplaceChannel="$MARKETPLACE_CHANNEL" \
            -PfactorylineMarketplaceArchive="$GITHUB_WORKSPACE/marketplace-candidate/factoryline-intellij.zip"

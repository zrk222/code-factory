name: Publish Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy/huggingface/**
      - .github/workflows/huggingface-space.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Require Hugging Face token before candidate work
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || {
            echo "HF_TOKEN is required before Hugging Face Space candidate work." >&2
            exit 1
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate static Space metadata before remote upload
        run: python scripts/huggingface_space_metadata.py --readme deploy/huggingface/README.md --json
      - name: Install Hugging Face CLI
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.29,<2"
      - name: Publish static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_folder(
              repo_id="zrk222/code-factory",
              repo_type="space",
              folder_path="deploy/huggingface",
              path_in_repo=".",
              commit_message=f"Publish Code Factory Space from {os.environ['GITHUB_SHA']}",
          )
          print(f"HF_SPACE_UPLOAD_COMMIT={getattr(info, 'oid', '')}")
          readback = api.repo_info(repo_id="zrk222/code-factory", repo_type="space")
          print(f"HF_SPACE_READBACK_SHA={getattr(readback, 'sha', '')}")
          PY

name: Publish Hugging Face Space

on:
  workflow_dispatch:
    inputs:
      core_0490_publication_exception:
        description: Owner-authorized frozen 0.49.0 static preview publication only
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  actions: read
  attestations: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: huggingface
    steps:
      - name: Require Hugging Face token before candidate work
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN" || {
            echo "HF_TOKEN is required before Hugging Face Space candidate work." >&2
            exit 1
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.core_0490_publication_exception && '1d4701d4f9380037102d6002a927cca789f729f7' || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Require attested clean-runner evidence for this commit
        if: ${{ inputs.core_0490_publication_exception != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m factoryline.signed_receipts fetch-ci "$(git rev-parse HEAD)" "$RUNNER_TEMP/ci-release-evidence"
      - name: Bind the owner-authorized static publication exception
        if: ${{ inputs.core_0490_publication_exception == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "zrk222" ]]
          [[ "$(git rev-parse HEAD)" == "1d4701d4f9380037102d6002a927cca789f729f7" ]]
          gh release view v0.49.0 --json isDraft,targetCommitish > "$RUNNER_TEMP/core-0490-release.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          release = json.loads((Path(os.environ['RUNNER_TEMP']) / 'core-0490-release.json').read_text())
          assert release['isDraft'] is False
          assert release['targetCommitish'] == '818c1068bcc5b0773739179d44b60b87d1f598d5'
          expected = {
              'README.md': '9a1ebcebc60621d9b2209abe81b0825170769f844d451efef3595d59624ec9be',
              'index.html': '54f3f679a3a652c1e80affbfaa661ad4064c8eb2bd40b2e0dd275d2ce4803029',
              'assets/graph-ops-audit-results.png': '9f44c86df4d2bb3407d799d34d53f6ea2dad896f2b8aaedecf985749a6f7660c',
              'assets/graph-ops-audit-telemetry-current.png': '9f5a5b7e9e841e9a41364a915c6afb0a499d972e1e008fac5cd61843c59b1be4',
              'assets/graph-ops-dashboard-current.png': 'c734b22e557454c1816fce4235978e770b9cecaae4213a6d275a336b24505207',
              'assets/remotion-factory-engine.mp4': '3a60f1609c8ef3c95f46f7ecaacf2db5b8dd30bed205ed01239b15e3e280c8ec',
          }
          root = Path('deploy/huggingface')
          assert {p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file()} == set(expected)
          for name, digest in expected.items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest, name
          print('OWNER_0490_STATIC_CONTENT_VERIFIED; attested full CI explicitly waived, not passed')
          PY
      - name: Validate static Space metadata before remote upload
        run: python scripts/huggingface_space_metadata.py --readme deploy/huggingface/README.md --json
      - name: Install Hugging Face CLI
        run: python -m pip install --disable-pip-version-check "huggingface_hub>=0.29,<2"
      - name: Publish static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          info = api.upload_folder(
              repo_id="zrk222/code-factory",
              repo_type="space",
              folder_path="deploy/huggingface",
              path_in_repo=".",
              commit_message=f"Publish Code Factory Space from {os.environ['GITHUB_SHA']}",
          )
          print(f"HF_SPACE_UPLOAD_COMMIT={getattr(info, 'oid', '')}")
          readback = api.repo_info(repo_id="zrk222/code-factory", repo_type="space")
          print(f"HF_SPACE_READBACK_SHA={getattr(readback, 'sha', '')}")
          PY

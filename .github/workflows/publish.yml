name: publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag to validate and publish after review
        required: true
        type: string
      validated_run_id:
        description: Optional completed publish run whose exact green validation artifacts should be reused
        required: false
        default: ''
        type: string
      core_0481_cadence_exception:
        description: Explicit owner-approved one-time cooldown exception for v0.48.1 only
        required: false
        default: false
        type: boolean
      core_0482_cadence_exception:
        description: Explicit owner-approved one-time cadence and monthly-cap exception for v0.48.2 only
        required: false
        default: false
        type: boolean

      core_0495_cadence_exception:
        description: Explicit owner-approved one-time cadence and monthly-cap exception for v0.49.5 only
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: publish-release-train
  cancel-in-progress: false

jobs:
  guard:
    name: require a draft release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub requires write access to read unpublished drafts.
      actions: read
      attestations: read
    outputs:
      candidate_commit: ${{ steps.candidate.outputs.commit }}
      verified_reuse_run_id: ${{ steps.reuse.outputs.run_id }}
      reuse_receipt: ${{ steps.reuse.outputs.receipt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - name: Verify the requested release exists and remains a draft
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Dispatch publication from protected main so the reviewed workflow definition is used." >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "RELEASE_TAG must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          }
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          [[ "$is_draft" == "true" ]] || {
            echo "The requested GitHub release must exist and remain a draft until protected publication." >&2
            exit 1
          }
          candidate_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$candidate_commit" origin/main || {
            echo "The candidate must already be merged into protected main." >&2
            exit 1
          }
          echo "commit=$candidate_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify exact prior validation producers before reuse
        id: reuse
        if: ${{ inputs.validated_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_RUN_ID: ${{ inputs.validated_run_id }}
          CANDIDATE_COMMIT: ${{ steps.candidate.outputs.commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          run_id = os.environ["VALIDATED_RUN_ID"]
          if not re.fullmatch(r"[1-9][0-9]{0,19}", run_id):
              raise SystemExit("Validation run ID must be a positive numeric ID")
          repo, commit, tag = (os.environ[key] for key in ("GITHUB_REPOSITORY", "CANDIDATE_COMMIT", "RELEASE_TAG"))
          base = f"repos/{repo}/actions"
          run = json.loads(subprocess.check_output(["gh", "api", f"{base}/runs/{run_id}"], text=True))
          expected = {"id": int(run_id), "head_sha": commit, "head_branch": "main", "event": "workflow_dispatch", "path": ".github/workflows/publish.yml", "status": "completed"}
          if any(run.get(key) != value for key, value in expected.items()) or any(run.get(key, {}).get("full_name") != repo for key in ("repository", "head_repository")):
              raise SystemExit("Prior validation run repository/source/workflow identity mismatch")
          if type(run.get("run_attempt")) is not int or run["run_attempt"] < 1:
              raise SystemExit("Prior validation run attempt is invalid")
          collections = {}
          for kind, query in (("jobs", "filter=latest&per_page=100"), ("artifacts", "per_page=100")):
              pages = json.loads(subprocess.check_output(["gh", "api", "--paginate", "--slurp", f"{base}/runs/{run_id}/{kind}?{query}"], text=True))
              if not isinstance(pages, list) or not pages or any(not isinstance(page, dict) or not isinstance(page.get(kind), list) for page in pages):
                  raise SystemExit("Invalid paginated validation response")
              rows = [row for page in pages for row in page[kind]]
              if any(type(page.get("total_count")) is not int or page["total_count"] != len(rows) for page in pages):
                  raise SystemExit("Unaccounted validation response pagination")
              collections[kind] = rows
          producers = {
              "guard": "require a draft release tag",
              "python": "validate Python release artifacts",
              "vscode": "validate VS Code release artifact",
              "intellij": "validate JetBrains release artifact",
          }
          jobs = {}
          for channel, name in producers.items():
              selected = [row for row in collections["jobs"] if row.get("name") == name]
              if len(selected) != 1:
                  raise SystemExit("Prior validation producer missing or duplicated")
              job = selected[0]
              if any(job.get(key) != value for key, value in {"run_id": int(run_id), "run_attempt": run["run_attempt"], "head_sha": commit, "head_branch": "main", "status": "completed", "conclusion": "success"}.items()) or type(job.get("id")) is not int or job["id"] < 1:
                  raise SystemExit("Prior validation producer did not complete successfully for this source/attempt")
              jobs[channel] = {key: job[key] for key in ("id", "name", "started_at", "completed_at")}
          if len({job["id"] for job in jobs.values()}) != len(jobs):
              raise SystemExit("Prior validation job identities are duplicated")
          artifacts = []
          for channel in ("python", "vscode", "intellij"):
              name = f"release-{channel}-{tag}"
              selected = [row for row in collections["artifacts"] if row.get("name") == name]
              if len(selected) != 1:
                  raise SystemExit("Prior validation artifact missing or duplicated")
              artifact = selected[0]
              producer = artifact.get("workflow_run", {})
              if artifact.get("expired") is not False or type(artifact.get("size_in_bytes")) is not int or not 0 < artifact["size_in_bytes"] <= 512 * 1024 * 1024 or type(artifact.get("id")) is not int or artifact["id"] < 1 or not re.fullmatch(r"sha256:[0-9a-f]{64}", artifact.get("digest", "")):
                  raise SystemExit("Prior validation artifact is expired, unbounded or missing its digest")
              if any(producer.get(key) != value for key, value in {"id": int(run_id), "head_sha": commit, "head_branch": "main", "repository_id": run["repository"]["id"], "head_repository_id": run["head_repository"]["id"]}.items()):
                  raise SystemExit("Prior artifact producer source identity mismatch")
              started, created, completed, expires = (datetime.fromisoformat(value.replace("Z", "+00:00")) for value in (jobs[channel]["started_at"], artifact["created_at"], jobs[channel]["completed_at"], artifact["expires_at"]))
              if not started <= created <= completed or expires <= datetime.now(timezone.utc):
                  raise SystemExit("Prior artifact is stale or outside its successful producer window")
              artifacts.append({**{key: artifact[key] for key in ("id", "name", "digest", "size_in_bytes", "created_at", "expires_at")}, "channel": channel, "job_id": jobs[channel]["id"]})
          if len({artifact["id"] for artifact in artifacts}) != 3:
              raise SystemExit("Prior artifact identities are duplicated")
          receipt = {"schema": "factory.release-validation-reuse.v1", "repository": repo, "source_commit": commit, "release_tag": tag, "run_id": run_id, "run_attempt": run["run_attempt"], "workflow_path": run["path"], "jobs": jobs, "artifacts": artifacts}
          receipt["receipt_sha256"] = hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\nreceipt={json.dumps(receipt, separators=(',', ':'))}\n")
          print("Exact successful validation producers and immutable artifacts verified for reuse")
          PY
      - run: python -m pip install -e .
      - name: Require attested clean-runner evidence for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m factoryline.signed_receipts fetch-ci "${{ steps.candidate.outputs.commit }}" "$RUNNER_TEMP/ci-release-evidence"
          if [[ -n "${{ steps.reuse.outputs.run_id }}" ]]; then
            python -m factoryline.signed_receipts fetch-ci "$GITHUB_SHA" "$RUNNER_TEMP/ci-tooling-evidence"
          fi
      - name: Enforce cadence using actual GitHub publication timestamps
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CORE_0481_EXCEPTION: ${{ inputs.core_0481_cadence_exception }}
          CORE_0482_EXCEPTION: ${{ inputs.core_0482_cadence_exception }}
          CORE_0495_EXCEPTION: ${{ inputs.core_0495_cadence_exception }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/release-history.json"
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          policy = json.loads(Path("release-train.json").read_text())["cadence"]
          parse = lambda value: datetime.fromisoformat(value.replace("Z", "+00:00"))
          effective = parse(policy["effective_at"])
          now = datetime.now(timezone.utc)
          pages = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release-history.json").read_text())
          published = [parse(item["published_at"]) for page in pages for item in page if not item["draft"]]
          active = sorted(stamp for stamp in published if stamp >= effective)
          recent = [stamp for stamp in active if stamp > now - timedelta(days=30)]
          exception = os.environ.get("CORE_0481_EXCEPTION") == "true"
          current_exception = os.environ.get("CORE_0482_EXCEPTION") == "true"
          latest_exception = os.environ.get("CORE_0495_EXCEPTION") == "true"
          if exception and (os.environ.get("RELEASE_TAG") != "v0.48.1" or os.environ.get("GITHUB_ACTOR") != "zrk222"):
              raise SystemExit("One-time core exception requires owner dispatch of v0.48.1")
          if current_exception and (os.environ.get("RELEASE_TAG") != "v0.48.2" or os.environ.get("GITHUB_ACTOR") != "zrk222"):
              raise SystemExit("One-time core exception requires owner dispatch of v0.48.2")
          if latest_exception and (os.environ.get("RELEASE_TAG") != "v0.49.5" or os.environ.get("GITHUB_ACTOR") != "zrk222"):
              raise SystemExit("One-time core exception requires owner dispatch of v0.49.5")
          if len(recent) >= policy["max_releases_30d"] and not (current_exception or latest_exception):
              raise SystemExit("Actual published release count exceeds admission policy")
          if active and now < active[-1] + timedelta(days=policy["minimum_days_between_releases"]) and not (exception or current_exception or latest_exception):
              raise SystemExit("Actual published release is still within the cooldown")
          print("Published-release cadence admitted; tag timestamps do not authorize publication")
          PY

  validate_python:
    name: validate Python release artifacts
    needs: [guard]
    if: ${{ needs.guard.outputs.verified_reuse_run_id == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release test and build tools
        run: |
          python -m pip install --upgrade build twine
          python -m pip install -e ".[dev,enterprise,hosted]"

      - name: Test
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Clean wheel smoke
        run: |
          python -m venv /tmp/factory-wheel
          /tmp/factory-wheel/bin/python -m pip install dist/*.whl
          /tmp/factory-wheel/bin/factory --help
          if /tmp/factory-wheel/bin/factory trace empty --root /tmp/empty; then
            echo "empty trace unexpectedly verified" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-python-${{ inputs.release_tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  validate_vscode:
    name: validate VS Code release artifact
    needs: [guard]
    if: ${{ needs.guard.outputs.verified_reuse_run_id == '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Pin the audited npm client
        run: npm install --global npm@10.9.4

      - name: Test and package VS Code extension
        run: |
          npm ci --no-audit
          npm run audit
          npm test
          version="$(node -p "require('./package.json').version")"
          npx vsce package --no-dependencies --out "factoryline-vscode-${version}.vsix"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-vscode-${{ inputs.release_tag }}
          path: editors/vscode/factoryline-vscode-*.vsix
          if-no-files-found: error
          retention-days: 30

  validate_intellij:
    name: validate JetBrains release artifact
    needs: [guard]
    if: ${{ needs.guard.outputs.verified_reuse_run_id == '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Test and package JetBrains plugin
        run: |
          chmod +x gradlew
          ./gradlew check guardianReleaseGate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-intellij-${{ inputs.release_tag }}
          path: editors/intellij/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish verified release
    needs: [guard, validate_python, validate_vscode, validate_intellij]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (needs.guard.outputs.verified_reuse_run_id != '' || (needs.validate_python.result == 'success' && needs.validate_vscode.result == 'success' && needs.validate_intellij.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-python-${{ inputs.release_tag }}
          path: release-bundle/python
          run-id: ${{ needs.guard.outputs.verified_reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-vscode-${{ inputs.release_tag }}
          path: release-bundle/editors
          run-id: ${{ needs.guard.outputs.verified_reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-intellij-${{ inputs.release_tag }}
          path: release-bundle/editors
          run-id: ${{ needs.guard.outputs.verified_reuse_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Code Factory preflight runtime
        env:
          VERIFIED_REUSE_RUN_ID: ${{ needs.guard.outputs.verified_reuse_run_id }}
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "$VERIFIED_REUSE_RUN_ID" ]]; then
            [[ "$TOOLING_SHA" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$TOOLING_SHA" origin/main
            mkdir "$RUNNER_TEMP/release-tooling"
            git archive "$TOOLING_SHA" | tar -x -C "$RUNNER_TEMP/release-tooling"
            python -m pip install --force-reinstall "$RUNNER_TEMP/release-tooling"
          else
            python -m pip install .
          fi

      - name: Bind recovered artifact bytes and installed tooling before preflight
        if: ${{ needs.guard.outputs.verified_reuse_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RECEIPT: ${{ needs.guard.outputs.reuse_receipt }}
          TOOLING_SHA: ${{ github.sha }}
          CANDIDATE_COMMIT: ${{ needs.guard.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path
          import factoryline.codex_metadata as metadata
          receipt = json.loads(os.environ["REUSE_RECEIPT"])
          sealed = receipt.pop("receipt_sha256")
          if hashlib.sha256(json.dumps(receipt, sort_keys=True, separators=(",", ":")).encode()).hexdigest() != sealed or receipt["source_commit"] != os.environ["CANDIDATE_COMMIT"] or receipt["repository"] != os.environ["GITHUB_REPOSITORY"]:
              raise SystemExit("Validation reuse receipt binding mismatch")
          expected_files, expanded_bytes = set(), 0
          for artifact in receipt["artifacts"]:
              endpoint = f"repos/{receipt['repository']}/actions/artifacts/{artifact['id']}"
              live = json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))
              if live.get("expired") is not False or any(live.get(key) != artifact[key] for key in ("id", "name", "digest", "size_in_bytes", "created_at", "expires_at")):
                  raise SystemExit("Validated artifact identity changed before download")
              archive = Path(os.environ["RUNNER_TEMP"]) / f"validated-{artifact['id']}.zip"
              with archive.open("wb") as output:
                  subprocess.run(["gh", "api", endpoint + "/zip"], stdout=output, check=True)
              digest = hashlib.sha256()
              with archive.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              if "sha256:" + digest.hexdigest() != artifact["digest"] or archive.stat().st_size > 512 * 1024 * 1024:
                  raise SystemExit("Validated artifact archive digest mismatch")
              destination = Path("release-bundle/python" if artifact["channel"] == "python" else "release-bundle/editors").resolve()
              with zipfile.ZipFile(archive) as bundle:
                  entries = bundle.infolist()
                  expanded_bytes += sum(entry.file_size for entry in entries)
                  if len(entries) > 256 or expanded_bytes > 128 * 1024 * 1024:
                      raise SystemExit("Recovery artifact expanded-content bound exceeded")
                  for entry in entries:
                      relative = Path(entry.filename)
                      target = (destination / relative).resolve()
                      if relative.is_absolute() or ".." in relative.parts or "\\" in entry.filename or ":" in entry.filename or not target.is_relative_to(destination) or (entry.external_attr >> 16) & 0o170000 == 0o120000:
                          raise SystemExit("Unsafe recovered artifact member")
                      if entry.is_dir():
                          continue
                      if target in expected_files or not target.is_file() or target.is_symlink():
                          raise SystemExit("Missing or duplicated recovered artifact member")
                      expected_files.add(target)
                      digests = []
                      for stream in (bundle.open(entry), target.open("rb")):
                          with stream:
                              digest = hashlib.sha256()
                              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                                  digest.update(chunk)
                              digests.append(digest.hexdigest())
                      if digests[0] != digests[1]:
                          raise SystemExit("Downloaded artifact files differ from validated archive")
          actual_files = {path.resolve() for directory in ("python", "editors") for path in Path("release-bundle", directory).rglob("*") if path.is_file()}
          if actual_files != expected_files:
              raise SystemExit("Unaccounted recovered artifact file")
          installed = Path(metadata.__file__).resolve()
          tooling = Path(os.environ["RUNNER_TEMP"], "release-tooling", "factoryline", "codex_metadata.py")
          tooling_hash = hashlib.sha256(tooling.read_bytes()).hexdigest()
          if installed.is_relative_to(Path.cwd()) or hashlib.sha256(installed.read_bytes()).hexdigest() != tooling_hash:
              raise SystemExit("Preflight metadata checker is not the isolated pinned tooling")
          receipt.update({"receipt_sha256": sealed, "tooling_commit": os.environ["TOOLING_SHA"], "installed_metadata_sha256": tooling_hash, "archive_bytes_and_extracted_files_verified": True})
          Path("release-bundle/release-recovery.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
          print("Exact recovered artifact bytes and isolated pinned preflight tooling verified")
          PY

      - name: Prepare source-bound release contract
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVED_BY: ${{ github.actor }} (release workflow initiator; not independent approval)
        run: |
          set -euo pipefail
          source_args=()
          if [[ "$RELEASE_TAG" == "v0.48.2" || "$RELEASE_TAG" == "v0.49.5" ]]; then source_args=(--source CHANGELOG.md); fi
          python scripts/prepare_release_contract.py \
            --root . \
            --feature "release-${RELEASE_TAG}" \
            --out .factory/release-contracts/release.json \
            "${source_args[@]}" \
            --approved-by "$APPROVED_BY"

      - name: Require sealed release candidate preflight before external publication
        env:
          RELEASE_CONTRACT_PATH: .factory/release-contracts/release.json
          RELEASE_TAG: ${{ inputs.release_tag }}
          CORE_0481_EXCEPTION: ${{ inputs.core_0481_cadence_exception }}
          CORE_0482_EXCEPTION: ${{ inputs.core_0482_cadence_exception }}
          CORE_0495_EXCEPTION: ${{ inputs.core_0495_cadence_exception }}
          VERIFIED_REUSE_RUN_ID: ${{ needs.guard.outputs.verified_reuse_run_id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONTRACT_PATH" || {
            echo "RELEASE_CONTRACT_PATH must point to the approved, source-bound contract in the protected release environment." >&2
            exit 1
          }
          test -f "$RELEASE_CONTRACT_PATH" || {
            echo "The configured release contract is not present in the checked-out candidate." >&2
            exit 1
          }
          exception_args=()
          if [[ "$CORE_0481_EXCEPTION" == "true" || "$CORE_0482_EXCEPTION" == "true" || "$CORE_0495_EXCEPTION" == "true" ]]; then
            python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          current = os.environ["CORE_0482_EXCEPTION"] == "true"
          latest = os.environ["CORE_0495_EXCEPTION"] == "true"
          version = "0.49.5" if latest else "0.48.2" if current else "0.48.1"
          tag = f"v{version}"
          assert os.environ["RELEASE_TAG"] == tag and os.environ["GITHUB_ACTOR"] == "zrk222"
          contract = json.loads(Path(os.environ["RELEASE_CONTRACT_PATH"]).read_text())
          now = datetime.now(timezone.utc)
          value = {
              "schema": "factory.release-cadence-exception.v1", "channel": "core", "version": version,
              "candidate_tag": tag, "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "requesting_actor": contract["approved_by"], "environment": "pypi", "environment_authorized": True,
              "publish_enabled": True, "workflow_run_id": os.environ["GITHUB_RUN_ID"], "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "issued_at": now.isoformat(), "expires_at": (now + timedelta(hours=1)).isoformat(),
              "reason": f"Owner explicitly approved one-time core {version} cadence exception; normal gates retained."
          }
          if current or latest:
              value["monthly_cap_exception"] = True
              value["one_time_version_opt_in"] = version
          name = "core-" + version.replace(".", "")
          Path(f".factory/{name}-cadence-exception.json").write_text(json.dumps(value))
          PY
            if [[ "$CORE_0495_EXCEPTION" == "true" ]]; then
              exception_args=(--cadence-exception .factory/core-0495-cadence-exception.json)
            elif [[ "$CORE_0482_EXCEPTION" == "true" ]]; then
              exception_args=(--cadence-exception .factory/core-0482-cadence-exception.json)
            else
              exception_args=(--cadence-exception .factory/core-0481-cadence-exception.json)
            fi
          fi
          preflight_args=( \
            --root . \
            --candidate-tag "$RELEASE_TAG" \
            --contract "$RELEASE_CONTRACT_PATH" \
            --artifact-dir release-bundle/python \
            --artifact-dir release-bundle/editors \
            --metadata-path context/PROGRESS.md \
            "${exception_args[@]}" \
            --out release-bundle/release-preflight.json \
            --json )
          if [[ -n "$VERIFIED_REUSE_RUN_ID" ]]; then
            python -I -m factoryline.cli release preflight "${preflight_args[@]}"
          else
            python -m factoryline.cli release preflight "${preflight_args[@]}"
          fi

      - name: Retain recovered publication provenance
        if: ${{ needs.guard.outputs.verified_reuse_run_id != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-recovery-${{ github.run_id }}
          path: |
            release-bundle/release-recovery.json
            release-bundle/release-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ needs.guard.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$EXPECTED_COMMIT" ]] || {
            echo "Release tag moved after candidate validation." >&2
            exit 1
          }
          gh release upload "$RELEASE_TAG" release-bundle/python/* release-bundle/editors/* docs/assets/factoryline-logo-480.png docs/assets/marketplace/factoryline-0.44-live-dashboard.png docs/assets/marketplace/factoryline-jetbrains-0.44-all-controls.jpg docs/assets/marketplace/factoryline-jetbrains-0.44-in-action.jpg docs/assets/marketplace/factoryline-60-day-personal-case-study.png docs/assets/marketplace/code-factory-60-day-personal-case-study.png docs/assets/marketplace/factory-studio-mvp-1280x800.png docs/assets/marketplace/graph-ops-studio-1280x800.png docs/assets/marketplace/graph-ops-proofsearch.png docs/assets/marketplace/graph-ops-proofsearch-controls.png docs/assets/marketplace/graph-ops-evidence-frontier.png docs/assets/*.svg docs/assets/verify-policy.gif --clobber

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release-bundle/python/
          attestations: true

      - name: Publish the GitHub release after protected publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ needs.guard.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$EXPECTED_COMMIT" ]] || {
            echo "Release tag moved after candidate validation." >&2
            exit 1
          }
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  publish_mcp_registry:
    name: publish Official MCP Registry metadata
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - name: Validate release tag and MCP Registry metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def reject(message: str) -> None:
              print("MCP_REGISTRY_METADATA_REJECTED")
              raise SystemExit(message)

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              reject(f"invalid release tag: {tag}")
          version = tag[1:]
          descriptor = json.loads(Path("mcp/server.json").read_text(encoding="utf-8"))
          project = Path("pyproject.toml").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          package = descriptor["packages"][0]

          expected_name = "io.github.zrk222/code-factory"
          marker = f"<!-- mcp-name: {expected_name} -->"
          if descriptor["name"] != expected_name or descriptor["version"] != version:
              reject("registry descriptor name or version does not match release tag")
          if len(descriptor.get("description", "")) > 100:
              reject("registry description exceeds 100 characters")
          if package["identifier"] != "factoryline-code-factory" or package["version"] != version:
              reject("registry package does not match release tag")
          if package["transport"] != {"type": "stdio"}:
              reject("registry package must use stdio transport only")
          if package.get("environmentVariables"):
              reject("registry package must not declare environment variables")
          if package.get("runtimeHint") != "uvx" or package.get("runtimeArguments") != [
              {"type": "named", "name": "--from", "value": f"factoryline-code-factory=={version}"}
          ]:
              reject("registry uvx launch does not match release package")
          if [item.get("value") for item in package.get("packageArguments", [])] != ["factory", "mcp", "serve"]:
              reject("registry package arguments must invoke factory mcp serve")
          if f'version = "{version}"' not in project or marker not in readme:
              reject("release package metadata or MCP ownership marker is missing")
          print("MCP_REGISTRY_RELEASE_METADATA_VALID")
          PY

      - name: Wait for PyPI package and ownership marker
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 20); do
            if python - "$version" <<'PY'
          import json
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          version = sys.argv[1]
          url = f"https://pypi.org/pypi/factoryline-code-factory/{version}/json"
          try:
              with urlopen(url, timeout=15) as response:
                  payload = json.load(response)
          except (HTTPError, URLError, TimeoutError) as error:
              print(f"PyPI version not visible yet: {error}")
              raise SystemExit(1)
          marker = "<!-- mcp-name: io.github.zrk222/code-factory -->"
          if payload["info"]["version"] != version or marker not in payload["info"].get("description", ""):
              print("PyPI version or MCP ownership marker is not visible yet")
              raise SystemExit(1)
          print("PYPI_MCP_OWNERSHIP_MARKER_VERIFIED")
          PY
            then
              exit 0
            fi
            sleep 15
          done
          echo "matching PyPI package and MCP ownership marker did not become visible within five minutes" >&2
          exit 1

      - name: Install and validate pinned MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors --output mcp-publisher_linux_amd64.tar.gz "$base/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --output checksums.txt "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep -E ' [*]?mcp-publisher_linux_amd64.tar.gz$' checksums.txt | sha256sum --check --strict --status -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher validate mcp/server.json

      - name: Authenticate MCP Registry publisher through GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Registry descriptor
        run: ./mcp-publisher publish mcp/server.json

name: publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag to validate and publish after review
        required: true
        type: string
      core_0481_cadence_exception:
        description: Explicit owner-approved one-time cooldown exception for v0.48.1 only
        required: false
        default: false
        type: boolean
      core_0482_cadence_exception:
        description: Explicit owner-approved one-time cadence and monthly-cap exception for v0.48.2 only
        required: false
        default: false
        type: boolean
      core_0490_publication_exception:
        description: Explicit owner-approved one-time publication exception for v0.49.0 only
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  attestations: read

concurrency:
  group: publish-release-train
  cancel-in-progress: false

jobs:
  guard:
    name: require a draft release tag
    if: ${{ inputs.core_0490_publication_exception != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub requires write access to read unpublished drafts.
      actions: read
      attestations: read
    outputs:
      candidate_commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - name: Verify the requested release exists and remains a draft
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Dispatch publication from protected main so the reviewed workflow definition is used." >&2
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "RELEASE_TAG must use vMAJOR.MINOR.PATCH." >&2
            exit 1
          }
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
          [[ "$is_draft" == "true" ]] || {
            echo "The requested GitHub release must exist and remain a draft until protected publication." >&2
            exit 1
          }
          candidate_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$candidate_commit" origin/main || {
            echo "The candidate must already be merged into protected main." >&2
            exit 1
          }
          echo "commit=$candidate_commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Require attested clean-runner evidence for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m factoryline.signed_receipts fetch-ci "${{ steps.candidate.outputs.commit }}" "$RUNNER_TEMP/ci-release-evidence"
      - name: Enforce cadence using actual GitHub publication timestamps
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CORE_0481_EXCEPTION: ${{ inputs.core_0481_cadence_exception }}
          CORE_0482_EXCEPTION: ${{ inputs.core_0482_cadence_exception }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/release-history.json"
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          policy = json.loads(Path("release-train.json").read_text())["cadence"]
          parse = lambda value: datetime.fromisoformat(value.replace("Z", "+00:00"))
          effective = parse(policy["effective_at"])
          now = datetime.now(timezone.utc)
          pages = json.loads((Path(os.environ["RUNNER_TEMP"]) / "release-history.json").read_text())
          published = [parse(item["published_at"]) for page in pages for item in page if not item["draft"]]
          active = sorted(stamp for stamp in published if stamp >= effective)
          recent = [stamp for stamp in active if stamp > now - timedelta(days=30)]
          exception = os.environ.get("CORE_0481_EXCEPTION") == "true"
          current_exception = os.environ.get("CORE_0482_EXCEPTION") == "true"
          if exception and (os.environ.get("RELEASE_TAG") != "v0.48.1" or os.environ.get("GITHUB_ACTOR") != "zrk222"):
              raise SystemExit("One-time core exception requires owner dispatch of v0.48.1")
          if current_exception and (os.environ.get("RELEASE_TAG") != "v0.48.2" or os.environ.get("GITHUB_ACTOR") != "zrk222"):
              raise SystemExit("One-time core exception requires owner dispatch of v0.48.2")
          if len(recent) >= policy["max_releases_30d"] and not current_exception:
              raise SystemExit("Actual published release count exceeds admission policy")
          if active and now < active[-1] + timedelta(days=policy["minimum_days_between_releases"]) and not (exception or current_exception):
              raise SystemExit("Actual published release is still within the cooldown")
          print("Published-release cadence admitted; tag timestamps do not authorize publication")
          PY

  validate_python:
    name: validate Python release artifacts
    if: ${{ inputs.core_0490_publication_exception != true }}
    needs: [guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release test and build tools
        run: |
          python -m pip install --upgrade build twine
          python -m pip install -e ".[dev,enterprise,hosted]"

      - name: Test
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Clean wheel smoke
        run: |
          python -m venv /tmp/factory-wheel
          /tmp/factory-wheel/bin/python -m pip install dist/*.whl
          /tmp/factory-wheel/bin/factory --help
          if /tmp/factory-wheel/bin/factory trace empty --root /tmp/empty; then
            echo "empty trace unexpectedly verified" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-python-${{ inputs.release_tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  validate_vscode:
    name: validate VS Code release artifact
    if: ${{ inputs.core_0490_publication_exception != true }}
    needs: [guard]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Pin the audited npm client
        run: npm install --global npm@10.9.4

      - name: Test and package VS Code extension
        run: |
          npm ci --no-audit
          npm run audit
          npm test
          version="$(node -p "require('./package.json').version")"
          npx vsce package --no-dependencies --out "factoryline-vscode-${version}.vsix"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-vscode-${{ inputs.release_tag }}
          path: editors/vscode/factoryline-vscode-*.vsix
          if-no-files-found: error
          retention-days: 30

  validate_intellij:
    name: validate JetBrains release artifact
    if: ${{ inputs.core_0490_publication_exception != true }}
    needs: [guard]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Test and package JetBrains plugin
        run: |
          chmod +x gradlew
          ./gradlew check guardianReleaseGate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-intellij-${{ inputs.release_tag }}
          path: editors/intellij/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish verified release
    if: ${{ inputs.core_0490_publication_exception != true }}
    needs: [guard, validate_python, validate_vscode, validate_intellij]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-python-${{ inputs.release_tag }}
          path: release-bundle/python

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-vscode-${{ inputs.release_tag }}
          path: release-bundle/editors

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-intellij-${{ inputs.release_tag }}
          path: release-bundle/editors

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install Code Factory preflight runtime
        run: python -m pip install .

      - name: Prepare source-bound release contract
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVED_BY: ${{ github.actor }} (release workflow initiator; not independent approval)
        run: |
          set -euo pipefail
          source_args=()
          if [[ "$RELEASE_TAG" == "v0.48.2" ]]; then source_args=(--source CHANGELOG.md); fi
          python scripts/prepare_release_contract.py \
            --root . \
            --feature "release-${RELEASE_TAG}" \
            --out .factory/release-contracts/release.json \
            "${source_args[@]}" \
            --approved-by "$APPROVED_BY"

      - name: Require sealed release candidate preflight before external publication
        env:
          RELEASE_CONTRACT_PATH: .factory/release-contracts/release.json
          RELEASE_TAG: ${{ inputs.release_tag }}
          CORE_0481_EXCEPTION: ${{ inputs.core_0481_cadence_exception }}
          CORE_0482_EXCEPTION: ${{ inputs.core_0482_cadence_exception }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONTRACT_PATH" || {
            echo "RELEASE_CONTRACT_PATH must point to the approved, source-bound contract in the protected release environment." >&2
            exit 1
          }
          test -f "$RELEASE_CONTRACT_PATH" || {
            echo "The configured release contract is not present in the checked-out candidate." >&2
            exit 1
          }
          exception_args=()
          if [[ "$CORE_0481_EXCEPTION" == "true" || "$CORE_0482_EXCEPTION" == "true" ]]; then
            python - <<'PY'
          import json, os, subprocess
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          current = os.environ["CORE_0482_EXCEPTION"] == "true"
          version = "0.48.2" if current else "0.48.1"
          tag = f"v{version}"
          assert os.environ["RELEASE_TAG"] == tag and os.environ["GITHUB_ACTOR"] == "zrk222"
          contract = json.loads(Path(os.environ["RELEASE_CONTRACT_PATH"]).read_text())
          now = datetime.now(timezone.utc)
          value = {
              "schema": "factory.release-cadence-exception.v1", "channel": "core", "version": version,
              "candidate_tag": tag, "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "requesting_actor": contract["approved_by"], "environment": "pypi", "environment_authorized": True,
              "publish_enabled": True, "workflow_run_id": os.environ["GITHUB_RUN_ID"], "workflow_run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "issued_at": now.isoformat(), "expires_at": (now + timedelta(hours=1)).isoformat(),
              "reason": f"Owner explicitly approved one-time core {version} cadence exception; normal gates retained."
          }
          if current:
              value["monthly_cap_exception"] = True
              value["one_time_version_opt_in"] = version
          name = "core-0482" if current else "core-0481"
          Path(f".factory/{name}-cadence-exception.json").write_text(json.dumps(value))
          PY
            if [[ "$CORE_0482_EXCEPTION" == "true" ]]; then
              exception_args=(--cadence-exception .factory/core-0482-cadence-exception.json)
            else
              exception_args=(--cadence-exception .factory/core-0481-cadence-exception.json)
            fi
          fi
          python -m factoryline.cli release preflight \
            --root . \
            --candidate-tag "$RELEASE_TAG" \
            --contract "$RELEASE_CONTRACT_PATH" \
            --artifact-dir release-bundle/python \
            --artifact-dir release-bundle/editors \
            --metadata-path context/PROGRESS.md \
            "${exception_args[@]}" \
            --out release-bundle/release-preflight.json \
            --json

      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ needs.guard.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$EXPECTED_COMMIT" ]] || {
            echo "Release tag moved after candidate validation." >&2
            exit 1
          }
          gh release upload "$RELEASE_TAG" release-bundle/python/* release-bundle/editors/* docs/assets/factoryline-logo-480.png docs/assets/marketplace/factoryline-0.44-live-dashboard.png docs/assets/marketplace/factoryline-jetbrains-0.44-all-controls.jpg docs/assets/marketplace/factoryline-jetbrains-0.44-in-action.jpg docs/assets/marketplace/factoryline-60-day-personal-case-study.png docs/assets/marketplace/code-factory-60-day-personal-case-study.png docs/assets/marketplace/factory-studio-mvp-1280x800.png docs/assets/marketplace/graph-ops-studio-1280x800.png docs/assets/marketplace/graph-ops-proofsearch.png docs/assets/marketplace/graph-ops-proofsearch-controls.png docs/assets/marketplace/graph-ops-evidence-frontier.png docs/assets/*.svg docs/assets/verify-policy.gif --clobber

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release-bundle/python/
          attestations: true

      - name: Publish the GitHub release after protected publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ needs.guard.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$EXPECTED_COMMIT" ]] || {
            echo "Release tag moved after candidate validation." >&2
            exit 1
          }
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  publish_mcp_registry:
    name: publish Official MCP Registry metadata
    if: ${{ inputs.core_0490_publication_exception != true }}
    needs: [guard, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.guard.outputs.candidate_commit }}
          fetch-depth: 0

      - name: Validate release tag and MCP Registry metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          def reject(message: str) -> None:
              print("MCP_REGISTRY_METADATA_REJECTED")
              raise SystemExit(message)

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              reject(f"invalid release tag: {tag}")
          version = tag[1:]
          descriptor = json.loads(Path("mcp/server.json").read_text(encoding="utf-8"))
          project = Path("pyproject.toml").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          package = descriptor["packages"][0]

          expected_name = "io.github.zrk222/code-factory"
          marker = f"<!-- mcp-name: {expected_name} -->"
          if descriptor["name"] != expected_name or descriptor["version"] != version:
              reject("registry descriptor name or version does not match release tag")
          if len(descriptor.get("description", "")) > 100:
              reject("registry description exceeds 100 characters")
          if package["identifier"] != "factoryline-code-factory" or package["version"] != version:
              reject("registry package does not match release tag")
          if package["transport"] != {"type": "stdio"}:
              reject("registry package must use stdio transport only")
          if package.get("environmentVariables"):
              reject("registry package must not declare environment variables")
          if package.get("runtimeHint") != "uvx" or package.get("runtimeArguments") != [
              {"type": "named", "name": "--from", "value": f"factoryline-code-factory=={version}"}
          ]:
              reject("registry uvx launch does not match release package")
          if [item.get("value") for item in package.get("packageArguments", [])] != ["factory", "mcp", "serve"]:
              reject("registry package arguments must invoke factory mcp serve")
          if f'version = "{version}"' not in project or marker not in readme:
              reject("release package metadata or MCP ownership marker is missing")
          print("MCP_REGISTRY_RELEASE_METADATA_VALID")
          PY

      - name: Wait for PyPI package and ownership marker
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 20); do
            if python - "$version" <<'PY'
          import json
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.request import urlopen

          version = sys.argv[1]
          url = f"https://pypi.org/pypi/factoryline-code-factory/{version}/json"
          try:
              with urlopen(url, timeout=15) as response:
                  payload = json.load(response)
          except (HTTPError, URLError, TimeoutError) as error:
              print(f"PyPI version not visible yet: {error}")
              raise SystemExit(1)
          marker = "<!-- mcp-name: io.github.zrk222/code-factory -->"
          if payload["info"]["version"] != version or marker not in payload["info"].get("description", ""):
              print("PyPI version or MCP ownership marker is not visible yet")
              raise SystemExit(1)
          print("PYPI_MCP_OWNERSHIP_MARKER_VERIFIED")
          PY
            then
              exit 0
            fi
            sleep 15
          done
          echo "matching PyPI package and MCP ownership marker did not become visible within five minutes" >&2
          exit 1

      - name: Install and validate pinned MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl --fail --location --retry 5 --retry-all-errors --output mcp-publisher_linux_amd64.tar.gz "$base/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors --output checksums.txt "$base/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep -E ' [*]?mcp-publisher_linux_amd64.tar.gz$' checksums.txt | sha256sum --check --strict --status -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher validate mcp/server.json

      - name: Authenticate MCP Registry publisher through GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish MCP Registry descriptor
        run: ./mcp-publisher publish mcp/server.json

  publish_owner_0490_exception:
    name: publish owner-approved v0.49.0 exception
    if: ${{ inputs.core_0490_publication_exception == true && github.actor == 'zrk222' && inputs.release_tag == 'v0.49.0' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 818c1068bcc5b0773739179d44b60b87d1f598d5
          fetch-depth: 0

      - name: Verify the owner, release tag, source commit, and draft assets
        id: verify_candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          EXPECTED_SOURCE_COMMIT = "818c1068bcc5b0773739179d44b60b87d1f598d5"
          EXPECTED_WHEEL = "factoryline_code_factory-0.49.0-py3-none-any.whl"
          EXPECTED_SDIST = "factoryline_code_factory-0.49.0.tar.gz"
          EXPECTED_WHEEL_SHA256 = "30ca2a506e662d074fae66aac57823b5be6a5370274af74ec10c857ad42e217f"
          EXPECTED_SDIST_SHA256 = "d649cf9d5ccf8d07a98d8ed9b12c60346469857b8a51caf5b2cd388d1098f782"

          def validate_exception_dispatch(actor, release_tag):
              if actor != "zrk222":
                  raise SystemExit("The v0.49.0 exception is restricted to owner zrk222")
              if release_tag != "v0.49.0":
                  raise SystemExit("The v0.49.0 exception is restricted to tag v0.49.0")

          def validate_exception_binding(
              checkout_commit, tag_commit, wheel_sha256, sdist_sha256
          ):
              actual = {
                  "checkout commit": checkout_commit,
                  "release tag commit": tag_commit,
                  EXPECTED_WHEEL: wheel_sha256,
                  EXPECTED_SDIST: sdist_sha256,
              }
              expected = {
                  "checkout commit": EXPECTED_SOURCE_COMMIT,
                  "release tag commit": EXPECTED_SOURCE_COMMIT,
                  EXPECTED_WHEEL: EXPECTED_WHEEL_SHA256,
                  EXPECTED_SDIST: EXPECTED_SDIST_SHA256,
              }
              for name, value in actual.items():
                  if value != expected[name]:
                      raise SystemExit(f"Owner exception binding mismatch: {name}")
              return {
                  "source_commit": EXPECTED_SOURCE_COMMIT,
                  "assets": {
                      EXPECTED_WHEEL: EXPECTED_WHEEL_SHA256,
                      EXPECTED_SDIST: EXPECTED_SDIST_SHA256,
                  },
              }

          def git_text(*args):
              return subprocess.check_output(["git", *args], text=True).strip()

          def main():
              release_tag = os.environ["RELEASE_TAG"]
              validate_exception_dispatch(os.environ["GITHUB_ACTOR"], release_tag)
              subprocess.run(
                  [
                      "git",
                      "fetch",
                      "--no-tags",
                      "origin",
                      f"refs/tags/{release_tag}:refs/tags/{release_tag}",
                  ],
                  check=True,
              )
              checkout_commit = git_text("rev-parse", "HEAD")
              tag_commit = git_text("rev-parse", f"refs/tags/{release_tag}^{{commit}}")
              release = json.loads(
                  subprocess.check_output(
                      [
                          "gh",
                          "release",
                          "view",
                          release_tag,
                          "--repo",
                          os.environ["GITHUB_REPOSITORY"],
                          "--json",
                          "isDraft",
                      ],
                      text=True,
                  )
              )
              if release.get("isDraft") is not True:
                  raise SystemExit(
                      "The owner exception requires the existing GitHub release to remain a draft"
                  )

              asset_dir = Path("owner-0490-assets")
              asset_dir.mkdir(parents=True, exist_ok=True)
              subprocess.run(
                  [
                      "gh",
                      "release",
                      "download",
                      release_tag,
                      "--repo",
                      os.environ["GITHUB_REPOSITORY"],
                      "--pattern",
                      EXPECTED_WHEEL,
                      "--pattern",
                      EXPECTED_SDIST,
                      "--dir",
                      str(asset_dir),
                  ],
                  check=True,
              )
              downloaded = {
                  path.name for path in asset_dir.iterdir() if path.is_file()
              }
              if downloaded != {EXPECTED_WHEEL, EXPECTED_SDIST}:
                  raise SystemExit(
                      "Draft release did not return exactly the two pinned Python assets"
                  )
              binding = validate_exception_binding(
                  checkout_commit,
                  tag_commit,
                  hashlib.sha256((asset_dir / EXPECTED_WHEEL).read_bytes()).hexdigest(),
                  hashlib.sha256((asset_dir / EXPECTED_SDIST).read_bytes()).hexdigest(),
              )
              evidence_dir = Path(os.environ["RUNNER_TEMP"]) / "owner-0490-evidence"
              evidence_dir.mkdir(parents=True, exist_ok=True)
              (evidence_dir / "candidate-binding.json").write_text(
                  json.dumps(binding, indent=2, sort_keys=True) + "\n", encoding="utf-8"
              )
              print("OWNER_0490_CANDIDATE_AND_ASSETS_VERIFIED")

          if __name__ == "__main__":
              main()
          PY

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Check the pinned distributions
        id: twine_check
        run: |
          python -m pip install --upgrade twine
          python -m twine check \
            "owner-0490-assets/factoryline_code_factory-0.49.0-py3-none-any.whl" \
            "owner-0490-assets/factoryline_code_factory-0.49.0.tar.gz"

      - name: Smoke install the pinned wheel
        id: wheel_smoke
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/factory-0490"
          "$RUNNER_TEMP/factory-0490/bin/python" -m pip install \
            "owner-0490-assets/factoryline_code_factory-0.49.0-py3-none-any.whl"
          "$RUNNER_TEMP/factory-0490/bin/factory" --help
          "$RUNNER_TEMP/factory-0490/bin/factory" --version --json > "$RUNNER_TEMP/factory-0490-version.json"
          "$RUNNER_TEMP/factory-0490/bin/python" - "$RUNNER_TEMP/factory-0490-version.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          if json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["version"] != "0.49.0":
              raise SystemExit("The installed wheel did not report factory version 0.49.0")
          PY

      - name: Publish the pinned distributions to PyPI
        id: publish_pypi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: owner-0490-assets/
          attestations: true

      - name: Publish the pinned GitHub release
        id: publish_github_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [[ "$(git rev-parse HEAD)" == "818c1068bcc5b0773739179d44b60b87d1f598d5" ]]
          [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" == "818c1068bcc5b0773739179d44b60b87d1f598d5" ]]
          [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" == "true" ]]
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Record the bounded exception and unmet checks
        if: ${{ always() }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERIFY_OUTCOME: ${{ steps.verify_candidate.outcome || 'not_run' }}
          TWINE_OUTCOME: ${{ steps.twine_check.outcome || 'not_run' }}
          WHEEL_SMOKE_OUTCOME: ${{ steps.wheel_smoke.outcome || 'not_run' }}
          PYPI_OUTCOME: ${{ steps.publish_pypi.outcome || 'not_run' }}
          GITHUB_RELEASE_OUTCOME: ${{ steps.publish_github_release.outcome || 'not_run' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          try:
              commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          except (OSError, subprocess.CalledProcessError):
              commit = None
          receipt = {
              "schema": "factory.owner-publication-exception.v1",
              "exception_scope": {
                  "workflow_job": "publish_owner_0490_exception",
                  "opt_in_input": "core_0490_publication_exception",
                  "actor": os.environ.get("GITHUB_ACTOR"),
                  "release_tag": os.environ.get("RELEASE_TAG"),
                  "required_source_commit": "818c1068bcc5b0773739179d44b60b87d1f598d5",
                  "observed_checkout_commit": commit,
                  "pypi_environment": "pypi",
                  "pypi_authentication": "GitHub OIDC trusted publishing",
              },
              "pinned_assets": {
                  "factoryline_code_factory-0.49.0-py3-none-any.whl": "30ca2a506e662d074fae66aac57823b5be6a5370274af74ec10c857ad42e217f",
                  "factoryline_code_factory-0.49.0.tar.gz": "d649cf9d5ccf8d07a98d8ed9b12c60346469857b8a51caf5b2cd388d1098f782",
              },
              "unmet_or_waived_checks": [
                  {"check": "attested clean-runner CI evidence", "state": "WAIVED_NOT_RUN"},
                  {"check": "release cadence and monthly-cap policy", "state": "WAIVED_NOT_RUN"},
                  {"check": "full Python test suite", "state": "NOT_RUN"},
                  {"check": "VS Code release validation", "state": "NOT_RUN"},
                  {"check": "JetBrains release validation", "state": "NOT_RUN"},
                  {"check": "normal sealed release preflight", "state": "NOT_RUN"},
              ],
              "bounded_check_outcomes": {
                  "candidate_source_and_asset_hashes": os.environ.get("VERIFY_OUTCOME", "not_run"),
                  "twine_check": os.environ.get("TWINE_OUTCOME", "not_run"),
                  "clean_wheel_help_and_version_smoke": os.environ.get("WHEEL_SMOKE_OUTCOME", "not_run"),
                  "pypi_publication": os.environ.get("PYPI_OUTCOME", "not_run"),
                  "github_release_publication": os.environ.get("GITHUB_RELEASE_OUTCOME", "not_run"),
              },
              "run": {
                  "repository": os.environ.get("GITHUB_REPOSITORY"),
                  "run_id": os.environ.get("GITHUB_RUN_ID"),
                  "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                  "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF"),
              },
              "claim_boundary": "Exception-scoped package and GitHub release publication only; unmet checks are not passes and this receipt is not a full CI or security approval.",
          }
          path = Path("owner-0490-exception-receipt.json")
          path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() }}
        with:
          name: owner-0490-publication-exception-receipt
          path: owner-0490-exception-receipt.json
          if-no-files-found: warn
          retention-days: 90

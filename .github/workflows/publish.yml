name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate_python:
    name: validate Python release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release test and build tools
        run: |
          python -m pip install --upgrade build twine
          python -m pip install -e ".[dev,enterprise,hosted]"

      - name: Test
        run: python -m pytest -q

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Clean wheel smoke
        run: |
          python -m venv /tmp/factory-wheel
          /tmp/factory-wheel/bin/python -m pip install dist/*.whl
          /tmp/factory-wheel/bin/factory --help
          if /tmp/factory-wheel/bin/factory trace empty --root /tmp/empty; then
            echo "empty trace unexpectedly verified" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-python-${{ github.event.release.tag_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  validate_vscode:
    name: validate VS Code release artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Test and package VS Code extension
        run: |
          npm ci
          npm run audit
          npm test
          npx vsce package --no-dependencies --out factoryline-vscode-${{ github.event.release.tag_name }}.vsix

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-vscode-${{ github.event.release.tag_name }}
          path: editors/vscode/factoryline-vscode-${{ github.event.release.tag_name }}.vsix
          if-no-files-found: error
          retention-days: 30

  validate_intellij:
    name: validate JetBrains release artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/intellij
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6.2.0

      - name: Test and package JetBrains plugin
        run: |
          chmod +x gradlew
          ./gradlew check buildPlugin verifyPlugin marketplacePreflight

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-intellij-${{ github.event.release.tag_name }}
          path: editors/intellij/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish verified release
    needs: [validate_python, validate_vscode, validate_intellij]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-python-${{ github.event.release.tag_name }}
          path: release-bundle/python

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-vscode-${{ github.event.release.tag_name }}
          path: release-bundle/editors

      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-intellij-${{ github.event.release.tag_name }}
          path: release-bundle/editors

      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          release-bundle/python/*
          release-bundle/editors/*
          docs/assets/factoryline-logo-480.png
          docs/assets/marketplace/factory-studio-mvp-1280x800.png
          docs/assets/marketplace/graph-ops-studio-1280x800.png
          docs/assets/*.svg
          docs/assets/verify-policy.gif
          --clobber

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-bundle/python/
          attestations: true

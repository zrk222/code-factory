name: Architecture health guard

on:
  pull_request:
    paths:
      - "architecture-policy.json"
      - "architecture-boundaries.json"
      - "factoryline/**/*.py"
      - "**.md"
      - "evidence/self-audit/**"
      - ".github/workflows/architecture-health.yml"
  push:
    branches: [main]
    paths:
      - "architecture-policy.json"
      - "architecture-boundaries.json"
      - "factoryline/**/*.py"
      - "**.md"
      - "evidence/self-audit/**"
      - ".github/workflows/architecture-health.yml"

permissions:
  contents: read

jobs:
  architecture-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Code Factory runtime dependencies
        run: python -m pip install -e .
      - name: Install pinned ForgeLine reassessment runtime
        run: python -m pip install code-factory-2-forge==0.10.8
      - name: Enforce architecture budgets
        run: python -m factoryline.cli architecture health --root . --json
      - name: Detect historical evidence rewrites and release-review conflicts
        env:
          REVIEW_BASE: ${{ github.event.pull_request.base.sha || 'HEAD^' }}
        run: python -m factoryline.cli audit governance --root . --base "$REVIEW_BASE" --json
      - name: Diagnose reassessment mismatch without changing the receipt
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from factoryline.release_integrity import _canonical_json, _source_snapshot_digest, _valid_quality_reassessment
          root = Path.cwd().resolve()
          saved = json.loads((root / 'evidence/self-audit/quality-reassessment-2026-09-28.json').read_text(encoding='utf-8'))
          version = subprocess.run(['forge', '--version', '--json'], capture_output=True, text=True, timeout=20)
          rerun = subprocess.run(['forge', 'qa', '--repo-wide', '--root', str(root), '--strict'], capture_output=True, text=True, timeout=240)
          try:
              measured = json.loads(rerun.stdout)
          except json.JSONDecodeError:
              measured = None
          actual_digest = _source_snapshot_digest(root, saved['report']['metrics']['scope']['code_files'])
          before = {item['unit']: item for item in saved['report'].get('attribution', {}).get('units', [])}
          after = {item['unit']: item for item in measured.get('attribution', {}).get('units', [])} if measured else {}
          print(json.dumps({
              'source_digest_matches': actual_digest == saved['source_sha256'],
              'forge_version_exit': version.returncode,
              'forge_version': version.stdout.strip()[:500],
              'forge_exit': rerun.returncode,
              'forge_stderr_tail': rerun.stderr[-1000:],
              'forge_report_available': measured is not None,
              'forge_report_valid': _valid_quality_reassessment(measured),
              'forge_report_matches': measured is not None and _canonical_json(measured) == _canonical_json(saved['report']),
              'saved_metrics': {key: value for key, value in saved['report'].get('metrics', {}).items() if key != 'scope'},
              'measured_metrics': {key: value for key, value in measured.get('metrics', {}).items() if key != 'scope'} if measured else None,
              'saved_code_files': len(saved['report'].get('metrics', {}).get('scope', {}).get('code_files', [])),
              'measured_code_files': len(measured.get('metrics', {}).get('scope', {}).get('code_files', [])) if measured else None,
              'changed_units': [key for key in sorted(before.keys() | after.keys()) if before.get(key) != after.get(key)][:20],
              'saved_attribution': {key: value for key, value in saved['report'].get('attribution', {}).items() if key != 'units'},
              'measured_attribution': {key: value for key, value in measured.get('attribution', {}).items() if key != 'units'} if measured else None,
          }, default=str))
          PY

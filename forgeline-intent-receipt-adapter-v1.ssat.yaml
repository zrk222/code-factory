feature: forgeline-intent-receipt-adapter-v1
version: "1.0"
intent: "Bind explicit Forge ship intent evidence to a local Factoryline receipt without granting authority."
requirements:
  - id: REQ_INTENT_ADAPTER_CAPTURE
    description: "An explicit Forge ship result is stored with its intent hash, obligations, and Forge receipt SHA-256."
    invariant: "REQ_INTENT_ADAPTER_CAPTURE"
    checks:
      - "REQ_INTENT_ADAPTER_CAPTURE"
      - "factoryline.intent-trace.v1"
      - "_forge_intent_trace"
      - "forge_receipt_sha256"
      - "outputs[\"intent_trace\"]"
  - id: REQ_INTENT_ADAPTER_READ_ONLY
    description: "The adapter reads bounded local evidence and exposes no execution or provider authority."
    invariant: "REQ_INTENT_ADAPTER_READ_ONLY"
    checks:
      - "REQ_INTENT_ADAPTER_READ_ONLY"
      - "authority"
      - "execution"
      - "GRAPH_OPS_INTENT_ADAPTER_PREFERRED"
  - id: REQ_INTENT_ADAPTER_FAIL_CLOSED
    description: "Missing, malformed, or inconsistent explicit evidence is omitted or untraceable and never inferred from exit status."
    invariant: "REQ_INTENT_ADAPTER_FAIL_CLOSED"
    checks:
      - "REQ_INTENT_ADAPTER_FAIL_CLOSED"
      - "intent_traceable"
      - "return None"
      - "INTENT_TRACE_ADAPTER_INVALID"
  - id: REQ_INTENT_ADAPTER_PREFER
    description: "Graph Ops prefers the explicit adapter and suppresses legacy fallback for the same feature."
    invariant: "REQ_INTENT_ADAPTER_PREFER"
    checks:
      - "REQ_INTENT_ADAPTER_PREFER"
      - "adapter_features"
      - "source_type"
      - "preferred"
      - "GRAPH_OPS_INTENT_ADAPTER_FAIL_CLOSED"
gates:
  - type: test
    command: "py -3.11 -m pytest -q tests/test_assembly.py tests/test_graph_ops.py -k intent_trace"
  - type: smoke
    command: "python -c \"from pathlib import Path; a=Path('factoryline/assembly.py').read_text(encoding='utf-8'); g=Path('factoryline/graph_ops.py').read_text(encoding='utf-8'); required=['REQ_INTENT_ADAPTER_CAPTURE','REQ_INTENT_ADAPTER_READ_ONLY','REQ_INTENT_ADAPTER_FAIL_CLOSED','REQ_INTENT_ADAPTER_PREFER','factoryline.intent-trace.v1','forge_receipt_sha256','source_type','preferred']; assert all(item in a+g for item in required)\""

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "factoryline-code-factory"
version = "0.48.2"
description = "Audit AI-built code with six evidence lanes, intent-to-proof traces, agent workflow receipts, and human-owned release gates."
authors = [
  { name = "Richard Katz" },
  { email = "rkatz22@gmail.com" },
]
maintainers = [
  { name = "Richard Katz" },
  { email = "rkatz22@gmail.com" },
]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = [
  "software-factory",
  "ai-agents",
  "mutation-testing",
  "release-evidence",
  "developer-tools",
  "mvp",
  "mcp",
  "model-context-protocol",
  "cursor",
  "opencode",
  "ai-coding-assistant",
  "graph-ops",
  "prd-grill",
  "independent-verification",
  "verifier-plane",
  "github-pull-request",
  "proof-review",
  "proof-debt",
  "ai-governance",
  "design-review",
  "ui-quality",
  "langgraph",
  "agent-replay",
  "resume-parity",
  "gauntlet",
  "e2e-testing",
  "survival-card",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "cryptography>=42,<50",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "sqlglot==30.23.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/zrk222/code-factory"
Documentation = "https://github.com/zrk222/code-factory#readme"
Source = "https://github.com/zrk222/code-factory"
Issues = "https://github.com/zrk222/code-factory/issues"
Changelog = "https://github.com/zrk222/code-factory/releases"

[project.optional-dependencies]
issues = ["keyring>=25,<26", "truststore>=0.10,<1"]
dev = [
  "psycopg[binary]>=3.2,<4",
  "reportlab>=4,<5",
  "Pillow==12.3.0",
  "setuptools>=77,<83",
  "hypothesis>=6.135,<7",
  "pytest>=8.0",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=7,<8",
  "pytest-xdist==3.8.0",
  "ruff>=0.14,<0.15",
  "mypy==2.1.0",
  "tomli>=2.0; python_version < '3.11'",
]
compat = [
  "psycopg[binary]>=3.2,<4",
  "reportlab>=4,<5",
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]
pdf = ["reportlab>=4,<5"]
sigstore = ["sigstore>=4.4,<5"]
enterprise = ["cryptography>=42,<50"]
hosted = [
  "gunicorn>=23,<24; platform_system != 'Windows'",
  "psycopg[binary]>=3.2,<4",
]
langgraph = [
  "langgraph>=1.1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
pythonpath = ["tests", "."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [".factory", ".venv", "venv", "build", "dist", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project.scripts]
factory = "factoryline.provenance:main"

[tool.setuptools]
packages = ["factoryline", "factoryline.builtin_packs"]
include-package-data = false

[tool.setuptools.package-data]
factoryline = ["builtin_packs/**/*.json", "builtin_packs/**/*.yaml", "data/*.json", "hosted_console.html", "graph_ops.html", "studio_audit.js"]

[tool.setuptools.exclude-package-data]
factoryline = ["**/__pycache__/*", "**/*.py[cod]"]

[tool.setuptools.data-files]
"share/code-factory/deep-adapters/profiles" = ["deploy/deep-adapters/profiles/*.json"]
"share/code-factory/deep-adapters" = ["deploy/deep-adapters/README.md"]
"share/code-factory/evaluation" = ["scripts/evaluate_jev.mjs", "scripts/jev_evidence.mjs"]

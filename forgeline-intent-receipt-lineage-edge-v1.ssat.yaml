feature: forgeline-intent-receipt-lineage-edge-v1
version: "1.0"
intent: "Connect a verified local Forge ship-line source to its Factoryline intent adapter as a read-only graph edge without granting authority."
requirements:
  - id: REQ_INTENT_LINEAGE_EDGE
    description: "A valid hash-bound adapter emits one intent_source node and one bound_to_forge_line edge."
    invariant: "REQ_INTENT_LINEAGE_EDGE"
    checks:
      - "REQ_INTENT_LINEAGE_EDGE"
      - "intent_source"
      - "bound_to_forge_line"
      - "GRAPH_OPS_INTENT_LINEAGE_EDGE"
  - id: REQ_INTENT_LINEAGE_EDGE_FAIL_CLOSED
    description: "Missing, malformed, invalid, or mismatched bindings emit no source node or lineage edge and remain untraceable."
    invariant: "REQ_INTENT_LINEAGE_EDGE_FAIL_CLOSED"
    checks:
      - "REQ_INTENT_LINEAGE_EDGE_FAIL_CLOSED"
      - "intent_trace_lineage_edge_count"
      - "intent_trace_unbound_count"
      - "GRAPH_OPS_INTENT_ADAPTER_UNBOUND"
  - id: REQ_INTENT_LINEAGE_EDGE_FACTS
    description: "The source node retains the exact path, line, raw-line hash, and false authority facts."
    invariant: "REQ_INTENT_LINEAGE_EDGE_FACTS"
    checks:
      - "REQ_INTENT_LINEAGE_EDGE_FACTS"
      - "source_path"
      - "line"
      - "sha256"
      - "authority"
      - "execution"
  - id: REQ_INTENT_LINEAGE_EDGE_UI
    description: "Graph Ops shows the intent trace and source lanes without controls."
    invariant: "REQ_INTENT_LINEAGE_EDGE_UI"
    checks:
      - "REQ_INTENT_LINEAGE_EDGE_UI"
      - "intent_trace"
      - "intent_source"
      - "GRAPH_OPS_INTENT_LINEAGE_EDGE_READ_ONLY"
      - "GRAPH_OPS_INTENT_LINEAGE_EDGE"
gates:
  - type: test
    command: "py -3.11 -m pytest -q tests/test_graph_ops.py -k adapter"
  - type: smoke
    command: "python -c \"from pathlib import Path; source=Path('factoryline/graph_ops.py').read_text(encoding='utf-8'); page=Path('factoryline/graph_ops.html').read_text(encoding='utf-8'); docs=Path('docs/EXTERNAL_RUNTIME_EVIDENCE.md').read_text(encoding='utf-8'); required=['REQ_INTENT_LINEAGE_EDGE','REQ_INTENT_LINEAGE_EDGE_FAIL_CLOSED','REQ_INTENT_LINEAGE_EDGE_FACTS','intent_source','bound_to_forge_line','GRAPH_OPS_INTENT_LINEAGE_EDGE','GRAPH_OPS_INTENT_LINEAGE_EDGE_READ_ONLY']; assert all(item in source+page+docs for item in required) and 'innerHTML' not in page\""

name: external-runtime-evidence-triage-v1
language: python
modules:
  - name: graph_ops
    path: factoryline/graph_ops.py
    functions:
      - name: graph_ops_snapshot
        args: ["root: Path"]
        returns: "dict[str, Any]"
        doc: "Compile a bounded read-only graph and fact-derived recommendation."
      - name: _external_runtime_triage
        args: ["facts: dict[str, int]"]
        returns: "tuple[str, str] | None"
        doc: "Derive the advisory external-runtime review action without side effects."
dependencies: []
invariants:
  - name: triage_has_no_external_effects
    forbid_pattern: "requests\\.|httpx\\.|urllib\\.|socket\\.|subprocess\\.|\\b(?:publish|deploy|sign|send_message|grant_connector)\\s*\\("
    scopes:
      - module: graph_ops
        symbol: _external_runtime_triage
        max_lines: 40
        max_lines: 30

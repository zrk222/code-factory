feature: forgeline-intent-receipt-integrity-v1
version: "1.0"
intent: "Verify Factoryline intent adapter provenance against the exact local Forge ship line without granting authority."
requirements:
  - id: REQ_INTENT_BINDING_VERIFY
    description: "Graph Ops binds an adapter only when its claimed Forge-line hash and explicit values match the current bounded ship line."
    invariant: "REQ_INTENT_BINDING_VERIFY"
    checks:
      - "REQ_INTENT_BINDING_VERIFY"
      - "_forge_ship_binding"
      - "provenance_status"
      - "provenance_match"
      - "GRAPH_OPS_INTENT_ADAPTER_BOUND"
  - id: REQ_INTENT_BINDING_FAIL_CLOSED
    description: "Missing, malformed, or mismatched Forge evidence remains untraceable and cannot fall back to a legacy line."
    invariant: "REQ_INTENT_BINDING_FAIL_CLOSED"
    checks:
      - "REQ_INTENT_BINDING_FAIL_CLOSED"
      - "GRAPH_OPS_INTENT_ADAPTER_MISMATCH"
      - "GRAPH_OPS_INTENT_ADAPTER_UNBOUND"
      - "repair_intent_trace_binding"
      - "intent_trace_binding_mismatch_count"
  - id: REQ_INTENT_BINDING_FACTS
    description: "The snapshot exposes claimed and observed hashes and retains a false authority boundary."
    invariant: "REQ_INTENT_BINDING_FACTS"
    checks:
      - "REQ_INTENT_BINDING_FACTS"
      - "observed_forge_receipt_sha256"
      - "authority"
      - "execution"
  - id: REQ_INTENT_BINDING_UI
    description: "The intent panel explains mismatch and unbound states without adding execution or repair controls."
    invariant: "REQ_INTENT_BINDING_UI"
    checks:
      - "REQ_INTENT_BINDING_UI"
      - "Receipt binding mismatch"
      - "GRAPH_OPS_INTENT_ADAPTER_MISMATCH"
      - "review-required rationale"
      - "GRAPH_OPS_INTENT_BINDING_NO_INNERHTML"
gates:
  - type: test
    command: "py -3.11 -m pytest -q tests/test_graph_ops.py -k adapter"
  - type: smoke
    command: "python -c \"from pathlib import Path; source=Path('factoryline/graph_ops.py').read_text(encoding='utf-8'); page=Path('factoryline/graph_ops.html').read_text(encoding='utf-8'); required=['REQ_INTENT_BINDING_VERIFY','REQ_INTENT_BINDING_FAIL_CLOSED','REQ_INTENT_BINDING_FACTS','REQ_INTENT_BINDING_UI','provenance_status','observed_forge_receipt_sha256','GRAPH_OPS_INTENT_ADAPTER_MISMATCH','Receipt binding mismatch']; assert all(item in source+page for item in required) and 'innerHTML' not in page\""

schema: factory.ssat.v1
spec_markdown: |
  # Spec: atomic-audit-convergence
  Status: draft
  SpecFactor-target: 0.75-2.5
  
  ## MUST - Functional core
  ### Description
  Normalize independently produced, structured code-review rounds into a bounded local receipt so developers can see incomplete criteria, duplicated findings, unresolved issues, regressions, and next human actions. This adapts Atomic's review-convergence and per-criterion verification patterns to CF's evidence and authority model.
  
  ### User roles
  - Engineer or agent importing review artifacts for one candidate.
  - Human reviewer who owns interpretation and any release decision.
  
  ### Requirements (EARS)
  - The system shall enforce `bounded_inputs` and reject contracts or rounds larger than 1 MiB, containing unknown fields, more than 8 reviewers, more than 64 criteria, or more than 256 findings.
  - The system shall enforce `declared_digest_bindings` and store `contract_sha256` and `candidate_sha256` in every receipt as caller-declared digests. The system shall reject any assertion that either digest authenticates reviewer identity or unread source content.
  - The system shall enforce `incomplete_review_cells` and emit INDETERMINATE when any declared reviewer/criterion cell is missing, duplicated, malformed, or has an unknown outcome; it shall never label such a round clean.
  - The system shall enforce `objective_review_queue` and emit unresolved human-review work for required_by_objective, contradicts_objective, or unknown alignment, independent of a reported priority value.
  - The system shall enforce `reporter_preserving_dedupe` and merge records with equal canonical finding keys and store all reporter IDs and evidence digests in the merged record; the merge shall preserve unresolved status when any report is unresolved.
  - When a compatible prior self-hash-valid receipt is supplied, the evaluator shall enforce `prior_round_lineage` and emit added, persistent, no_longer_reported, and reopened finding identities. The evaluator shall reject comparison against any prior receipt under a different contract digest. A finding missing from a review round is not proof of resolution.
  - The system shall enforce `contained_atomic_output` and write a machine-readable self-hashed receipt only to an explicitly requested workspace-contained output path.
  - The system shall enforce `declared_review_provenance` and emit provenance_unverified and mark reviewer identity, reviewer independence, source origin, severity, and alignment as caller-declared; the evaluator shall make no authenticity or semantic-correctness claim.
  - The system shall enforce `authority_exclusions` and emit authority=false for execution, approval, merge, publication, deployment, signing, and policy changes.
  - The system shall enforce `correlated_a2a_messages` and accept A2A v1.0 Message envelopes with exactly one supported structured review DataPart, preserve declared contextId/taskId for reply correlation, and produce a deterministic A2A v1.0 Message export bound to the local receipt.
  - The system shall enforce `a2a_export_boundary` and label A2A identity as unverified, expose the message as export-ready data only, and never discover endpoints, acquire credentials, send a message, or treat remote task state as approval.
  - The system shall enforce `lazy_cli_dispatch` and emit convergence results only after the CLI selects the convergence command and shall leave the engine unimported for every other command.
  - The system shall enforce `bounded_status_reads` and expose convergence facts through bounded read-only MCP and WebMCP status tools.
  - The system shall enforce `graph_handoff_summary` and display the self-hash-validated receipt and A2A correlation summary in Graph Ops.
  - The system shall enforce `optional_ci_artifacts` and emit optional review-convergence artifacts in CI when the conventional contract and round inputs exist. The optional convergence lane shall not change the main proof-review result when its inputs are absent or invalid.
  
  ### Acceptance criteria (Gherkin)
  ```gherkin

  Scenario: Complete structured reviewer round remains advisory
    Given a contract with approved criterion definitions and a fixed contract digest
    And every declared reviewer reports every criterion with valid typed outcomes
    When the round is reconciled against the candidate digest
    Then the receipt reports exact coverage and deduplicated findings
    And the receipt has no release, approval, merge, or publication authority
  
  Scenario: Missing or malformed review is indeterminate
    Given a contract requiring multiple reviewers and criteria
    When any reviewer or criterion result is missing, duplicated, or invalid
    Then the result is INDETERMINATE
    And it is not represented as a pass or as resolved proof
  
  Scenario: Required issue is not dismissed by a low severity label
    Given an unresolved finding aligned as required_by_objective
    When reviewers assign different severity values or only one reviewer reports it
    Then the normalized finding remains in the human review queue
    And its reviewer provenance and alignment declaration are preserved
  
  Scenario: Review rounds expose regressions and reopened issues
    Given a prior valid receipt bound to the same contract digest
    When the new round introduces a finding or reintroduces a resolved finding
    Then the receipt classifies it as added, persistent, no_longer_reported, or reopened and lists a concrete next action
  
  Scenario: Changed contract cannot reuse prior convergence state
    Given a prior receipt under a different review-contract digest
    When a new round attempts to compare against it
    Then comparison is blocked as incompatible and the receipt does not claim progress
  ```
  
  ## SHOULD - Technical/structural
  - ADR references: Atomic `packages/workflows/builtin/review-convergence.ts` and `verification-criteria.ts`; CF authority boundary and provenance rules.
  - Data model: `factory.atomic-review-contract.v1`, `factory.atomic-review-round.v1`, and `factory.atomic-review-convergence.v1`. Decision facts are `contract_valid`, `round_valid`, `coverage_complete`, `alignment_unknown`, `required_alignment`, `duplicate_finding_identity`, `prior_contract_digest_match`, and `complete_review_no_findings`. `INDETERMINATE` means evidence coverage is incomplete; `REVIEW_COMPLETE_ADVISORY` means only that all declared report cells were supplied, not that code is correct.
  - API contract: local pure Python evaluator plus explicit CLI `factory audit convergence`; no network or model adapter.
  - A2A contract: input A2A v1.0 `Message` with one `Part.data`; output a reply-correlated `ROLE_USER` Message with a single structured Part. The caller/client owns Agent Card discovery, authorization, transport, task polling, and any human interaction.
  - Limit: a valid self-hash proves receipt integrity against accidental edits only; it is not a signature, reviewer identity proof, or semantic verification.
  
  ## Local operation
  - Import either `factory.atomic-review-round.v1` JSON or an A2A v1.0 `Message` with `role: ROLE_AGENT` and one JSON `Part.data` containing a review round or `factory.atomic-review-submission.v1`.
  - The receipt's `a2a_message` is an A2A v1.0 `ROLE_USER` Message with `application/vnd.code-factory.review-handoff+json`, deterministic message ID, `reply_to` provenance, and any supplied context/task IDs. `factory audit convergence ... --a2a` prints this Message after writing the receipt.
  - Resume by saving an agent's A2A `ROLE_AGENT` Message as the next `--round` input and supplying the prior receipt. A one-reviewer submission does not imply that any other declared review cell has passed.
  - MCP `factory.audit_convergence_status` defaults to `.factory/review-convergence/latest.json` and can return the bounded A2A Message on request. WebMCP and Graph Ops expose a compact read-only handoff summary. CI compiles an optional receipt/report artifact only when both conventional input files exist; malformed optional input does not change the main proof-review result.
  - This is protocol-shaped local import/export, not an A2A network client. CF does not fetch Agent Cards, acquire credentials, transmit a Message, poll a Task, or authenticate a remote identity.
  
  ## SHOULD NOT - Implementation details
  - Do not import or vendor Atomic source code.
  - Do not add numeric model scores, agent-selected thresholds, or mean/quorum as a merge or release gate.
  - Do not let reviewer agreement erase a required finding.
  - Do not infer objective alignment, identity, or evidence authenticity from free-text claims.
  
  ## Decision logic (factory candidates)
  | # | if | then |
  |---|----|------|
  | 1 | `contract_valid` or `round_valid` is false | Reject the input and write no convergence receipt |
  | 2 | `coverage_complete` is false | Emit INDETERMINATE with exact missing cells; do not report a clean review |
  | 3 | required, contradicting, or unknown objective alignment is true | Put the finding in the human review queue |
  | 4 | `duplicate_finding_identity` is true | Emit a merged finding with every reviewer/evidence reference |
  | 5 | Prior receipt is valid and `prior_contract_digest_match` is true | Emit added/persistent/no_longer_reported/reopened identity sets; otherwise reject comparison |
  | 6 | `complete_review_no_findings` is true | Emit `REVIEW_COMPLETE_ADVISORY` |
  
  ## Verification
  - Run `py -3.11 scripts/verify_atomic_review_convergence.py` from the repository root. The verifier extracts these canonical spec and plan fields to a temporary SpecLine root inside its local evidence directory, validates both, and records the exact commands.
  - The verifier runs the convergence, MCP, WebMCP, Junie taxonomy, deep-audit surfaces, and Atomic adapter tests on Python 3.10, 3.11, and 3.12. Each evidence category names required passing JUnit cases.
  - The optional CI step is executed locally with valid, missing, and invalid review fixtures. The test checks the artifact states and confirms the main proof result bytes stay unchanged.
  - Fatal validation takes precedence: invalid JSON or envelope fields, unknown or duplicate reviewer records, and unknown criterion IDs reject the request without writing a receipt. For a recognized reviewer and criterion, an omitted, repeated, malformed or explicitly unknown outcome leaves the affected cell incomplete.
  - The CLI writes a receipt only when given `--contract`, `--round`, and `--out`. Exit 0 means reconciliation completed; inspect the advisory state. Input errors exit 2. `--previous` compares prior receipt findings, and `--a2a` emits only the outbound message.
  - Hashes use SHA-256 over sorted, compact UTF-8 JSON. The input contract digest binds the round; the outbound message binds the receipt core; the outer digest binds the message. Source bytes and authenticated identities are independent evidence.
plan_markdown: |
  # Plan: atomic-audit-convergence
  Spec: specs/atomic-audit-convergence.md
  Architect verdict: PASS
  
  ## Logical decomposition
  1. Normalize bounded local JSON or A2A v1.0 structured messages into criterion-level review cells; retain task/context correlation while explicitly marking reviewer identity unverified.
  2. Consolidate objective-aware findings deterministically, compare self-hashed prior receipts, and export a correlated A2A reply Message bound to the same receipt core.
  3. Route the local receipt summary through lazy CLI dispatch, read-only MCP/WebMCP, Graph Ops, and optional non-blocking CI artifact generation.
  4. Keep every surface advisory; no remote endpoint discovery, message send, model inference, source execution, or release authority is introduced.
  
  ## Tasks
  - [x] T1 | slice=factoryline | files=factoryline/atomic_review_audit.py | verify=`pytest tests/test_atomic_review_convergence.py` | Implement bounded review schema, deterministic reconciliation, correlation-preserving A2A envelopes, and receipt self-hash validation.
  - [x] T2 | slice=tests | files=tests/test_atomic_review_convergence.py | verify=`pytest tests/test_atomic_review_convergence.py` | Cover positive, adversarial, drift, CLI, A2A follow-up correlation, MCP export, and Graph Ops projection.
  - [x] T3 | slice=specs | files=specs/atomic-review-convergence-v1.ssat.yaml | verify=`specline validate atomic-audit-convergence --root .` | Define module boundaries, inputs, outputs, and authority exclusions.
  - [x] T4 | slice=factoryline | files=factoryline/cli_audit.py | verify=`pytest tests/test_atomic_review_convergence.py` | Add lazy explicit-output CLI command, A2A Message export, and stable error mapping.
  - [x] T5 | slice=factoryline | files=factoryline/mcp.py,factoryline/webmcp.py,factoryline/junie_taxonomy.py | verify=`pytest tests/test_mcp.py tests/test_webmcp.py tests/test_junie_taxonomy.py` | Add bounded receipt export, WebMCP discovery, and Junie taxonomy.
  - [x] T6 | slice=factoryline | files=factoryline/graph_ops.py,factoryline/graph_ops.html | verify=`pytest tests/test_atomic_review_convergence.py tests/test_webmcp.py` | Project the advisory receipt and correlated handoff into Graph Ops.
  - [x] T7 | slice=.github | files=.github/workflows/factory-pr-proof-review.yml | verify=`pytest tests/test_atomic_review_convergence.py` | Emit optional receipt artifacts without changing the main CI gate.
system: atomic-review-convergence-v1
version: 1
governance: human_controlled
components:
  - name: atomic_review_audit
    path: factoryline/atomic_review_audit.py
    provides:
      - name: evaluate_review_round
        inputs: [workspace_root, review_contract_json, review_round_json, optional_prior_receipt, explicit_output_path]
        outputs: [self_hashed_advisory_review_receipt]
  - name: audit_cli
    path: factoryline/cli_audit.py
    provides:
      - name: audit_convergence
        inputs: [contract_path, round_path, optional_previous_path, output_path]
        outputs: [json_or_text_receipt_summary]
edges:
  - from: audit_cli
    to: atomic_review_audit
    relation: lazily_invokes_explicit_local_reconciliation
invariants:
  - Contracts and rounds are strict-schema UTF-8 JSON, bounded to 1 MiB, and workspace-contained.
  - Every declared reviewer and criterion cell must be present exactly once; incomplete, malformed, duplicated, or unknown outcomes produce INDETERMINATE.
  - Candidate and contract digests are caller-supplied bindings, not proof that content was independently read or authenticated.
  - Finding identity is deterministic; merged findings preserve reporter identities and evidence digests as declarations.
  - Required, contradicting, or unknown objective alignment routes to human review regardless of severity labels.
  - Prior-round comparison is rejected if its self-hash is invalid or its contract digest differs.
  - A missing finding is recorded only as no_longer_reported; absence is not proof of resolution.
  - Receipt output is explicit, workspace-contained, atomic, and cannot overwrite its input contract, round, or previous receipt.
  - Reviewer identity, independence, evidence origin, priority, and objective alignment remain unverified caller claims.
  - The adapter performs no source execution, network access, model inference, approval, merge, publication, deployment, or signing.
  - Every receipt has authority=false for execution, approval, merge, publication, deployment, signing, and policy changes.

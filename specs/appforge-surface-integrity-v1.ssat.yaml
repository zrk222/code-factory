name: appforge-surface-integrity-v1
language: python
modules:
  - name: appforge_native_surface
    path: factoryline/appforge_native_surface.py
    functions:
      - name: verify_native_surface
        args: [root, candidate_path, contract_path, evidence_path, out_path]
        returns: dict[str, Any]
  - name: appforge_surface_matrix
    path: factoryline/appforge_surface_matrix.py
    functions:
      - name: create_surface_matrix
        args: [root, candidate_path, native_surface_path, out_path]
        returns: dict[str, Any]
  - name: appforge_storefront_story
    path: factoryline/appforge_storefront_story.py
    functions:
      - name: verify_storefront_story
        args: [root, candidate_path, store_media_path, contract_path, evidence_path, out_path]
        returns: dict[str, Any]
dependencies:
  - from: appforge_surface_matrix
    to: appforge_native_surface
invariants:
  - name: surface_integrity_never_invokes_provider_or_device
    forbid_pattern: "subprocess\\.|requests\\.|httpx\\.|urllib\\.|socket\\.|os\\.system|Popen\\("
    scopes:
      - module: appforge_native_surface
        symbol: verify_native_surface
        max_lines: 80
      - module: appforge_surface_matrix
        symbol: create_surface_matrix
        max_lines: 80
      - module: appforge_storefront_story
        symbol: verify_storefront_story
        max_lines: 80
  - name: surface_integrity_never_evaluates_untrusted_content
    forbid_pattern: "eval\\(|exec\\("
    scopes:
      - module: appforge_native_surface
        symbol: verify_native_surface
        max_lines: 80
      - module: appforge_storefront_story
        symbol: verify_storefront_story
        max_lines: 80
tests:
  - path: tests/test_appforge_native_surface.py
    command: py -3.11 -m pytest -q tests/test_appforge_native_surface.py
  - path: tests/test_appforge_submission_assurance.py
    command: py -3.11 -m pytest -q tests/test_appforge_submission_assurance.py::test_surface_matrix_expands_the_exact_ready_native_surface_receipt tests/test_appforge_submission_assurance.py::test_surface_matrix_rejects_unsealed_or_mismatched_native_surface tests/test_appforge_submission_assurance.py::test_surface_matrix_projection_excludes_tampered_receipt
  - path: tests/test_appforge_storefront_story.py
    command: py -3.11 -m pytest -q tests/test_appforge_storefront_story.py
  - path: tests/test_mcp.py
    command: py -3.11 -m pytest -q tests/test_mcp.py::test_mcp_status_declares_default_stdio_and_zero_authority_boundary tests/test_mcp.py::test_mcp_protocol_parity_is_read_only tests/test_mcp.py::test_mcp_project_scope_review_routes_matching_prd_scopes_read_only tests/test_mcp.py::test_mcp_project_scope_review_does_not_route_unmatched_specs tests/test_mcp.py::test_mcp_project_scope_review_rejects_paths_outside_workspace tests/test_mcp.py::test_mcp_first_lap_status_is_integrity_checked_and_read_only tests/test_mcp.py::test_mcp_revenue_appforge_saas_and_memory_tools_are_read_only tests/test_mcp.py::test_mcp_judgment_safety_case_accepts_only_a_hash_bound_declared_change_profile tests/test_mcp.py::test_mcp_langgraph_assurance_reads_existing_receipts_without_execution tests/test_mcp.py::test_mcp_read_only_receipt_and_gate_status_tools tests/test_mcp.py::test_mcp_rejects_malformed_and_unsafe_requests_without_writing tests/test_mcp.py::test_mcp_stdio_emits_only_newline_delimited_json_rpc
  - path: tests/test_webmcp.py
    command: py -3.11 -m pytest -q tests/test_webmcp.py
schema: factory.ssat.v1

name: meta-connector-rest-v1
modules:
  - name: meta_connector_api
    path: factoryline/meta_connector_api.py
    imports: [factoryline.hosted_identity, factoryline.pr_assurance, factoryline.meta_connector_storage]
    functions:
      - name: create_meta_connector_app_from_env
        args: ["environ: Mapping[str, str] | None"]
        returns: MetaConnectorAPI
        doc: "Construct the HTTPS-facing OAuth resource with pinned issuer and audience."
      - name: _validate_snapshot
        args: ["value: Any", "now: datetime"]
        returns: "dict[str, Any]"
        doc: "Bound a commit and policy-bound summary without granting audit authority."
  - name: meta_connector_storage
    path: factoryline/meta_connector_storage.py
    imports: []
    functions:
      - name: connect
        args: ["database: str"]
        returns: "sqlite3.Connection | PostgresConnection"
        doc: "Select durable PostgreSQL on stateless hosts and SQLite for local runs."
  - name: meta_connector_vercel
    path: api/index.py
    imports: [factoryline.meta_connector_api]
    functions:
      - name: app
        args: ["environ: Mapping[str, Any]", "start_response: Callable"]
        returns: "list[bytes]"
        doc: "Route the isolated Vercel function to the connector resource."
invariants:
  - name: meta_connector_never_runs_repository_code
    forbid_pattern: "subprocess|spawnSync|os.system|shell=True"
    scopes:
      - module: meta_connector_api
        symbol: create_meta_connector_app_from_env
        max_lines: 80
  - name: meta_connector_never_imports_wizeme
    forbid_pattern: "zoria|wizeme"
    scopes:
      - module: meta_connector_vercel
        symbol: app
        max_lines: 30

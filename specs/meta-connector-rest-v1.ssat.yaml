name: meta-connector-rest-v1
modules:
  - name: meta_connector_api
    path: factoryline/meta_connector_api.py
    imports: [factoryline.hosted_identity, factoryline.pr_assurance]
    functions:
      - name: create_meta_connector_app_from_env
        args: ["environ: Mapping[str, str] | None"]
        returns: MetaConnectorAPI
        doc: "Construct the HTTPS-facing OAuth resource with pinned issuer and audience."
      - name: _validate_snapshot
        args: ["value: Any", "now: datetime"]
        returns: "dict[str, Any]"
        doc: "Bound a commit and policy-bound summary without granting audit authority."
invariants:
  - name: meta_connector_never_runs_repository_code
    forbid_pattern: "subprocess|spawnSync|os.system|shell=True"
    scopes:
      - module: meta_connector_api
        symbol: create_meta_connector_app_from_env
        max_lines: 80

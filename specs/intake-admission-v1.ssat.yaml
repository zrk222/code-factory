name: intake-admission-v1
language: python
modules:
  - name: intake_binding
    path: factoryline/intake_parameters.py
    functions:
      - name: verify_intake_binding
        args: [root, receipt_path, scope_paths, required_lanes, budgets, mode, external_effects, expires_at, binding_sha256]
        returns: dict[str, Any]
  - name: runtime_plan
    path: factoryline/runtime_audit_contract.py
    functions:
      - name: verify_runtime_audit_plan
        args: [path, trust_root_path, trust_root_sha256, workspace_root, environment_digest, require_intake]
        returns: dict[str, Any]
  - name: run_admission
    path: factoryline/run_admission.py
    functions:
      - name: prepare_admission
        args: [root, passport_path, request_path, out_dir, require_intake]
        returns: dict[str, Any]
dependencies:
  - factoryline.intake_parameters
  - factoryline.runtime_audit_contract
  - factoryline.proof_review_workflow
  - factoryline.release_candidate
invariants:
  - name: binding_never_executes
    forbid_pattern: "subprocess\\.|requests\\.|httpx\\.|socket\\.|os\\.system|Popen\\(|eval\\(|exec\\("
    scopes:
      - module: intake_parameters
        symbol: verify_intake_binding
        max_lines: 190
  - name: checkpoint_fix_never_applies
    forbid_pattern: "apply_patch|git\\s+(apply|commit)|subprocess"
    scopes:
      - module: run_admission
        symbol: _checkpoint_fix
        max_lines: 110
tests:
  - path: tests/test_intake_admission.py
    command: py -3.11 -m pytest -q tests/test_intake_admission.py::test_matching_binding_requires_authoritative_receipt tests/test_intake_admission.py::test_binding_rejects_drift tests/test_intake_admission.py::test_advisory_envelope_cannot_admit_work
  - path: tests/test_runtime_audit_contract.py
    command: py -3.11 -m pytest -q tests/test_runtime_audit_contract.py
  - path: tests/test_analysis_evidence.py
    command: py -3.11 -m pytest -q tests/test_analysis_evidence.py::test_admission_seals_then_revalidates_without_external_authority tests/test_analysis_evidence.py::test_admission_rejects_undeclared_action_without_writing_packet tests/test_analysis_evidence.py::test_admission_becomes_stale_when_workspace_changes tests/test_analysis_evidence.py::test_admission_rejects_expired_or_overlong_validity_before_writing_packet tests/test_analysis_evidence.py::test_admission_blocks_a_tampered_packet_with_the_public_marker tests/test_analysis_evidence.py::test_admission_cli_seals_then_reports_a_ready_packet tests/test_analysis_evidence.py::test_strict_admission_binds_authoritative_intake_parameters tests/test_analysis_evidence.py::test_strict_admission_rejects_missing_intake_binding tests/test_analysis_evidence.py::test_checkpoint_fix_is_bound_to_scope_patch_and_human_approval
  - path: tests/test_audit_rule_search.py
    command: py -3.11 -m pytest -q tests/test_audit_rule_search.py::test_req_pr_001_intent_contract_is_complete_confirmed_bound_and_immutable tests/test_audit_rule_search.py::test_req_pr_002_five_minute_review_has_exact_fail_closed_routes tests/test_audit_rule_search.py::test_req_pr_003_hook_pack_writes_five_templates_without_vendor_mutation tests/test_audit_rule_search.py::test_req_pr_004_failure_learning_requires_human_and_is_immutable tests/test_audit_rule_search.py::test_req_pr_005_team_inbox_prioritizes_human_work_and_keeps_claim_limits tests/test_audit_rule_search.py::test_req_pr_006_trajectory_enforces_order_scope_tools_and_independent_audit tests/test_audit_rule_search.py::test_req_pr_007_card_is_public_safe_and_offline_tamper_evident tests/test_audit_rule_search.py::test_req_pr_008_graph_ops_projects_read_only_team_inbox tests/test_audit_rule_search.py::test_req_pr_009_paths_are_workspace_contained_and_large_inputs_fail_closed tests/test_audit_rule_search.py::test_req_pr_010_cli_is_one_machine_readable_front_door_without_regression tests/test_audit_rule_search.py::test_strict_proof_review_binds_intake_scope_and_digest tests/test_audit_rule_search.py::test_strict_proof_review_rejects_missing_intake tests/test_audit_rule_search.py::test_empty_templates_are_versioned_and_authority_free tests/test_audit_rule_search.py::test_empty_projections_report_no_local_evidence_or_authority tests/test_audit_rule_search.py::test_deep_scan_projection_marks_unrun_state_without_promoting_assurance tests/test_audit_rule_search.py::test_sha_of_tracks_exact_bytes_and_absent_files tests/test_audit_rule_search.py::test_version_tuple_parses_release_components_and_rejects_invalid_versions tests/test_audit_rule_search.py::test_merkle_root_is_order_independent_and_rejects_empty_commitments tests/test_audit_rule_search.py::test_mermaid_for_emits_challenge_nodes_into_a_compact_proof_graph tests/test_audit_rule_search.py::test_dsse_pae_uses_utf8_byte_lengths_and_exact_payload_bytes tests/test_audit_rule_search.py::test_source_language_classification_does_not_promote_unknown_formats tests/test_audit_rule_search.py::test_bound_bytes_requires_matching_hash_and_workspace_containment tests/test_audit_rule_search.py::test_proof_review_and_continuity_projections_stay_empty_without_receipts tests/test_audit_rule_search.py::test_update_manifest_reader_normalizes_release_order tests/test_audit_rule_search.py::test_feature_discovery_uses_exact_spec_stems tests/test_audit_rule_search.py::test_read_only_continuity_rejects_missing_database_without_initializing_it tests/test_audit_rule_search.py::test_failure_guidance_keeps_causal_code_and_evidence tests/test_audit_rule_search.py::test_fix_manifest_loader_accepts_json_object tests/test_audit_rule_search.py::test_fix_manifest_loader_rejects_json_array tests/test_audit_rule_search.py::test_directory_groups_map_to_sorted_unique_known_roles tests/test_audit_rule_search.py::test_scm_event_json_is_canonical_and_preserves_normalized_identity tests/test_audit_rule_search.py::test_failure_capsule_validator_rejects_unbound_input tests/test_audit_rule_search.py::test_live_manifest_validator_rejects_incomplete_contract tests/test_audit_rule_search.py::test_live_json_loader_rejects_non_object_manifest tests/test_audit_rule_search.py::test_lifecycle_writer_excludes_raw_arguments_and_workspace_paths tests/test_audit_rule_search.py::test_receipt_path_index_discovers_only_json_receipts tests/test_audit_rule_search.py::test_pareto_comparison_rejects_regressions_in_guarded_metrics tests/test_audit_rule_search.py::test_run_metrics_load_and_export_remain_aggregate_safe tests/test_audit_rule_search.py::test_savings_pair_loader_ignores_malformed_and_foreign_files tests/test_audit_rule_search.py::test_live_activity_stage_completion_updates_only_observed_counts tests/test_audit_rule_search.py::test_live_activity_reads_only_matching_run_cancellation tests/test_audit_rule_search.py::test_public_cdte_export_writes_aggregate_only_report
schema: factory.ssat.v1

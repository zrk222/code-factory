name: oracle-complexity-hardening
language: python
modules:
  - name: codex_metadata
    path: factoryline/codex_metadata.py
    functions:
      - name: audit_metadata
        args: [root, paths]
        returns: dict
      - name: write_metadata_audit
        args: [root, paths, out]
        returns: dict
  - name: oracle_firewall
    path: factoryline/oracle_firewall.py
    functions:
      - name: seal_oracle_contract
        args: [root, input_path, out]
        returns: dict
      - name: compile_oracle_challenge
        args: [root, contract_path, out]
        returns: dict
      - name: validate_oracle_challenge_plan
        args: [root, value]
        returns: dict
      - name: verify_oracle_challenge_result
        args: [root, plan_path, result_path]
        returns: dict
      - name: record_oracle_incident
        args: [root, agent, contract_path, drift_path, out]
        returns: dict
invariants:
  - name: public_coordinators_are_bounded_and_non_operational
    forbid_pattern: "subprocess\\.|requests\\.|httpx\\.|urllib\\.|socket\\.|\\b(?:exec|eval|publish|deploy|sign)\\s*\\("
    scopes:
      - module: codex_metadata
        symbol: audit_metadata
        max_lines: 50
      - module: oracle_firewall
        symbol: seal_oracle_contract
        max_lines: 45
      - module: oracle_firewall
        symbol: compile_oracle_challenge
        max_lines: 20
      - module: oracle_firewall
        symbol: validate_oracle_challenge_plan
        max_lines: 25
      - module: oracle_firewall
        symbol: verify_oracle_challenge_result
        max_lines: 40
      - module: oracle_firewall
        symbol: record_oracle_incident
        max_lines: 25
tests:
  - path: tests/test_codex_metadata.py
    command: python -m pytest -q tests/test_codex_metadata.py::test_bound_terminal_records_are_verified_and_authority_free tests/test_codex_metadata.py::test_record_audit_walks_nested_values_once tests/test_codex_metadata.py::test_jsonl_receipt_reuses_terminal_sibling_state_lookup tests/test_codex_metadata.py::test_unbound_success_and_self_attested_gate_fail_closed tests/test_codex_metadata.py::test_unclear_intent_is_not_an_acceptable_test_gate tests/test_codex_metadata.py::test_oversized_metadata_is_rejected_before_its_contents_are_read tests/test_codex_metadata.py::test_command_only_terminal_claim_is_weak_evidence tests/test_codex_metadata.py::test_green_gate_requires_negative_or_adversarial_proof tests/test_codex_metadata.py::test_contradictory_provider_state_is_not_collapsed_into_success tests/test_codex_metadata.py::test_malformed_jsonl_is_named_instead_of_skipped tests/test_codex_metadata.py::test_orphan_active_and_workspace_mismatch_are_visible tests/test_codex_metadata.py::test_active_policy_constraints_are_not_misclassified_as_live_execution tests/test_codex_metadata.py::test_markdown_claims_without_receipts_are_review_required tests/test_codex_metadata.py::test_cli_writes_readable_receipt_and_returns_one_for_review tests/test_codex_metadata.py::test_path_escape_and_missing_inventory_are_rejected tests/test_codex_metadata.py::test_explicit_empty_inventory_is_rejected_instead_of_discovering_defaults tests/test_codex_metadata.py::test_file_growth_after_stat_is_still_classified_oversize tests/test_codex_metadata.py::test_metadata_findings_are_scope_labeled_and_cli_can_select_archive tests/test_codex_metadata.py::test_progress_ledger_order_and_head_drift_are_reported tests/test_codex_metadata.py::test_progress_ledger_orders_independent_workflow_streams_separately tests/test_codex_metadata.py::test_state_without_receipt_lineage_is_not_proof tests/test_codex_metadata.py::test_nonterminal_state_without_receipt_lineage_is_not_a_mismatch tests/test_codex_metadata.py::test_compact_forgeline_hash_and_ssat_bind_a_receipt_to_intent tests/test_codex_metadata.py::test_smoked_forgeline_stream_is_classified_as_archive
  - path: tests/test_oracle_firewall.py
    command: python -m pytest -q tests/test_oracle_firewall.py
  - path: tests/test_import_context_profiles.py
    command: python -m pytest -q tests/test_import_context_profiles.py::test_public_oracle_coordinators_stay_within_ten_branches tests/test_import_context_profiles.py::test_a2a_validators_stay_within_forgeline_complexity_limit

schema: factory.ssat.v1
system: atomic-proof-adapter-v1
version: 1
governance: human_controlled
components:
  - name: atomic_proof_adapter
    path: factoryline/atomic_proof_adapter.py
    provides:
      - name: import_atomic_run
        inputs: [root, envelope_path, out]
        outputs: [immutable_adapter_receipt]
      - name: verify_atomic_receipt
        inputs: [root, receipt_path]
        outputs: [current_oracle_binding_status]
      - name: atomic_proof_projection
        inputs: [root]
        outputs: [read_only_graph_mcp_projection]
  - name: oracle_firewall
    path: factoryline/oracle_firewall.py
    provides:
      - name: verify_oracle_contract
        inputs: [root, contract_path]
        outputs: [sealed_intent_contract_status]
edges:
  - from: atomic_proof_adapter
    to: oracle_firewall
    relation: verifies_current_contract_binding
invariants:
  - The imported workflow topology is a typed acyclic DAG with every declared stage represented exactly once.
  - Every stage, source precondition, and handoff scope remains inside the current sealed Oracle Contract scope.
  - Every handoff binds the exact sender capability, source preconditions, artifact hash, tool-manifest hash, and Oracle Contract digest.
  - A checkpoint resume may continue only through a new run and an unchanged workflow, contract, checkpoint, source-precondition, and tool-manifest binding.
  - The adapter never imports Atomic, starts a stage, resumes a checkpoint, sends a message, mutates source, reads credentials, approves work, or releases a change.
  - Declared isolation is presented as unverified context and never as sandbox proof.
gates:
  - command: py -3.11 -m pytest -q tests/test_atomic_proof_adapter.py tests/test_graph_ops.py tests/test_mcp.py::test_mcp_status_declares_default_stdio_and_zero_authority_boundary tests/test_mcp.py::test_mcp_protocol_parity_is_read_only tests/test_mcp.py::test_mcp_project_scope_review_routes_matching_prd_scopes_read_only tests/test_mcp.py::test_mcp_project_scope_review_does_not_route_unmatched_specs tests/test_mcp.py::test_mcp_project_scope_review_rejects_paths_outside_workspace tests/test_mcp.py::test_mcp_first_lap_status_is_integrity_checked_and_read_only tests/test_mcp.py::test_mcp_revenue_appforge_saas_and_memory_tools_are_read_only tests/test_mcp.py::test_mcp_judgment_safety_case_accepts_only_a_hash_bound_declared_change_profile tests/test_mcp.py::test_mcp_langgraph_assurance_reads_existing_receipts_without_execution tests/test_mcp.py::test_mcp_read_only_receipt_and_gate_status_tools tests/test_mcp.py::test_mcp_rejects_malformed_and_unsafe_requests_without_writing tests/test_mcp.py::test_mcp_stdio_emits_only_newline_delimited_json_rpc tests/test_webmcp.py
    expected: pass

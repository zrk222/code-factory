name: appforge-release-rehearsal-v1
language: python
modules:
  - name: appforge_release_rehearsal
    path: factoryline/appforge_release_rehearsal.py
    functions:
      - name: create_release_rehearsal
        args: [root, candidate_path, assurance_path, profile_path, out_path]
        returns: dict[str, Any]
      - name: release_rehearsal_projection
        args: [root]
        returns: dict[str, Any]
dependencies: []
invariants:
  - name: release_rehearsal_never_invokes_a_provider_or_network
    forbid_pattern: "subprocess\\.|requests\\.|httpx\\.|urllib\\.|socket\\.|os\\.system|Popen\\("
    scopes:
      - module: appforge_release_rehearsal
        symbol: create_release_rehearsal
        max_lines: 80
      - module: appforge_release_rehearsal
        symbol: release_rehearsal_projection
        max_lines: 80
  - name: release_rehearsal_never_evaluates_untrusted_profile_content
    forbid_pattern: "eval\\(|exec\\("
    scopes:
      - module: appforge_release_rehearsal
        symbol: create_release_rehearsal
        max_lines: 80
tests:
  - path: tests/test_appforge_release_rehearsal.py
    command: py -3.11 -m pytest -q tests/test_appforge_release_rehearsal.py::test_release_rehearsal_seals_exact_candidate_and_preserves_external_state_boundaries tests/test_appforge_release_rehearsal.py::test_release_rehearsal_cli_writes_only_the_local_sealed_receipt tests/test_appforge_release_rehearsal.py::test_release_rehearsal_keeps_channel_specific_external_states_not_applicable tests/test_appforge_release_rehearsal.py::test_release_rehearsal_binds_a_credential_free_cider_manifest_without_parsing_or_running_it tests/test_appforge_release_rehearsal.py::test_release_rehearsal_binds_a_complete_swiftlane_source_workflow_without_executing_it tests/test_appforge_release_rehearsal.py::test_release_rehearsal_binds_zealot_style_artifact_channel_and_audience_without_claiming_delivery tests/test_appforge_release_rehearsal.py::test_release_rehearsal_rejects_any_future_matrix_that_promotes_or_blurs_external_states tests/test_appforge_release_rehearsal.py::test_release_rehearsal_rejects_tampered_assurance_and_credential_like_profile tests/test_appforge_release_rehearsal.py::test_release_rehearsal_rejects_provider_and_candidate_scope_drift
  - path: tests/test_mcp.py
    command: py -3.11 -m pytest -q tests/test_mcp.py::test_mcp_status_declares_default_stdio_and_zero_authority_boundary tests/test_mcp.py::test_mcp_protocol_parity_is_read_only tests/test_mcp.py::test_mcp_project_scope_review_routes_matching_prd_scopes_read_only tests/test_mcp.py::test_mcp_project_scope_review_does_not_route_unmatched_specs tests/test_mcp.py::test_mcp_project_scope_review_rejects_paths_outside_workspace tests/test_mcp.py::test_mcp_first_lap_status_is_integrity_checked_and_read_only tests/test_mcp.py::test_mcp_revenue_appforge_saas_and_memory_tools_are_read_only tests/test_mcp.py::test_mcp_judgment_safety_case_accepts_only_a_hash_bound_declared_change_profile tests/test_mcp.py::test_mcp_langgraph_assurance_reads_existing_receipts_without_execution tests/test_mcp.py::test_mcp_read_only_receipt_and_gate_status_tools tests/test_mcp.py::test_mcp_rejects_malformed_and_unsafe_requests_without_writing tests/test_mcp.py::test_mcp_stdio_emits_only_newline_delimited_json_rpc
  - path: tests/test_webmcp.py
    command: py -3.11 -m pytest -q tests/test_webmcp.py
  - path: tests/test_graph_ops.py
    command: py -3.11 -m pytest -q tests/test_graph_ops.py
schema: factory.ssat.v1

name: jetbrains-monetization-2027-v1
modules:
  - name: marketplace_status
    path: scripts/jetbrains_marketplace_status.py
    imports:
      - urllib.request
    functions:
      - name: classify_status
        args: [plugin, updates]
        returns: dict
        doc: "Classify public Marketplace metadata and expected-version approval without hiding pending state."
      - name: main
        args: ["argv=None"]
        returns: int
        doc: "Return distinct clear, pending, and unavailable exit codes."
  - name: marketplace_status_tests
    path: tests/test_jetbrains_marketplace_status.py
    functions:
      - name: test_pending_metadata_is_not_hidden_by_an_approved_version
        args: []
        returns: unknown
dependencies:
  - from: marketplace_status_tests
    to: marketplace_status
invariants:
  - name: status_check_has_no_publication_authority
    forbid_pattern: "\\b(?:publishPlugin|git\\s+push|gh\\s+release|requests\\.(?:post|put|patch|delete))\\b"
    scopes:
      - module: marketplace_status
        symbol: main
        max_lines: 45
  - name: pending_test_has_no_network_dependency
    forbid_pattern: "\\b(?:urlopen|requests|httpx|socket)\\b"
    scopes:
      - module: marketplace_status_tests
        symbol: test_pending_metadata_is_not_hidden_by_an_approved_version
        max_lines: 20

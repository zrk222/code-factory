name: revenueforge-v1
language: python
modules:
  - name: revenueforge
    path: factoryline/revenueforge.py
    language: python
    functions:
      - name: validate_products
        args: [root, products_path]
        returns: dict
      - name: build_revenue_bundle
        args: [root, products_path, out_dir]
        returns: dict
      - name: plan_growth
        args: [root, products_path, growth_path]
        returns: dict
      - name: benchmark_cell
        args: [records]
        returns: dict
      - name: revenueforge_projection
        args: [root]
        returns: dict
dependencies: []
invariants:
  - name: revenueforge_has_no_provider_write_authority
    forbid_pattern: "(requests\\.(post|put|patch|delete)|httpx\\.(post|put|patch|delete)|urlopen\\()"
    scopes:
      - module: revenueforge
        symbol: build_revenue_bundle
        max_lines: 80
  - name: revenueforge_has_no_embedded_credentials
    forbid_pattern: "(API_KEY|PRIVATE_KEY|ASC_TOKEN|issuer_secret)"
    scopes:
      - module: revenueforge
        symbol: validate_products
        max_lines: 80
gates:
  - name: revenueforge_tests
    command: "python -m pytest -q tests/test_revenue_integrity.py::test_validate_and_build_full_bundle tests/test_revenue_integrity.py::test_repeated_bundle_skips_identical_replacements_and_repairs_changes tests/test_revenue_integrity.py::test_dark_patterns_fail_closed tests/test_revenue_integrity.py::test_missing_restore_blocks_generation tests/test_revenue_integrity.py::test_duplicate_product_id_is_rejected tests/test_revenue_integrity.py::test_phase8_is_bounded_and_human_governed tests/test_revenue_integrity.py::test_four_ppo_treatments_are_rejected tests/test_revenue_integrity.py::test_benchmark_withheld_below_k20_and_published_at_k20 tests/test_revenue_integrity.py::test_graph_projection_rejects_tampered_receipt tests/test_revenue_integrity.py::test_paths_cannot_escape_workspace tests/test_revenue_integrity.py::test_purchase_replay_requires_complete_verified_ordered_journey tests/test_revenue_integrity.py::test_testflight_inbox_redacts_identity_and_groups_journey tests/test_revenue_integrity.py::test_failure_matrix_never_promotes_unknown_to_pass tests/test_revenue_integrity.py::test_policy_watch_invalidates_only_impacted_rules tests/test_revenue_integrity.py::test_graph_projection_reads_all_revenue_evidence_receipts tests/test_revenue_integrity.py::test_evidence_memory_requires_sealed_receipt_and_quarantines_contradictions tests/test_revenue_integrity.py::test_revenue_shared_local_preserves_path_and_error_contract tests/test_revenue_integrity.py::test_revenue_dispatch_covers_exactly_registered_commands tests/test_revenue_integrity.py::test_revenue_dispatch_and_private_handlers_stay_bounded tests/test_revenue_integrity.py::test_revenue_validate_and_build_cli tests/test_revenue_integrity.py::test_revenue_evidence_cli_commands"

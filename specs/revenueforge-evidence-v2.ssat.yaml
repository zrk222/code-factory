name: revenueforge-evidence-v2
language: python
modules:
  - name: revenue_evidence
    path: factoryline/revenue_evidence.py
    language: python
    functions:
      - name: replay_purchase_journey
        args: [root, products_path, events_path, out]
        returns: dict
      - name: sync_testflight_evidence
        args: [root, feedback_path, out]
        returns: dict
      - name: evaluate_failure_matrix
        args: [root, products_path, evidence_path, out]
        returns: dict
      - name: watch_policy_drift
        args: [root, registry_path, snapshot_path, out]
        returns: dict
      - name: revenue_evidence_projection
        args: [root]
        returns: dict
      - name: promote_evidence_memory
        args: [root, entry_path, out]
        returns: dict
      - name: query_evidence_memory
        args: [root, app_id, journey, at]
        returns: dict
  - name: appforge_design
    path: factoryline/appforge_design.py
    language: python
    functions:
      - name: compile_appforge_design
        args: [root, brief_path, out_dir]
        returns: dict
      - name: appforge_design_projection
        args: [root]
        returns: dict
  - name: mcp
    path: factoryline/mcp.py
    language: python
    functions:
      - name: mcp_status
        args: [root]
        returns: dict
  - name: webmcp
    path: factoryline/webmcp.py
    language: python
    functions:
      - name: webmcp_manifest
        args: []
        returns: dict
dependencies:
  - from: revenue_evidence
    to: revenueforge
  - from: appforge_design
    to: revenue_evidence
  - from: appforge_design
    to: revenueforge
  - from: mcp
    to: revenue_evidence
  - from: mcp
    to: appforge_design
  - from: graph_ops
    to: appforge_design
invariants:
  - name: evidence_has_no_provider_writes
    forbid_pattern: "(requests\\.(post|put|patch|delete|get)|httpx\\.(post|put|patch|delete|get)|urlopen\\()"
    scopes:
      - module: revenue_evidence
        symbol: sync_testflight_evidence
        max_lines: 70
  - name: evidence_has_no_green_unknown
    forbid_pattern: "verdict\\s*=\\s*\"pass\"\\s+if\\s+counts\\[\"unknown\"\\]"
    scopes:
      - module: revenue_evidence
        symbol: evaluate_failure_matrix
        max_lines: 50
  - name: webmcp_has_no_network_or_credentials
    forbid_pattern: "(fetch\\(|XMLHttpRequest|navigator\\.credentials)"
    scopes:
      - module: webmcp
        symbol: webmcp_manifest
        max_lines: 45
gates:
  - name: revenue_evidence_tests
    command: "python -m pytest -q tests/test_revenue_integrity.py::test_validate_and_build_full_bundle tests/test_revenue_integrity.py::test_repeated_bundle_skips_identical_replacements_and_repairs_changes tests/test_revenue_integrity.py::test_dark_patterns_fail_closed tests/test_revenue_integrity.py::test_missing_restore_blocks_generation tests/test_revenue_integrity.py::test_duplicate_product_id_is_rejected tests/test_revenue_integrity.py::test_phase8_is_bounded_and_human_governed tests/test_revenue_integrity.py::test_four_ppo_treatments_are_rejected tests/test_revenue_integrity.py::test_benchmark_withheld_below_k20_and_published_at_k20 tests/test_revenue_integrity.py::test_graph_projection_rejects_tampered_receipt tests/test_revenue_integrity.py::test_paths_cannot_escape_workspace tests/test_revenue_integrity.py::test_purchase_replay_requires_complete_verified_ordered_journey tests/test_revenue_integrity.py::test_testflight_inbox_redacts_identity_and_groups_journey tests/test_revenue_integrity.py::test_failure_matrix_never_promotes_unknown_to_pass tests/test_revenue_integrity.py::test_policy_watch_invalidates_only_impacted_rules tests/test_revenue_integrity.py::test_graph_projection_reads_all_revenue_evidence_receipts tests/test_revenue_integrity.py::test_evidence_memory_requires_sealed_receipt_and_quarantines_contradictions tests/test_revenue_integrity.py::test_revenue_shared_local_preserves_path_and_error_contract tests/test_revenue_integrity.py::test_revenue_dispatch_covers_exactly_registered_commands tests/test_revenue_integrity.py::test_revenue_dispatch_and_private_handlers_stay_bounded tests/test_revenue_integrity.py::test_revenue_validate_and_build_cli tests/test_revenue_integrity.py::test_revenue_evidence_cli_commands"
  - name: mcp_webmcp_tests
    command: "python -m pytest -q tests/test_mcp.py::test_mcp_status_declares_default_stdio_and_zero_authority_boundary tests/test_mcp.py::test_mcp_protocol_parity_is_read_only tests/test_mcp.py::test_mcp_project_scope_review_routes_matching_prd_scopes_read_only tests/test_mcp.py::test_mcp_project_scope_review_does_not_route_unmatched_specs tests/test_mcp.py::test_mcp_project_scope_review_rejects_paths_outside_workspace tests/test_mcp.py::test_mcp_first_lap_status_is_integrity_checked_and_read_only tests/test_mcp.py::test_mcp_revenue_appforge_saas_and_memory_tools_are_read_only tests/test_mcp.py::test_mcp_judgment_safety_case_accepts_only_a_hash_bound_declared_change_profile tests/test_mcp.py::test_mcp_langgraph_assurance_reads_existing_receipts_without_execution tests/test_mcp.py::test_mcp_read_only_receipt_and_gate_status_tools tests/test_mcp.py::test_mcp_rejects_malformed_and_unsafe_requests_without_writing tests/test_mcp.py::test_mcp_stdio_emits_only_newline_delimited_json_rpc tests/test_webmcp.py tests/test_appforge_design.py tests/test_graph_ops.py"

name: oracle-firewall-v1
language: python
modules:
  - name: oracle_firewall
    path: factoryline/oracle_firewall.py
    functions:
      - name: seal_oracle_contract
        args: [root, input_path, out]
        returns: dict[str, Any]
      - name: capture_intent_handoff
        args: [root, source_path, agent, handoff_id, out]
        returns: dict[str, Any]
      - name: verify_oracle_contract
        args: [root, contract_path]
        returns: dict[str, Any]
      - name: compare_oracle_contracts
        args: [root, prior_path, candidate_path, out]
        returns: dict[str, Any]
      - name: compile_oracle_challenge
        args: [root, contract_path, out]
        returns: dict[str, Any]
      - name: verify_oracle_challenge_result
        args: [root, plan_path, result_path]
        returns: dict[str, Any]
      - name: record_oracle_incident
        args: [root, agent, contract_path, drift_path, out]
        returns: dict[str, Any]
  - name: agent_license
    path: factoryline/agent_license.py
    functions:
      - name: derive_license
        args: [root, agent]
        returns: dict[str, Any]
  - name: graph_ops
    path: factoryline/graph_ops.py
    functions:
      - name: graph_ops_snapshot
        args: [root]
        returns: dict[str, Any]
  - name: appforge_oracle
    path: factoryline/appforge_oracle.py
    functions:
      - name: verify_appforge_oracle_authority
        args: [root, authority_path]
        returns: dict[str, Any]
  - name: codex_metadata
    path: factoryline/codex_metadata.py
    functions:
      - name: audit_metadata
        args: [root, paths]
        returns: dict[str, Any]
  - name: mcp
    path: factoryline/mcp.py
    functions:
      - name: dispatch
        args: [request, root]
        returns: dict[str, Any]
dependencies:
  # Existing local evidence projections and lazy incident lookup; these edges
  # do not confer execution or release authority. Keyword-only parameters are
  # verified by tests, not by ForgeLine's positional-signature matcher.
  - from: oracle_firewall
    to: agent_license
  - from: agent_license
    to: oracle_firewall
  - from: graph_ops
    to: oracle_firewall
  - from: graph_ops
    to: agent_license
  - from: appforge_oracle
    to: oracle_firewall
  - from: mcp
    to: oracle_firewall
  - from: mcp
    to: codex_metadata
  - from: mcp
    to: graph_ops
  - from: mcp
    to: agent_license
  - from: mcp
    to: appforge_oracle
invariants:
  - name: oracle_cannot_execute_or_authorize
    forbid_pattern: "subprocess\\.|requests\\.|httpx\\.|urllib\\.|socket\\.|\\b(?:execute|repair|approve|merge|deploy|publish|sign|send_message|credential|connector)\\s*\\("
    scopes:
      - module: oracle_firewall
        symbol: seal_oracle_contract
        max_lines: 85
      - module: oracle_firewall
        symbol: compare_oracle_contracts
        max_lines: 120
      - module: oracle_firewall
        symbol: compile_oracle_challenge
        max_lines: 75
      - module: oracle_firewall
        symbol: verify_oracle_challenge_result
        max_lines: 90
  - name: graph_ops_is_only_a_projection
    forbid_pattern: "subprocess\\.|requests\\.|httpx\\.|urllib\\.|socket\\.|\\b(?:execute|repair|approve|merge|deploy|publish|sign|send_message|credential|connector)\\s*\\("
    scopes:
      - module: graph_ops
        symbol: graph_ops_snapshot
        max_lines: 210
tests:
  - path: tests/test_oracle_firewall.py
    command: py -3.11 -m pytest -q tests/test_oracle_firewall.py
  - path: tests/test_agent_license.py
    command: py -3.11 -m pytest -q tests/test_agent_license.py
  - path: tests/test_graph_ops.py
    command: py -3.11 -m pytest -q tests/test_graph_ops.py
  - path: tests/test_appforge_oracle.py
    command: py -3.11 -m pytest -q tests/test_appforge_oracle.py tests/test_appforge_submission_assurance.py::test_submission_assurance_core_imports_without_pdf_extra tests/test_appforge_submission_assurance.py::test_pdf_generation_reports_actionable_missing_extra tests/test_appforge_submission_assurance.py::test_submission_dossier_only_emits_markdown_and_pdf_after_all_build_bound_gates_pass tests/test_appforge_submission_assurance.py::test_submission_dossier_blocks_candidate_mismatch_without_emitting_final_reports tests/test_appforge_submission_assurance.py::test_submission_dossier_fails_closed_when_the_contract_requires_oracle_authority tests/test_appforge_submission_assurance.py::test_submission_dossier_binds_each_audit_digest_to_its_referenced_receipt tests/test_appforge_submission_assurance.py::test_store_media_rejects_truncated_or_alpha_pngs tests/test_appforge_submission_assurance.py::test_quality_audit_rejects_missing_user_design_confirmation_and_unbound_artifact tests/test_appforge_submission_assurance.py::test_submission_projection_fails_closed_on_non_object_receipt
  - path: tests/test_codex_metadata.py
    command: py -3.11 -m pytest -q tests/test_codex_metadata.py::test_bound_terminal_records_are_verified_and_authority_free tests/test_codex_metadata.py::test_record_audit_walks_nested_values_once tests/test_codex_metadata.py::test_jsonl_receipt_reuses_terminal_sibling_state_lookup tests/test_codex_metadata.py::test_unbound_success_and_self_attested_gate_fail_closed tests/test_codex_metadata.py::test_unclear_intent_is_not_an_acceptable_test_gate tests/test_codex_metadata.py::test_oversized_metadata_is_rejected_before_its_contents_are_read tests/test_codex_metadata.py::test_command_only_terminal_claim_is_weak_evidence tests/test_codex_metadata.py::test_green_gate_requires_negative_or_adversarial_proof tests/test_codex_metadata.py::test_contradictory_provider_state_is_not_collapsed_into_success tests/test_codex_metadata.py::test_malformed_jsonl_is_named_instead_of_skipped tests/test_codex_metadata.py::test_orphan_active_and_workspace_mismatch_are_visible tests/test_codex_metadata.py::test_active_policy_constraints_are_not_misclassified_as_live_execution tests/test_codex_metadata.py::test_markdown_claims_without_receipts_are_review_required tests/test_codex_metadata.py::test_cli_writes_readable_receipt_and_returns_one_for_review tests/test_codex_metadata.py::test_path_escape_and_missing_inventory_are_rejected tests/test_codex_metadata.py::test_explicit_empty_inventory_is_rejected_instead_of_discovering_defaults tests/test_codex_metadata.py::test_file_growth_after_stat_is_still_classified_oversize tests/test_codex_metadata.py::test_metadata_findings_are_scope_labeled_and_cli_can_select_archive tests/test_codex_metadata.py::test_progress_ledger_order_and_head_drift_are_reported tests/test_codex_metadata.py::test_progress_ledger_orders_independent_workflow_streams_separately tests/test_codex_metadata.py::test_state_without_receipt_lineage_is_not_proof tests/test_codex_metadata.py::test_nonterminal_state_without_receipt_lineage_is_not_a_mismatch tests/test_codex_metadata.py::test_compact_forgeline_hash_and_ssat_bind_a_receipt_to_intent tests/test_codex_metadata.py::test_smoked_forgeline_stream_is_classified_as_archive tests/test_mcp.py::test_mcp_status_declares_default_stdio_and_zero_authority_boundary tests/test_mcp.py::test_mcp_protocol_parity_is_read_only tests/test_mcp.py::test_mcp_project_scope_review_routes_matching_prd_scopes_read_only tests/test_mcp.py::test_mcp_project_scope_review_does_not_route_unmatched_specs tests/test_mcp.py::test_mcp_project_scope_review_rejects_paths_outside_workspace tests/test_mcp.py::test_mcp_first_lap_status_is_integrity_checked_and_read_only tests/test_mcp.py::test_mcp_revenue_appforge_saas_and_memory_tools_are_read_only tests/test_mcp.py::test_mcp_judgment_safety_case_accepts_only_a_hash_bound_declared_change_profile tests/test_mcp.py::test_mcp_langgraph_assurance_reads_existing_receipts_without_execution tests/test_mcp.py::test_mcp_read_only_receipt_and_gate_status_tools tests/test_mcp.py::test_mcp_rejects_malformed_and_unsafe_requests_without_writing tests/test_mcp.py::test_mcp_stdio_emits_only_newline_delimited_json_rpc

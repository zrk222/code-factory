name: source-worker-activation-preflight-v1
governance: supervised
modules:
  - name: activation_contract
    path: products/agent-cloud/app/runtime/sourceWorkerActivation.ts
    imports:
      - products/agent-cloud/app/runtime/sourceWorkerCredentials.ts
    functions: []
  - name: activation_command
    path: products/agent-cloud/app/runtime/sourceWorkerActivationEntrypoint.ts
    imports:
      - products/agent-cloud/app/runtime/sourceWorkerActivation.ts
      - products/agent-cloud/app/runtime/sourceWorkerCredentials.ts
      - products/agent-cloud/app/runtime/sourceWorkerNodeSecrets.ts
    functions: []
  - name: activation_contract_tests
    path: products/agent-cloud/app/runtime/sourceWorkerActivation.test.ts
    imports:
      - products/agent-cloud/app/runtime/sourceWorkerActivation.ts
    functions: []
  - name: activation_command_tests
    path: products/agent-cloud/app/runtime/sourceWorkerActivationEntrypoint.test.ts
    imports:
      - products/agent-cloud/app/runtime/sourceWorkerActivationEntrypoint.ts
    functions: []
dependencies:
  - from: activation_command
    to: activation_contract
  - from: activation_contract_tests
    to: activation_contract
  - from: activation_command_tests
    to: activation_command
invariants:
  - name: activation_contract_has_no_output_channel
    forbid_pattern: "console[.]|process[.](?:stdout|stderr)"
    scopes:
      - module: activation_contract
        symbol: runSourceWorkerActivationPreflight
        max_lines: 260
  - name: activation_receipt_has_no_secret_fields
    forbid_pattern: "\\b(?:token|issuer|audience|subject|references|fingerprints|path|claims)\\b"
    scopes:
      - module: activation_contract
        symbol: readyReceipt
        max_lines: 80
  - name: activation_command_has_no_dynamic_execution
    forbid_pattern: "child_process|\\b(?:eval|exec)\\s*\\("
    scopes:
      - module: activation_command
        symbol: executeSourceWorkerActivationCommand
        max_lines: 300

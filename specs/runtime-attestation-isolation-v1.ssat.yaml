name: runtime-attestation-isolation-v1
language: python
modules:
  - name: runtime_attestation
    path: factoryline/runtime_attestation.py
    functions:
      - name: capture_supervised_attestation
        args: []
        returns: dict
      - name: validate_runtime_attestation
        args: [value]
        returns: dict
      - name: runtime_boundary_decision
        args: [attestation]
        returns: dict
      - name: verify_signed_runtime_attestation
        args: [path, trust_root_path]
        returns: dict
  - name: runtime_audit
    path: factoryline/runtime_audit.py
    functions:
      - name: evaluate_runtime_audit
        args: [plan, executions, workspace_root]
        returns: dict
  - name: runtime_audit_runner
    path: factoryline/runtime_audit_runner.py
    functions:
      - name: run_runtime_audit_plan
        args: [plan, workspace_root, output_root]
        returns: dict
dependencies:
  - from: runtime_attestation
    to: enterprise_receipts
  - from: runtime_attestation
    to: runtime_audit_common
  - from: runtime_audit
    to: runtime_attestation
  - from: runtime_audit
    to: runtime_audit_runner
  - from: runtime_audit_runner
    to: runtime_attestation
invariants:
  - name: observation_never_grants_release
    forbid_pattern: "release_approval\\s*[:=]\\s*True|\\b(?:publish|deploy|approve)\\s*\\("
    scopes:
      - module: runtime_attestation
        symbol: validate_runtime_attestation
        max_lines: 220
      - module: runtime_attestation
        symbol: runtime_boundary_decision
        max_lines: 100
  - name: validator_never_executes_or_reads_secrets
    forbid_pattern: "subprocess\\.|requests\\.|httpx\\.|urllib\\.|socket\\.|os\\.environ|os\\.getenv"
    scopes:
      - module: runtime_attestation
        symbol: validate_runtime_attestation
        max_lines: 220
      - module: runtime_attestation
        symbol: verify_signed_runtime_attestation
        max_lines: 100
tests:
  - path: tests/test_runtime_attestation.py
    command: py -3.11 -m pytest -q tests/test_runtime_attestation.py::test_local_capture_is_explicitly_supervised_only tests/test_runtime_attestation.py::test_boundary_rejects_shell_executable_drift_and_stale_observations tests/test_runtime_attestation.py::test_boundary_missing_or_tampered_evidence_blocks_without_authority tests/test_runtime_attestation.py::test_signed_external_boundary_verifies_offline tests/test_runtime_attestation.py::test_signed_test_oracle_verifies_bounded_signer_claim tests/test_runtime_attestation.py::test_signed_test_oracle_v2_requires_bound_executed_origins tests/test_runtime_attestation.py::test_signed_test_oracle_v2_allows_consistent_module_aliases tests/test_runtime_attestation.py::test_signed_test_oracle_v3_verifies_collection_and_assertion_observations tests/test_runtime_attestation.py::test_v3_frame_origins_accept_compiler_and_legacy_qualnames tests/test_runtime_attestation.py::test_v3_frame_origins_reject_unknown_or_malformed_special_tokens tests/test_runtime_attestation.py::test_v3_callback_assertion_qualnames_still_reject_compiler_tokens tests/test_runtime_attestation.py::test_signed_test_oracle_v3_rejects_wrong_dsse_payload_type tests/test_runtime_attestation.py::test_oracle_assertion_record_limit_boundary_is_accepted tests/test_runtime_attestation.py::test_oracle_assertion_record_limit_is_enforced tests/test_runtime_attestation.py::test_signed_test_oracle_v3_accepts_subset_of_complete_collection_for_partial_use tests/test_runtime_attestation.py::test_signed_test_oracle_v2_rejects_v3_collection_fields tests/test_runtime_attestation.py::test_signed_test_oracle_v3_rejects_incomplete_callback_claims tests/test_runtime_attestation.py::test_signed_test_oracle_v2_requires_origins_for_each_selected_case tests/test_runtime_attestation.py::test_signed_test_oracle_v2_rejects_origins_missing_for_one_case tests/test_runtime_attestation.py::test_signed_test_oracle_v2_rejects_unproven_origins tests/test_runtime_attestation.py::test_signed_test_oracle_v1_does_not_accept_v2_origin_fields tests/test_runtime_attestation.py::test_signed_test_oracle_v2_rejects_wrong_dsse_payload_type tests/test_runtime_attestation.py::test_signed_test_oracle_rejects_non_string_schema tests/test_runtime_attestation.py::test_signed_test_oracle_rejects_invalid_claims tests/test_runtime_attestation.py::test_signed_test_oracle_rejects_wrong_expected_binding tests/test_runtime_attestation.py::test_signed_test_oracle_rejects_stale_or_long_lived_payload tests/test_runtime_attestation.py::test_signed_test_oracle_rejects_missing_role_revocation_and_pin_mismatch tests/test_runtime_attestation.py::test_signed_test_oracle_rejects_duplicate_json_and_tampered_signature tests/test_runtime_attestation.py::test_signed_test_oracle_rechecks_receipt_and_trust_bytes tests/test_runtime_attestation.py::test_signed_test_oracle_rejects_oversized_receipt tests/test_runtime_attestation.py::test_test_oracle_private_helpers_enforce_contracts
  - path: tests/test_runtime_audit.py
    command: py -3.11 -m pytest -q tests/test_runtime_audit.py
schema: factory.ssat.v1

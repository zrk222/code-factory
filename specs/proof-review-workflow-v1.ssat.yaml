name: proof-review-workflow-v1
language: python
modules:
  - name: proof_review_workflow
    path: factoryline/proof_review_workflow.py
    language: python
    functions:
      - name: create_intent_contract
        args: [root, contract_id, draft_path, confirmed_by]
        returns: dict
      - name: prove_trajectory
        args: [root, trace_path, policy_path, trajectory_id]
        returns: dict
      - name: create_quick_review
        args: [root, review_id, contract_path, changed]
        returns: dict
      - name: promote_regression
        args: [root, review_path, capsule_id, confirmed_by, title]
        returns: dict
      - name: team_proof_inbox
        args: [root]
        returns: dict
      - name: install_hook_pack
        args: [root]
        returns: dict
      - name: create_proof_card
        args: [root, review_path, card_id]
        returns: dict
      - name: proof_review_projection
        args: [root]
        returns: dict
  - name: graph_ops
    path: factoryline/graph_ops.py
    language: python
    functions:
      - name: graph_ops_snapshot
        args: [root]
        returns: dict
dependencies:
  - from: proof_review_workflow
    to: continuous_proof
  - from: graph_ops
    to: proof_review_workflow
invariants:
  - name: review_core_has_no_execution_or_network_authority
    forbid_pattern: "requests\\.|httpx\\.|urllib\\.|socket\\.|subprocess\\.|\\b(?:execute|merge|deploy|publish|sign|send_message|grant_connector)\\s*\\("
    scopes:
      - module: proof_review_workflow
        symbol: create_intent_contract
        max_lines: 80
      - module: proof_review_workflow
        symbol: prove_trajectory
        max_lines: 130
      - module: proof_review_workflow
        symbol: create_quick_review
        max_lines: 100
      - module: proof_review_workflow
        symbol: promote_regression
        max_lines: 80
      - module: proof_review_workflow
        symbol: team_proof_inbox
        max_lines: 80
      - module: proof_review_workflow
        symbol: create_proof_card
        max_lines: 80
  - name: inbox_projection_is_read_only
    forbid_pattern: "write_(?:text|bytes)\\(|mkdir\\(|replace\\(|_atomic\\("
    scopes:
      - module: proof_review_workflow
        symbol: team_proof_inbox
        max_lines: 80
      - module: proof_review_workflow
        symbol: proof_review_projection
        max_lines: 30
gates:
  - name: proof_review_contract
    command: "python -m pytest -q tests/test_audit_rule_search.py::test_req_pr_001_intent_contract_is_complete_confirmed_bound_and_immutable tests/test_audit_rule_search.py::test_req_pr_002_five_minute_review_has_exact_fail_closed_routes tests/test_audit_rule_search.py::test_req_pr_003_hook_pack_writes_five_templates_without_vendor_mutation tests/test_audit_rule_search.py::test_req_pr_004_failure_learning_requires_human_and_is_immutable tests/test_audit_rule_search.py::test_req_pr_005_team_inbox_prioritizes_human_work_and_keeps_claim_limits tests/test_audit_rule_search.py::test_req_pr_006_trajectory_enforces_order_scope_tools_and_independent_audit tests/test_audit_rule_search.py::test_req_pr_007_card_is_public_safe_and_offline_tamper_evident tests/test_audit_rule_search.py::test_req_pr_008_graph_ops_projects_read_only_team_inbox tests/test_audit_rule_search.py::test_req_pr_009_paths_are_workspace_contained_and_large_inputs_fail_closed tests/test_audit_rule_search.py::test_req_pr_010_cli_is_one_machine_readable_front_door_without_regression tests/test_audit_rule_search.py::test_strict_proof_review_binds_intake_scope_and_digest tests/test_audit_rule_search.py::test_strict_proof_review_rejects_missing_intake tests/test_audit_rule_search.py::test_empty_templates_are_versioned_and_authority_free tests/test_audit_rule_search.py::test_empty_projections_report_no_local_evidence_or_authority tests/test_audit_rule_search.py::test_deep_scan_projection_marks_unrun_state_without_promoting_assurance tests/test_audit_rule_search.py::test_sha_of_tracks_exact_bytes_and_absent_files tests/test_audit_rule_search.py::test_version_tuple_parses_release_components_and_rejects_invalid_versions tests/test_audit_rule_search.py::test_merkle_root_is_order_independent_and_rejects_empty_commitments tests/test_audit_rule_search.py::test_mermaid_for_emits_challenge_nodes_into_a_compact_proof_graph tests/test_audit_rule_search.py::test_dsse_pae_uses_utf8_byte_lengths_and_exact_payload_bytes tests/t
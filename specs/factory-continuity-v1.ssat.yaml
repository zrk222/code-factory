name: factory-continuity-v1
language: python
modules:
  - name: continuity
    path: factoryline/continuity.py
    functions:
      - name: record_continuity
        args: [store, principal, payload, idempotency_key]
        returns: dict
      - name: recall_continuity
        args: [store, principal, tenant_id, purpose_ref, scope_ref]
        returns: dict
      - name: promote_continuity
        args: [store, principal, tenant_id, record_id, reason]
        returns: dict
  - name: graph_ops
    path: factoryline/graph_ops.py
    functions:
      - name: graph_ops_snapshot
        args: [root]
        returns: dict
dependencies:
  - from: graph_ops
    to: continuity
invariants:
  - name: continuity_record_is_metadata_only
    forbid_pattern: "\\b(?:requests|httpx|urllib|socket)\\b"
    scopes:
      - module: continuity
        symbol: record_continuity
        max_lines: 75
  - name: recall_requires_exact_scope_and_purpose
    forbid_pattern: "\\b(?:subprocess|os\\.system|Popen)\\b"
    scopes:
      - module: continuity
        symbol: recall_continuity
        max_lines: 45
  - name: graph_ops_continuity_projection_is_read_only
    forbid_pattern: "\\b(?:write_text|write_bytes|execute\\s*\\(\\s*[\"'](?:INSERT|UPDATE|DELETE))"
    scopes:
      - module: graph_ops
        symbol: graph_ops_snapshot
        max_lines: 40
tests:
  - path: tests/test_continuity.py
    command: python -m pytest -q tests/test_continuity.py

name: semantic-authority-plane-v1
language: python
modules:
  - name: semantic_authority
    path: factoryline/semantic_authority.py
    functions:
      - name: seal_semantic_handoff
        args: [root, input_path, out]
        returns: dict[str, Any]
      - name: seal_authority_lease
        args: [root, input_path, out]
        returns: dict[str, Any]
      - name: authorize_semantic_action
        args: [root, lease_path, request]
        returns: dict[str, Any]
      - name: record_semantic_action_decision
        args: [root, lease_path, request, out]
        returns: dict[str, Any]
      - name: semantic_authority_projection
        args: [root]
        returns: dict[str, Any]
  - name: oracle_firewall
    path: factoryline/oracle_firewall.py
    functions:
      - name: verify_oracle_contract
        args: [root, contract_path]
        returns: dict[str, Any]
  - name: agent_proof_bridge
    path: factoryline/agent_proof_bridge.py
    functions:
      - name: import_agent_proof
        args: [root, envelope_path, out]
        returns: dict[str, Any]
  - name: graph_ops
    path: factoryline/graph_ops.py
    functions:
      - name: graph_ops_snapshot
        args: [root]
        returns: dict[str, Any]
  - name: mcp
    path: factoryline/mcp.py
    functions:
      - name: _semantic_authority_status
        args: [root, arguments]
        returns: dict[str, object]
dependencies:
  - from: semantic_authority
    to: oracle_firewall
  - from: agent_proof_bridge
    to: semantic_authority
  - from: agent_proof_bridge
    to: oracle_firewall
  - from: graph_ops
    to: semantic_authority
  - from: graph_ops
    to: oracle_firewall
  - from: graph_ops
    to: agent_proof_bridge
  - from: mcp
    to: semantic_authority
  - from: mcp
    to: graph_ops
  - from: mcp
    to: oracle_firewall
  - from: mcp
    to: agent_proof_bridge
invariants:
  - name: semantic_plane_never_executes
    forbid_pattern: "subprocess\\.|requests\\.|httpx\\.|urllib\\.|socket\\.|\\b(?:execute|repair|approve|merge|deploy|publish|sign|send_message|credential|connector)\\s*\\("
    scopes:
      - module: semantic_authority
        symbol: seal_semantic_handoff
        max_lines: 110
      - module: semantic_authority
        symbol: seal_authority_lease
        max_lines: 85
      - module: semantic_authority
        symbol: authorize_semantic_action
        max_lines: 55
      - module: semantic_authority
        symbol: record_semantic_action_decision
        max_lines: 45
  - name: graph_ops_is_read_only_projection
    forbid_pattern: "subprocess\\.|requests\\.|httpx\\.|urllib\\.|socket\\."
    scopes:
      - module: graph_ops
        symbol: _append_semantic_authority
        max_lines: 75
tests:
  - path: tests/test_semantic_authority.py
    command: py -3.11 -m pytest -q tests/test_semantic_authority.py
  - path: tests/test_agent_proof_bridge.py
    command: py -3.11 -m pytest -q tests/test_agent_proof_bridge.py
  - path: tests/test_graph_ops.py
    command: py -3.11 -m pytest -q tests/test_graph_ops.py tests/test_mcp.py
schema: factory.ssat.v1

name: source-worker-credential-rotation-v1
governance: supervised
modules:
  - name: credential_contract
    path: products/agent-cloud/app/runtime/sourceWorkerCredentials.ts
    imports: []
    functions: []
  - name: source_reference_contract
    path: products/agent-cloud/app/runtime/sourceAssurance.ts
    imports:
      - products/agent-cloud/app/runtime/sourceWorkerCredentials.ts
    functions: []
  - name: worker_service
    path: products/agent-cloud/app/runtime/sourceWorkerService.ts
    imports:
      - products/agent-cloud/app/runtime/sourceWorkerCredentials.ts
    functions: []
  - name: node_secret_adapter
    path: products/agent-cloud/app/runtime/sourceWorkerNodeSecrets.ts
    imports: []
    functions: []
  - name: worker_entrypoint
    path: products/agent-cloud/app/runtime/sourceWorkerEntrypoint.ts
    imports:
      - products/agent-cloud/app/runtime/sourceWorkerCredentials.ts
      - products/agent-cloud/app/runtime/sourceWorkerService.ts
    functions: []
  - name: credential_tests
    path: products/agent-cloud/app/runtime/sourceWorkerCredentials.test.ts
    imports:
      - products/agent-cloud/app/runtime/sourceWorkerCredentials.ts
    functions: []
dependencies:
  - from: source_reference_contract
    to: credential_contract
  - from: worker_service
    to: credential_contract
  - from: worker_entrypoint
    to: node_secret_adapter
  - from: worker_entrypoint
    to: credential_contract
  - from: worker_entrypoint
    to: worker_service
  - from: credential_tests
    to: credential_contract
invariants:
  - name: credential_contract_has_no_output_channel
    forbid_pattern: "console[.]|process[.](?:stdout|stderr)"
    scopes:
      - module: credential_contract
        symbol: parseWorkerIdentityConfig
        max_lines: 240
  - name: node_secret_adapter_has_no_dynamic_execution
    forbid_pattern: "child_process|\\b(?:eval|exec)\\s*\\("
    scopes:
      - module: node_secret_adapter
        symbol: readConfinedMountedSecret
        max_lines: 180
  - name: worker_service_never_stores_static_token
    forbid_pattern: "oidcToken|identityToken|bearerToken"
    scopes:
      - module: worker_service
        symbol: parseWorkerServiceConfig
        max_lines: 240
